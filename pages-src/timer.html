<div id="timer-body" style="display:none">
  <div class="timer-modes">
    <button class="timer-mode-btn active" data-tmode="countdown">Countdown</button>
    <button class="timer-mode-btn" data-tmode="stopwatch">Stopwatch</button>
  </div>
  <div class="timer-clock" id="timer-clock">05:00</div>
  <div class="timer-status" id="timer-status">Countdown &middot; Ready</div>
  <div class="timer-presets" id="timer-presets">
    <button class="timer-preset" data-mins="5">5 min</button>
    <button class="timer-preset" data-mins="10">10 min</button>
    <button class="timer-preset" data-mins="15">15 min</button>
    <button class="timer-preset" data-mins="25">25 min</button>
    <button class="timer-preset" data-mins="45">45 min</button>
  </div>
  <div class="timer-controls">
    <button class="timer-btn" id="timer-start">Start</button>
    <button class="timer-btn stop" id="timer-stop" disabled>Stop</button>
    <button class="timer-btn reset" id="timer-reset">Reset</button>
  </div>
</div>
