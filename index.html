  // The window's centre is always the viewport centre plus its (constant) centring
  // offset; the scale does not move it.
  function spAimMorph() {
    const win = el('sp-player');
    const pill = document.getElementById('spotify-pill');
    if (!win || !pill) return;
    const pr = pill.getBoundingClientRect();
    const winCx = window.innerWidth / 2;
    const winCy = window.innerHeight / 2;
    const pillCx = pr.left + pr.width / 2;
    const pillCy = pr.top + pr.height / 2;
    win.style.setProperty('--sp-dx', Math.round(pillCx - winCx) + 'px');
    win.style.setProperty('--sp-dy', Math.round(pillCy - winCy) + 'px');
  }

  function spOpenPlayer() {
    if (spPlayerOpen) return;
    spPlayerOpen = true;
    const bd = el('sp-player-backdrop');
    const win = el('sp-player');

    // Aim the closed state at the pill BEFORE anything else moves, then force a reflow
    // so the browser commits that as the transition's start value. Order matters twice
    // over: measuring after `body.sp-open` lands would read the pill already scaled up
    // by its lift, and without the reflow the class change and the start value land in
    // one style recalculation and the morph is skipped entirely ("opens instantly").
    if (win) {
      win.classList.remove('open');
      spAimMorph();
      void win.offsetWidth;
    }

    document.body.classList.add('sp-open');
    if (win) win.classList.add('open');
    if (bd) bd.classList.add('open');

    spErr('');
    spRefreshPlayer();
    // fit the grid once the open transition has finished, so the box is at full scale
    if (spPlaylistsLoaded) {
      setTimeout(function () {
        spFitGrid(document.querySelectorAll('.sp-pl-card').length);
      }, 480);
    } else {
      spLoadPlaylists(false);
    }
    spStartPoll();
  }

  function spClosePlayer() {
    if (!spPlayerOpen) return;
    spPlayerOpen = false;
    document.body.classList.remove('sp-open');
    const bd = el('sp-player-backdrop');
    const win = el('sp-player');
    // re-aim before removing the lift, for the same reason as the open path
    if (win) spAimMorph();
    if (bd) bd.classList.remove('open');
    if (win) win.classList.remove('open');
    spStopPoll();
  }

  // clicking the pill (but not its transport buttons) opens the window
  const pill = document.getElementById('spotify-pill');
  if (pill) {
    pill.addEventListener('click', function (ev) {
      // the three transport buttons keep their own behaviour
      if (ev.target.closest && ev.target.closest('.sp-btn')) return;
      spOpenPlayer();
    });
  }
  // keep the grid fitted when the window is resized while open
  window.addEventListener('resize', function () {
    if (spPlayerOpen && spPlaylistsLoaded) {
      requestAnimationFrame(function () {
        spFitGrid(document.querySelectorAll('.sp-pl-card').length);
      });
    }
  });
  if (el('sp-close')) el('sp-close').addEventListener('click', spClosePlayer);
  // clicking the blurred area closes it too
  if (el('sp-player-backdrop')) el('sp-player-backdrop').addEventListener('click', spClosePlayer);
  // clicks inside the window must not bubble to the backdrop
  if (el('sp-player')) el('sp-player').addEventListener('click', function (ev) { ev.stopPropagation(); });

  // ---- seek ----
  const seekEl = el('sp-seek');
  if (seekEl) {
    seekEl.addEventListener('input', function () {
      spDragging = true;
      const v = Number(seekEl.value);
      const dur = Number(seekEl.dataset.dur) || 0;
      if (dur > 0) {
        const ms = (v / 1000) * dur;
        if (el('sp-elapsed')) el('sp-elapsed').textContent = fmtTime(ms);
        if (el('sp-remain')) el('sp-remain').textContent = '-' + fmtTime(Math.max(0, dur - ms));
      }
    });
    seekEl.addEventListener('change', async function () {
      const v = Number(seekEl.value);
      const dur = Number(seekEl.dataset.dur) || 0;
      spDragging = false;
      if (!dur) return;
      const ms = Math.round((v / 1000) * dur);
      spSeeking = true;                       // hold the thumb until the echo lands
      try {
        await fetch(API + '/spotify/seek', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ position_ms: ms }),
        });
      } catch (e) { spErr('Seek failed'); }
      // give Spotify a moment to report the new position, then resume following it
      setTimeout(function () { spSeeking = false; spRefreshPlayer(); }, 700);
    });
  }

  // ---- volume ----
  const volEl = el('sp-vol');
  if (volEl) {
    let volSend = null;
    volEl.addEventListener('input', function () {
      spDraggingVol = true;
      if (el('sp-vol-val')) el('sp-vol-val').textContent = volEl.value + '%';
      // Debounce: dragging fires many input events and each one is a Spotify call.
      if (volSend) clearTimeout(volSend);
      const target = Number(volEl.value);
      volSend = setTimeout(async function () {
        try {
          await fetch(API + '/spotify/volume', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ volume_percent: target }),
          });
        } catch (e) { spErr('Volume change failed'); }
      }, 120);
    });
    volEl.addEventListener('change', function () {
      spDraggingVol = false;
      if (volSend) clearTimeout(volSend);
      const target = Number(volEl.value);
      fetch(API + '/spotify/volume', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ volume_percent: target }),
      }).then(() => setTimeout(spRefreshPlayer, 400)).catch(() => {});
    });
  }

  // ---- window transport ----
  if (el('spp-prev')) el('spp-prev').addEventListener('click', function () {
    fetch(API + '/spotify/prev', { method: 'POST' }).then(() => setTimeout(spRefreshPlayer, 700));
  });
  if (el('spp-next')) el('spp-next').addEventListener('click', function () {
    fetch(API + '/spotify/next', { method: 'POST' }).then(() => setTimeout(spRefreshPlayer, 700));
  });
  if (el('spp-toggle')) el('spp-toggle').addEventListener('click', function () {
    const pausePath = 'M6 5h4v14H6zM14 5h4v14h-4z';
    const big = el('sp-toggle-big');
    const playing = big && big.innerHTML.indexOf(pausePath) !== -1;
    fetch(API + '/spotify/' + (playing ? 'pause' : 'play'), { method: 'POST' })
      .then(() => setTimeout(spRefreshPlayer, 700));
  });

  // ================= Schedule window =================
  // Clicking the clock/date/agenda on home opens this. Same shell and morph as the
  // Spotify player, so both windows behave alike: day/week/month on the left, weather
  // on the right.
  //
  // Data: events come from :2008 /api/calendar/range for the visible period (one fetch
  // per view change, not per day), weather straight from open-meteo (keyless, same
  // endpoint the v1 mirror used).
  const SC_RANGE = 'http://localhost:2008/api/calendar/range';
  const SC_WX = 'https://api.open-meteo.com/v1/forecast'
    + '?latitude=-37.87&longitude=145.35'
    + '&current=temperature_2m,weather_code,apparent_temperature'
    + '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code'
    + '&timezone=Australia%2FSydney&forecast_days=5';
  // WMO weather codes -> words (open-meteo returns the numeric code)
  const SC_WMO = {
    0: 'Clear Sky', 1: 'Mainly Clear', 2: 'Partly Cloudy', 3: 'Overcast',
    45: 'Fog', 48: 'Rime Fog',
    51: 'Light Drizzle', 53: 'Drizzle', 55: 'Heavy Drizzle',
    56: 'Light Freezing Drizzle', 57: 'Freezing Drizzle',
    61: 'Light Rain', 63: 'Rain', 65: 'Heavy Rain',
    66: 'Light Freezing Rain', 67: 'Freezing Rain',
    71: 'Light Snow', 73: 'Snow', 75: 'Heavy Snow', 77: 'Snow Grains',
    80: 'Light Showers', 81: 'Showers', 82: 'Heavy Showers',
    85: 'Light Snow Showers', 86: 'Snow Showers',
    95: 'Thunderstorm', 96: 'Storm with Hail', 99: 'Severe Storm with Hail',
  };
  const scWmo = (c) => SC_WMO[c] || 'Unknown';

  let scOpen = false;
  let scView = 'day';                 // 'day' | 'week' | 'month'
  let scAnchor = new Date();          // the day/week/month currently shown
  let scEvents = [];                  // events for the visible period
  let scLoading = false;

  // ---- date helpers (all local-time; the mirror is en-AU) ----
  const scYMD = (d) => d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const scStartOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const scAddDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  // Monday-first, matching how the mirror reads a week
  const scStartOfWeek = (d) => {
    const s = scStartOfDay(d);
    return scAddDays(s, -((s.getDay() + 6) % 7));
  };
  const scStartOfMonth = (d) => new Date(d.getFullYear(), d.getMonth(), 1);
  const scSameDay = (a, b) => a.getFullYear() === b.getFullYear() &&
    a.getMonth() === b.getMonth() && a.getDate() === b.getDate();

  function scRangeFor() {
    if (scView === 'day') return [scStartOfDay(scAnchor), scStartOfDay(scAnchor)];
    if (scView === 'week') {
      const s = scStartOfWeek(scAnchor);
      return [s, scAddDays(s, 6)];
    }
    // month: cover the whole grid, including the leading/trailing days it shows
    const first = scStartOfMonth(scAnchor);
    const gridStart = scStartOfWeek(first);
    const last = new Date(scAnchor.getFullYear(), scAnchor.getMonth() + 1, 0);
    const gridEnd = scAddDays(scStartOfWeek(last), 6);
    return [gridStart, gridEnd];
  }

  function scPeriodLabel() {
    const M = ['January','February','March','April','May','June',
               'July','August','September','October','November','December'];
    if (scView === 'day') {
      return scAnchor.toLocaleDateString('en-AU',
        { weekday: 'long', day: 'numeric', month: 'long' });
    }
    if (scView === 'week') {
      const s = scStartOfWeek(scAnchor), e = scAddDays(s, 6);
      const sm = M[s.getMonth()].slice(0, 3), em = M[e.getMonth()].slice(0, 3);
      return s.getMonth() === e.getMonth()
        ? s.getDate() + ' - ' + e.getDate() + ' ' + sm
        : s.getDate() + ' ' + sm + ' - ' + e.getDate() + ' ' + em;
    }
    return M[scAnchor.getMonth()] + ' ' + scAnchor.getFullYear();
  }

  // events whose start falls on a given local day
  function scEventsOn(day) {
    return scEvents.filter(function (ev) {
      const s = new Date(ev.start);
      return scSameDay(s, day);
    }).sort(function (a, b) { return new Date(a.start) - new Date(b.start); });
  }

  function scTimeLabel(ev) {
    if (!ev.start) return 'All day';
    const s = new Date(ev.start), e = ev.end ? new Date(ev.end) : null;
    const f = (d) => d.toLocaleTimeString('en-AU',
      { hour: 'numeric', minute: '2-digit', hour12: true });
    // midnight-to-midnight reads as an all-day entry
    if (s.getHours() === 0 && s.getMinutes() === 0 && e &&
        e.getHours() === 0 && e.getMinutes() === 0) return 'All day';
    return f(s) + (e ? ' - ' + f(e) : '');
  }

  // ---- rendering ----
  function scRenderDay() {
    const host = el('sc-day');
    if (!host) return;
    host.innerHTML = '';
    const day = scStartOfDay(scAnchor);
    const evs = scEventsOn(day);
    if (!evs.length) {
      host.innerHTML = '<div id="sc-empty">Nothing scheduled for this day.</div>';
      return;
    }
    const now = new Date();
    evs.forEach(function (ev) {
      const s = new Date(ev.start), e = ev.end ? new Date(ev.end) : s;
      const row = document.createElement('div');
      row.className = 'sc-ev';
      if (e < now) row.classList.add('past');
      if (s <= now && now < e) row.classList.add('now');
      const allDay = scTimeLabel(ev) === 'All day';
      if (allDay) row.classList.add('all-day');

      const t = document.createElement('div');
      t.className = 'sc-ev-time';
      t.textContent = scTimeLabel(ev);
      row.appendChild(t);

      const m = document.createElement('div');
      m.className = 'sc-ev-main';
      const ti = document.createElement('div');
      ti.className = 'sc-ev-title';
      ti.textContent = ev.summary || '(untitled)';
      m.appendChild(ti);
      if (ev.location) {
        const lo = document.createElement('div');
        lo.className = 'sc-ev-loc';
        lo.textContent = ev.location;
        m.appendChild(lo);
      }
      row.appendChild(m);
      host.appendChild(row);
    });
  }

  function scRenderWeek() {
    const host = el('sc-week');
    if (!host) return;
    host.innerHTML = '';
    const start = scStartOfWeek(scAnchor);
    const today = new Date();
    for (let i = 0; i < 7; i++) {
      const day = scAddDays(start, i);
      const col = document.createElement('div');
      col.className = 'sc-daycol' + (scSameDay(day, today) ? ' today' : '');
      const h = document.createElement('div');
      h.className = 'h';
      h.innerHTML = day.toLocaleDateString('en-AU', { weekday: 'short' }) +
        '<span class="dnum">' + day.getDate() + '</span>';
      col.appendChild(h);
      const evs = document.createElement('div');
      evs.className = 'evs';
      scEventsOn(day).forEach(function (ev) {
        const chip = document.createElement('div');
        chip.className = 'sc-chip';
        chip.title = (ev.summary || '') + ' \u2014 ' + scTimeLabel(ev);
        const tt = document.createElement('span');
        tt.className = 'tt';
        // just the hour in the chip: the column is narrow
        const s = new Date(ev.start);
        tt.textContent = scTimeLabel(ev) === 'All day' ? ''
          : s.toLocaleTimeString('en-AU', { hour: 'numeric', hour12: true }).replace(' ', '');
        chip.appendChild(tt);
        chip.appendChild(document.createTextNode(ev.summary || '(untitled)'));
        evs.appendChild(chip);
      });
      col.appendChild(evs);
      host.appendChild(col);
    }
  }

  function scRenderMonth() {
    const host = el('sc-month');
    if (!host) return;
    host.innerHTML = '';
    const DOW = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    DOW.forEach(function (d) {
      const h = document.createElement('div');
      h.className = 'sc-mhead';
      h.textContent = d;
      host.appendChild(h);
    });
    const gridStart = scStartOfWeek(scStartOfMonth(scAnchor));
    const today = new Date();
    const month = scAnchor.getMonth();
    for (let i = 0; i < 42; i++) {
      const day = scAddDays(gridStart, i);
      const cell = document.createElement('div');
      cell.className = 'sc-mcell' +
        (day.getMonth() !== month ? ' out' : '') +
        (scSameDay(day, today) ? ' today' : '');
      const dn = document.createElement('div');
      dn.className = 'dn';
      dn.textContent = day.getDate();
      cell.appendChild(dn);
      const evs = scEventsOn(day);
      // two titles fit in a month cell; the rest become a count
      evs.slice(0, 2).forEach(function (ev) {
        const mini = document.createElement('div');
        mini.className = 'mini';
        mini.textContent = ev.summary || '(untitled)';
        cell.appendChild(mini);
      });
      if (evs.length > 2) {
        const more = document.createElement('div');
        more.className = 'more';
        more.textContent = '+' + (evs.length - 2) + ' more';
        cell.appendChild(more);
      }
      host.appendChild(cell);
    }
  }

  function scRender() {
    if (!scOpen) return;
    if (el('sc-period')) el('sc-period').textContent = scPeriodLabel();
    el('sc-day').style.display = scView === 'day' ? 'flex' : 'none';
    el('sc-week').style.display = scView === 'week' ? 'grid' : 'none';
    el('sc-month').style.display = scView === 'month' ? 'grid' : 'none';
    document.querySelectorAll('.sc-tab').forEach(function (b) {
      b.classList.toggle('active', b.dataset.view === scView);
    });
    if (scView === 'day') scRenderDay();
    else if (scView === 'week') scRenderWeek();
    else scRenderMonth();
  }

  async function scLoad() {
    const [a, b] = scRangeFor();
    if (el('sc-empty')) el('sc-empty').textContent = 'Loading...';
    scLoading = true;
    try {
      const r = await fetch(SC_RANGE + '?start=' + scYMD(a) + '&end=' + scYMD(b));
      const evs = await r.json();
      scEvents = Array.isArray(evs) ? evs : [];
    } catch (e) {
      scEvents = [];
      if (el('sc-period')) el('sc-period').textContent = 'Schedule unavailable';
    }
    scLoading = false;
    scRender();
  }

  function scSetView(v) {
    if (scView === v) return;
    scView = v;
    scLoad();
  }
  function scStep(dir) {
    // move one day / week / month, keeping the anchor's position in the period
    if (scView === 'day') scAnchor = scAddDays(scAnchor, dir);
    else if (scView === 'week') scAnchor = scAddDays(scAnchor, dir * 7);
    else scAnchor = new Date(scAnchor.getFullYear(), scAnchor.getMonth() + dir, 1);
    scLoad();
  }

  async function scLoadWeather() {
    const tempEl = el('sc-wx-temp'), condEl = el('sc-wx-cond');
    const feelsEl = el('sc-wx-feels'), daysEl = el('sc-wx-days'), errEl = el('sc-wx-err');
    if (!tempEl) return;
    try {
      const r = await fetch(SC_WX);
      const d = await r.json();
      const cur = d.current || {};
      const daily = d.daily || {};
      tempEl.innerHTML = Math.round(cur.temperature_2m) + '<small>&deg;</small>';
      condEl.textContent = scWmo(cur.weather_code);
      feelsEl.textContent = (cur.apparent_temperature != null)
        ? 'Feels like ' + Math.round(cur.apparent_temperature) + '\u00b0' : '';
      daysEl.innerHTML = '';
      (daily.time || []).forEach(function (iso, i) {
        const when = new Date(iso + 'T00:00:00');
        const row = document.createElement('div');
        row.className = 'sc-wxd';
        const day = document.createElement('div');
        day.className = 'd';
        day.textContent = i === 0 ? 'Today'
          : when.toLocaleDateString('en-AU', { weekday: 'short' });
        row.appendChild(day);
        const cond = document.createElement('div');
        cond.className = 'c';
        cond.textContent = scWmo(daily.weather_code && daily.weather_code[i]);
        row.appendChild(cond);
        const t = document.createElement('div');
        t.className = 't';
        t.innerHTML = Math.round(daily.temperature_2m_max[i]) + '\u00b0' +
          ' <span class="lo">' + Math.round(daily.temperature_2m_min[i]) + '\u00b0</span>';
        row.appendChild(t);
        daysEl.appendChild(row);
      });
      if (errEl) errEl.textContent = '';
    } catch (e) {
      condEl.textContent = 'Weather unavailable';
      if (errEl) errEl.textContent = 'Could not reach open-meteo.';
    }
  }

  // ---- open / close (mirrors the Spotify window's morph exactly) ----
  function scAimMorph() {
    const win = el('sc-window');
    const src = el('clockbox');
    if (!win || !src) return;
    const sr = src.getBoundingClientRect();
    win.style.setProperty('--sc-dx', Math.round((sr.left + sr.width / 2) - window.innerWidth / 2) + 'px');
    win.style.setProperty('--sc-dy', Math.round((sr.top + sr.height / 2) - window.innerHeight / 2) + 'px');
  }

  function scOpenWindow() {
    if (scOpen) return;
    scOpen = true;
    const win = el('sc-window'), bd = el('sc-backdrop');
    // aim at the clock before the class flips, then force a reflow so the morph runs
    if (win) { win.classList.remove('open'); scAimMorph(); void win.offsetWidth; }
    document.body.classList.add('sc-open');
    if (win) win.classList.add('open');
    if (bd) bd.classList.add('open');
    scAnchor = new Date();
    scLoad();
    scLoadWeather();
  }

  function scCloseWindow() {
    if (!scOpen) return;
    scOpen = false;
    document.body.classList.remove('sc-open');
    const win = el('sc-window'), bd = el('sc-backdrop');
    if (win) scAimMorph();
    if (bd) bd.classList.remove('open');
    if (win) win.classList.remove('open');
  }

  // wire it up
  const clockboxEl = document.getElementById('clockbox');
  if (clockboxEl) clockboxEl.addEventListener('click', scOpenWindow);
  if (el('sc-close')) el('sc-close').addEventListener('click', scCloseWindow);
  if (el('sc-backdrop')) el('sc-backdrop').addEventListener('click', scCloseWindow);
  if (el('sc-window')) el('sc-window').addEventListener('click', function (ev) { ev.stopPropagation(); });
  document.querySelectorAll('.sc-tab').forEach(function (b) {
    b.addEventListener('click', function () { scSetView(b.dataset.view); });
  });
  if (el('sc-prev')) el('sc-prev').addEventListener('click', function () { scStep(-1); });
  if (el('sc-next')) el('sc-next').addEventListener('click', function () { scStep(1); });
  if (el('sc-today-btn')) el('sc-today-btn').addEventListener('click', function () {
    scAnchor = new Date(); scLoad();
  });


  // ================= layout switching (router) =================
  // Orb state colours — also drives the dot in the voice panel header.
  const COLORS = { idle: '#00e676', listening: '#3b82f6', thinking: '#f59e0b', error: '#ef4444' };
  const LABELS = { idle: 'READY', listening: 'LISTENING', thinking: 'THINKING', error: 'ERROR' };
  function orbState(s) {
    const color = COLORS[s] || COLORS.idle;
    if (orbApi) orbApi.setColor(color);
    const ol = document.getElementById('orb-label');
    if (ol) ol.textContent = LABELS[s] || 'READY';
    const ind = document.getElementById('vc-ind');
    const st = document.getElementById('vc-state');
    if (ind) ind.className = s || '';
    if (st) st.textContent = LABELS[s] || 'READY';
  }

  // A page is one entry here: which layout it shows, its aliases, its title, which
  // content block to reveal, and what to load when it opens. There is no second
  // place to edit — the ring, the orb, the voice backend and the parent map are all
  // derived from / checked against this table.
  //
  // HOME ONLY. The rebuild site starts from the home screen and nothing else; every
  // other page was stripped out and will be added back one at a time. Keep this table
  // honest — a page missing here does not exist as far as the router, the ring, the
  // parent map and the voice backend are concerned.
  //
  //   mode: 'hub'  = orb + ring, no window (the ring contents come from RINGS)
  //         'leaf' = full window, orb parked small in the top-right corner
  const PAGE_LIST = [
    // layout        title            mode    body            loader
    { id: 'home',              title: '',             mode: 'hub'  },
  ];
  // Aliases: anything the voice model, a link or muscle memory might say. Every one
  // has to land on a page that still exists — home is the only destination now.
  const PAGE_ALIAS = {
    main: 'home', dashboard: 'home', 'main menu': 'home', menu: 'home', clock: 'home',
    start: 'home', home: 'home',
  };
  // Orb size per mode, in vmin. On a hub the size is per-hub so the home screen reads
  // as the main screen and the deeper hubs stay compact; the CSS block above carries
  // the matching hub size (26vmin) as the pre-JS value.
  const ORB_VMIN = { hub: 0.26, leaf: 0.13, home: 0.29 };
  const PAGE_ORB = { home: ORB_VMIN.home };
  const HUB_ORB_TOP_VMIN = 0.60;   // orb centre, as a fraction of viewport height
  const HUB_ORB_TOP_LEAF = 0.14;   // leaf pages park the orb in the top-right corner

  const PAGE = {};
  PAGE_LIST.forEach(function (p) { PAGE[p.id] = p; });

  // The body class carries the layout plus flags ('hub', 'vc-open'), so never treat
  // the whole className as a layout id — always resolve token by token.
  function canonicalLayout(layout) {
    var k = String(layout == null ? '' : layout).trim().toLowerCase().split(/\s+/)[0] || '';
    if (PAGE[k]) return k;
    if (PAGE_ALIAS[k]) return PAGE_ALIAS[k];
    return 'home';
  }
  function orbVmin(layout) {
    return (PAGE_ORB && PAGE_ORB[layout]) || (PAGE[layout] && PAGE[layout].mode === 'leaf' ? ORB_VMIN.leaf : ORB_VMIN.hub);
  }
  function currentLayout() {
    var toks = String(document.body.className || '').split(/\s+/);
    for (var i = 0; i < toks.length; i++) if (PAGE[toks[i]]) return toks[i];
    return 'home';
  }
  function isHub() { return PAGE[currentLayout()].mode === 'hub'; }

  function orbTopPx(layout) {
    // home places the orb from the measured page (see layoutHome); leaf pages anchor it
    // to the top edge; every other hub centres it in the ring
    if (layout === 'home') {
      const g = (typeof homeGeom === 'function') ? homeGeom() : null;
      if (g) return g.orbCy;
    }
    return (PAGE[layout] && PAGE[layout].mode === 'leaf')
      ? Math.min(window.innerWidth, window.innerHeight) * HUB_ORB_TOP_LEAF
      : window.innerHeight * HUB_ORB_TOP_VMIN;
  }

  // Content blocks that showLayout reveals one at a time. Empty while the site is
  // home-only — home has no window block at all, so nothing is ever revealed. Add a
  // page, add its body id here.
  var CONTENT_IDS = [];

  function showLayout(layout) {
    layout = canonicalLayout(layout);
    const page = PAGE[layout];
    const current = currentLayout();

    // Body class: the layout id plus, on hubs, the `hub` flag the CSS keys off.
    document.body.className = layout + (page.mode === 'hub' ? ' hub' : ' leaf');
    if (layout !== current) document.body.dataset.prevLayout = current;
    if (layout !== 'home') closeVoicePanel();
    if (orbApi) orbApi.setSize(Math.min(window.innerWidth, window.innerHeight) * orbVmin(layout));
    orbApi && orbApi.setTop && orbApi.setTop(orbTopPx(layout));
    if (page.mode === 'hub') { voicePanelOpen = false; document.body.classList.remove('vc-open'); }
    // home lays itself out from the live page (big orb, pill and agenda, no ring)
    if (layout === 'home') { try { layoutHome(); } catch (e) { console.error('home layout', e); } }

    // Reveal exactly one content block (or none, on a hub). No page has a window block
    // yet, so this loop is a no-op — it is the hook every rebuilt page plugs into: add
    // the page's body id to CONTENT_IDS and give its PAGE_LIST row a `body`.
    CONTENT_IDS.forEach(function (id) {
      const el = document.getElementById(id);
      if (el) { el.style.display = 'none'; el.style.flexDirection = ''; }
    });
    if (page.body) {
      const el = document.getElementById(page.body);
      if (el) el.style.display = 'flex';
    }

    renderAppRing();
    if (page.load && typeof window[page.load] === 'function') {
      try { window[page.load](); } catch (e) { console.error('load ' + page.load, e); }
    }
  }

  // ================= navigation =================
  // The orb is the up button. Navigation is a FIXED PARENT MAP (user's explicit
  // preference): leaf -> its hub -> apps -> home. Never a back-stack.
  // Home is the only page, so every "up" lands back on home — the orb and Escape both
  // route through here. As pages come back, restore their real parent.
  const PARENT = {
    home: 'home',
  };

  // The orb does one of four things, in this order of priority:
  //   1. panel is up   -> close it (and go back to full-size on the hub)
  //   2. an app page   -> back to the apps grid  (stays in the window)
  //   3. apps grid     -> close the window, back to the plain home screen
  //   4. somewhere else -> home
  //
  // Why the window checks live HERE and not in showLayout: the whole mirror is now one
  // layout ('home'), so showLayout('home') is a no-op when we are already on it - which
  // is exactly the case when the expanded window is open. Without these two checks the
  // orb appeared dead while the window was up.
  function orbUp() {
    const cur = currentLayout();
    if (voicePanelOpen) { closeVoicePanel(); return; }
    // hwOpen is `var` (hoisted), so typeof is a safe test. hwCurrentApp is declared with
    // `let` LATER in this script: `typeof x` on a `let` in its temporal dead zone THROWS
    // rather than returning 'undefined', so it must not be touched from here. The grid
    // view is detected from the DOM instead - #hw-page only carries .on when an app page
    // is mounted, which is the thing we actually want to know.
    const winOpen = (typeof hwOpen !== 'undefined') && hwOpen;
    if (winOpen) {
      const pageEl = el('hw-page');
      const onAppPage = !!(pageEl && pageEl.classList.contains('on'));
      if (onAppPage) { hwShowApps(); return; }   // page -> apps grid
      hwSet(false);                             // apps grid -> plain home
      return;
    }
    if (cur === 'home') return;        // already home, nothing to go back to
    showLayout(PARENT[cur] || 'home');
  }
  document.getElementById('orb').addEventListener('click', orbUp);

  // Escape always means "back", from anywhere, including inside a text box.
  // The two windows are the innermost layers: whichever is up closes first.
  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !e.repeat) {
      const t = e.target;
      const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA');
      if (scOpen) { scCloseWindow(); return; }
      if (spPlayerOpen) { spClosePlayer(); return; }
      // collapsed the expanded home window before backing out of the page
      if (typeof hwOpen !== 'undefined' && hwOpen) { hwSet(false); return; }
      if (typing && t.value) return;   // let a field's own Escape handler win
      orbUp();
    }
  });

  // Keep the ring wrapped around the orb through resizes and orientation changes.
  function relayout() {
    const cur = currentLayout();
    if (orbApi) {
      orbApi.setSize(Math.min(window.innerWidth, window.innerHeight) * orbVmin(cur));
      orbApi.setTop(orbTopPx(cur));
    }
    if (cur === 'home') layoutHome();
    renderAppRing();
  }
  window.addEventListener('resize', relayout);
  window.addEventListener('orientationchange', relayout);
  // ================= apps ring =================
  // The ring of buttons around the orb. It wraps the orb (same centre, same maths)
  // so nothing ever drifts, buttons size themselves to fit the ring, and every
  // button shows a one-line live status pulled from the page it opens — so the home
  // screen tells you something instead of being ten identical pills.

  // Label per button. Kept as a lookup because several pages read better in caps or
  // with a space (KANBAN -> TO DO). Rebuilt pages add their own line back here.
  function ringLabel(p) {
    return p.toUpperCase();
  }
  function ringStatus(p) {
    const s = RING_STATUS[p];
    return s ? String(s) : '';
  }

  // Hub -> the buttons that live on it. Everything downstream (orb up-button,
  // voice navigation, parent map) is derived from this one structure.
  // Six buttons is the most a hub ring can hold and stay readable on the mirror's
  // screen, so anything past six lives in a hub.
  // Home is ring-less by design, and it is the only page — so this table starts empty
  // and each rebuilt page adds itself back to its hub's row.
  const RINGS = {
    home:      [],      // home has NO ring — big orb + clock + Spotify + today's agenda
  };

  function ringButtons(cls) {
    const ids = RINGS[cls] || RINGS.home;
    return ids.map(id => ({ id: id, label: ringLabel(id), fn: () => showLayout(id) }));
  }

  // Ring geometry — solved against the live page so a button can never end up
  // off-screen, on top of the clock, or on top of the orb. The band between the
  // clock/agenda and the bottom of the screen is measured, the button size is derived
  // from it, and the ring radius is then the largest value satisfying three
  // constraints at once: vertical room in the band, horizontal room to the screen
  // edge, and arc room so neighbours do not touch. If no radius works, the buttons
  // shrink and the orb shrinks with them.
  function hubBand() {
    const vh = window.innerHeight;
    let top = 0;
    ['clockbox', 'spotify-pill'].forEach(function (id) {
      const el = document.getElementById(id);
      if (!el) return;
      const r = el.getBoundingClientRect();
      if (r.height) top = Math.max(top, r.bottom);
    });
    return { top: (top || vh * 0.22) + 12, bottom: vh - 18 };
  }

  // For a given button size, the ring radius must be no larger than the room left by
  // the band and the screen edges, and no smaller than what the arc per button and the
  // orb need. rMax falls as the button grows; rArc rises. So there is one crossing
  // point: binary-search it. The orb is then whatever fits inside the ring.
  // Solve the ring against the live page. For a given button size there is exactly one
  // sensible radius: the largest that keeps the top and bottom buttons inside the free
  // band and the side buttons on screen. As the button grows that radius shrinks while
  // the radius the buttons and orb need grows, so "does this size fit?" is monotone —
  // binary-search the largest size that fits, then place the ring at that radius.
  function ringFits(size, ctx) {
    const rVert = ctx.bandH / 2 - size / 2 - ctx.pad;
    const rHoriz = ctx.vw / 2 - size / 2 - 14;
    const r = Math.min(rVert, rHoriz);
    const need = Math.max((size * Math.SQRT2) / (2 * Math.sin(Math.PI / ctx.n)),  // neighbours keep clear
                          ctx.orb / 2 + size / 2 + 18);                          // orb stays inside
    return r >= need ? r : null;
  }

  function solveRing(n, band) {
    const vw = window.innerWidth, vh = window.innerHeight;
    const vmin = Math.min(vw, vh);
    const bandH = Math.max(band.bottom - band.top, vmin * 0.34);
    const cy = (band.top + band.bottom) / 2;
    const pad = 10;
    const density = n <= 2 ? 2.3 : n <= 4 ? 2.6 : 3.0;
    const ideal = Math.min(vmin * 0.23, bandH * 0.40, (vw * 0.94) / density);

    // the orb gives way first if it would force unusably small buttons
    let orb = Math.min(vmin * orbVmin(currentLayout()), vmin * 0.26);
    const orbCap = 2 * (bandH / 2 - pad - 46 / 2 - 18);
    if (orb > orbCap) orb = Math.max(vmin * 0.09, orbCap);

    const ctx = { n: n, vw: vw, bandH: bandH, pad: pad, orb: orb };
    let lo = 44, hi = Math.max(ideal, 46);
    if (ringFits(hi, ctx)) { lo = hi; }
    else {
      for (let i = 0; i < 44; i++) {              // fixed count: same answer every call
        const mid = (lo + hi) / 2;
        if (ringFits(mid, ctx)) lo = mid; else hi = mid;
      }
    }
    const size = lo;
    const r = ringFits(size, ctx) || Math.max(vmin * 0.11, orb / 2 + size / 2 + 18);
    return { cx: vw / 2, cy: cy, r: r, size: size, orb: orb, vmin: vmin, bandH: bandH };
  }

  function ringGeom(total) {
    const cur = currentLayout();
    const vmin = Math.min(window.innerWidth, window.innerHeight);
    if (PAGE[cur].mode !== 'hub') {
      const wantOrb = vmin * orbVmin(cur);
      return { cx: window.innerWidth / 2, cy: orbTopPx(cur), r: wantOrb * 1.6, size: vmin * 0.13, orb: wantOrb, vmin: vmin };
    }
    return solveRing(total, hubBand());
  }

  function renderAppRing() {
    const ring = document.getElementById('app-ring');
    if (!ring) return;
    ring.innerHTML = '';
    if (PAGE[currentLayout()].mode !== 'hub') return;   // leaf pages have no ring
    // home carries no ring: it lays itself out (big orb + pill + today's card) instead
    if (currentLayout() === 'home') { layoutHome(); return; }
    const items = ringButtons(currentLayout());
    const total = items.length;
    if (!total) return;

    const g = ringGeom(total);
    if (orbApi) {
      const now = document.getElementById('orb').width;
      if (Math.abs(now - g.orb) > 2) orbApi.setSize(g.orb);
      orbApi.setTop(Math.round(g.cy));
    }

    items.forEach((app, i) => {
      const ang = (-90 + (i * 360) / total) * Math.PI / 180;   // 12 o'clock first
      const btn = document.createElement('button');
      btn.className = 'app-btn';
      btn.type = 'button';
      btn.style.width = Math.round(g.size) + 'px';
      btn.style.height = Math.round(g.size) + 'px';
      btn.style.left = Math.round(g.cx + g.r * Math.cos(ang)) + 'px';
      btn.style.top = Math.round(g.cy + g.r * Math.sin(ang)) + 'px';
      const lab = document.createElement('span');
      lab.className = 'app-btn-label';
      lab.textContent = app.label;
      btn.appendChild(lab);
      const st = ringStatus(app.id);
      if (st) {
        const sub = document.createElement('span');
        sub.className = 'app-btn-sub';
        sub.textContent = st;
        btn.appendChild(sub);
      }
      btn.title = app.label + (st ? ' — ' + st : '');
      btn.addEventListener('click', () => app.fn && app.fn());
      ring.appendChild(btn);
      fitLabel(lab, btn, g.size);
    });
  }

  // Shrink a label until it fits its button, whatever the word length. This is what
  // lets SUPERVISING and MUSIC share one button size without either overflowing.
  function fitLabel(lab, btn, size) {
    let fs = Math.max(11, Math.min(size * 0.30, (size * 0.86) / Math.max(4, lab.textContent.length) * 1.55));
    lab.style.fontSize = fs.toFixed(1) + 'px';
    const avail = size - 18;
    for (let i = 0; i < 30; i++) {
      if (lab.scrollWidth <= avail && lab.scrollHeight <= avail) break;
      fs *= 0.93;
      if (fs < 8.5) break;
      lab.style.fontSize = fs.toFixed(1) + 'px';
    }
  }

  // Live status strip: fills the hub buttons with something worth reading.
  // Defined before the ring so nothing depends on hoisting quirks; each producer is
  // best-effort and a failed fetch just leaves that button plain.
  //
  // Home has no ring and is the only page, so there is nothing to fill yet — no point
  // polling :2008 every minute for buttons that do not exist. Each rebuilt page adds
  // its own producer back here (kanban -> open task count, schedule -> next event...).
  const RING_STATUS = {};
  function setRingStatus(id, text) {
    if (RING_STATUS[id] === text) return;
    RING_STATUS[id] = text;
    if (PAGE[currentLayout()].mode === 'hub') renderAppRing();
  }

  renderAppRing();

  // ================= home: today's schedule + big-orb layout =================
  // Home is a hub but has NO ring (user's spec): clock/date on top, the Spotify pill
  // under it, one big orb in the middle, today's schedule in a wide card underneath.
  // Placement is measured against the live page (clock height, pill height, viewport)
  // so nothing can overlap at any window size — never a hardcoded centre.
  // Home shows no schedule list: the agenda line under the clock (#c-agenda /
  // #c-agenda-time, written by refreshAgenda) is home's only schedule readout, and with
  // no card to size the orb against there is nothing else here to fetch.

  // Measure the live page and place pill and orb. With no card on home the orb takes the
  // whole space below the pill, so it is as large as the mirror allows.
  function homeGeom() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const vmin = Math.min(vw, vh);
    const clock = document.getElementById('clockbox');
    const pill = document.getElementById('spotify-pill');
    // Measure SETTLED geometry: #clockbox and #spotify-pill carry the .anim transition,
    // so straight after a page change they still report the position they are travelling
    // FROM (a leaf page parks the clock in the top-left corner) — which would place the
    // pill and the orb too high. Killing the transition resolves them to their final spot.
    const saved = [];
    [clock, pill].forEach(function (el) {
      if (el) { saved.push([el, el.style.transition]); el.style.transition = 'none'; }
    });
    const cr = clock ? clock.getBoundingClientRect() : { top: vh * 0.02, bottom: vh * 0.16 };
    const pr = pill ? pill.getBoundingClientRect() : { height: vmin * 0.09 };
    saved.forEach(function (s) { s[0].style.transition = s[1]; });

    const clockTop = cr.top || 0;
    const pillH = pr.height || vmin * 0.09;
    const gap = Math.max(10, vmin * 0.02);

    const pillTop = Math.max(cr.bottom + gap, clockTop + vmin * 0.14);
    const pillBottom = pillTop + pillH;

    // the orb takes the rest of the screen down to a small bottom margin
    const orbTop = pillBottom + gap;
    const orbBottom = vh - gap - vmin * 0.04;
    const orbSize = Math.max(vmin * 0.22,
      Math.min(vmin * 0.70, orbBottom - orbTop, vw * 0.56));
    return {
      vw: vw, vh: vh, vmin: vmin, pillTop: pillTop, pillBottom: pillBottom,
      orbCy: (orbTop + orbBottom) / 2, orbSize: orbSize,
      // the vertical middle of the top block (clock + pill). The parked orb lines up
      // with this so the top row reads as one band instead of two unrelated things.
      clockTop: clockTop,
      topMid: (clockTop + pillBottom) / 2,
    };
  }

  function layoutHome() {
    const g = homeGeom();
    // In voice mode the panel owns the right half: tuck the orb left and shrink it.
    // This lives here (not in applyVoiceLayout) because renderAppRing() also calls
    // layoutHome() on home — two places sizing the orb would fight each other.
    const shrink = (typeof voicePanelOpen !== 'undefined') && voicePanelOpen;
    // Expanded (swipe up): the orb parks small in the top-right corner instead, and the
    // window takes the space it left. This is the ONE place the home orb is positioned,
    // so the three states (normal / voice / expanded) can never fight each other.
    const expanded = (typeof hwOpen !== 'undefined') && hwOpen;
    const pill = document.getElementById('spotify-pill');
    const winEl = document.getElementById('hw-window');
    const wrap = document.getElementById('orbwrap');

    if (expanded) {
      // ---- orb parked top-right, small ----
      // Two alignments the user asked for:
      //   * the orb's CENTRE sits on the vertical middle of the clock+pill block, so the
      //     top row reads as one band
      //   * the orb is the rightmost thing, with the same margin the pill uses
      const size = Math.min(g.vmin * 0.22, g.vw * 0.2);
      const rightMargin = Math.max(26, g.vmin * 0.03);
      const cy = g.topMid;                          // lined up with the top block
      const cx = g.vw - rightMargin - size / 2;     // orb centre, measured from the right
      if (orbApi) { orbApi.setSize(size); orbApi.setTop(cy); }
      if (wrap) {
        wrap.style.width = Math.round(size) + 'px';
        wrap.style.height = Math.round(size) + 'px';
        wrap.style.left = Math.round(cx) + 'px';
        wrap.style.top = Math.round(cy) + 'px';
      }
      const glow = document.getElementById('orb-glow');
      if (glow) {
        glow.style.width = Math.round(size * 1.38) + 'px';
        glow.style.height = Math.round(size * 1.38) + 'px';
      }
      if (winEl) {
        // SIZED LIKE THE OTHER WINDOWS. The Spotify player and the schedule window are
        // both min(94vw, 1600px) x min(88vh, 940px); the apps window uses the same box so
        // switching between them never feels like a different screen. It still cannot
        // start until the parked orb has cleared, so the band is the real limit here and
        // the cap below only bites when there is room to spare.
        const bandTop = Math.max(g.pillBottom + 14, cy + size / 2 + 20);
        const bandBot = g.vh - 24;
        const bandH = Math.max(240, bandBot - bandTop);
        const winH = Math.min(bandH, g.vh * 0.88, 940);
        const winW = Math.min(g.vw * 0.94, 1600);
        winEl.style.left = Math.round(g.vw / 2) + 'px';    // centred on the viewport
        winEl.style.top = Math.round(bandTop + bandH / 2) + 'px';
        winEl.style.width = Math.round(winW) + 'px';
        winEl.style.height = Math.round(winH) + 'px';
      }
      if (pill) pill.style.top = Math.round(g.pillTop) + 'px';
      return;
    }

    // ---- collapsed: the big centred orb ----
    const size = shrink ? Math.min(g.orbSize, g.vmin * 0.22) : g.orbSize;
    const cy = shrink ? g.vh * 0.5 : g.orbCy;
    if (pill) pill.style.top = Math.round(g.pillTop) + 'px';
    if (orbApi) {
      orbApi.setSize(size);
      orbApi.setTop(cy);
    }
    if (wrap) {
      wrap.style.width = Math.round(size) + 'px';
      wrap.style.height = Math.round(size) + 'px';
      wrap.style.left = shrink ? '22vw' : '50%';
      wrap.style.top = Math.round(cy) + 'px';
    }
    const glow = document.getElementById('orb-glow');
    if (glow) {
      glow.style.width = Math.round(size * 1.38) + 'px';
      glow.style.height = Math.round(size * 1.38) + 'px';
    }
  }
  window.layoutHome = layoutHome;

  // ================= home: expand / collapse =================
  // Swipe up, drag up or press ArrowUp: the orb parks in the top-right corner
  // and a window opens in the space it left. The reverse gesture puts it back.
  //
  // The window is intentionally empty for now — it is the container the next screens get
  // built into. layoutHome() above does the geometry; this only owns the flag.
  var hwOpen = false;

  function hwSet(open) {
    if (hwOpen === open) return;
    hwOpen = open;
    document.body.classList.toggle('hw-open', open);
    layoutHome();
  }

  // the empty window does not close on click (it will hold controls later)
  const hwWinEl = document.getElementById('hw-window');
  if (hwWinEl) hwWinEl.addEventListener('click', function (ev) { ev.stopPropagation(); });

  // ================= window: apps grid =================
  // The window's default view. The app list is carried over from the previous mirror
  // (and the v1 PAGE_NOTES one-liners), grouped the way that mirror grouped its rings:
  // Life, Work, Tools.
  const HW_APPS = [
    { group: 'Life', apps: [
      { id: 'kanban',    name: 'To Do',     note: 'Google Tasks in priority columns' },
      { id: 'meds',      name: 'Medications', note: 'Medication list with editable counts' },
      { id: 'money',     name: 'Money',     note: 'Net worth, goals, subscriptions and the ledger' },
      { id: 'shopping',  name: 'Shopping',  note: 'Shared shopping list' },
      { id: 'habits',    name: 'Habits',    note: 'Daily habits and streaks' },
      { id: 'brain',     name: 'Brain',     note: 'Quick capture - thoughts to file later' },
    ]},
    { group: 'Work', apps: [
      { id: 'school',    name: 'School',    note: 'SACs and exams with dates' },
      { id: 'referee',   name: 'Referee',   note: 'Coaching, reffing, supervising and the rules model' },
    ]},
    { group: 'Tools', apps: [
      { id: 'news',      name: 'News',      note: 'Headlines, refreshed every ten minutes' },
      { id: 'timer',     name: 'Timer',     note: 'Countdown and stopwatch with presets' },
      { id: 'countdown', name: 'Countdown', note: 'Days until the next SAC, exam or appointment' },
      { id: 'whiteboard', name: 'Whiteboard', note: 'Draw on the mirror and save a PNG' },
    ]},
  ];

  // ---------------------------------------------------------------- page framework
  // Each app page is one entry in HW_PAGE: a render function that fills #hw-page-body
  // and may register a teardown (for timers/intervals) that runs when you leave the page.
  //
  //   HW_PAGE['meds'] = function (host) { host.innerHTML = '...'; return function(){...}; }
  //
  // A page is a plain DOM builder: no routing, no window chrome — the shell around it
  // already provides the title bar, the Apps button and the scrolling body.
  const HW_PAGE = {};
  const HW_TEARDOWN = {};        // id -> fn(), called when leaving the page
  let hwCurrentApp = null;

  // Shared helpers so every page formats and fetches the same way.
  const hwJ = (u) => fetch(u).then(r => r.json());
  const hwMoney = (n) => '$' + (Math.round(Number(n || 0) * 100) / 100)
    .toLocaleString('en-AU', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  const hwEsc = (s) => String(s == null ? '' : s);
  // strip the emoji the mirror avoids, and the [P0]-style tags the task titles carry
  const hwClean = (s) => String(s == null ? '' : s)
    .replace(/\[P\d+\]\s*/g, '')
    .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{23F0}-\u{23FF}\u{2B00}-\u{2BFF}]/gu, '');
  // el() helper for building nodes tersely inside a page
  function hwEl(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  const hwLS = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };

  // ====== APP PAGES (generated) ======

  // ---- kanban ----
  // ---- kanban (To Do) ----
  HW_PAGE['kanban'] = function (host) {
    var PGK_BASE = 'http://localhost:2008/api';
    var PGK_COLS = 4;

    host.innerHTML = '';

    var wrap = hwEl('div', 'pg-wrap');

    var bar = hwEl('div', 'pg-addbar');
    var inp = hwEl('input', 'pg-input');
    inp.type = 'text';
    inp.placeholder = 'Add a task...';
    var btn = hwEl('button', 'pg-btn', '+');
    bar.appendChild(inp);
    bar.appendChild(btn);
    wrap.appendChild(bar);

    var boardHost = hwEl('div');
    wrap.appendChild(boardHost);

    host.appendChild(wrap);

    var pgkDragId = null;
    var pgkSuppressClick = false;
    var pgkAlive = true;

    function pgkPost(path, body) {
      return fetch(PGK_BASE + path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }).then(function (r) { return r.json(); });
    }

    function pgkIsArray(x) {
      return Object.prototype.toString.call(x) === '[object Array]';
    }

    // [P0]..[P9] tag -> 0-9, no tag -> 9
    function pgkPrio(title) {
      var m = String(title === undefined || title === null ? '' : title).match(/\[P(\d+)\]/i);
      if (m) {
        var n = parseInt(m[1], 10);
        if (!isNaN(n) && n >= 0 && n <= 9) { return n; }
      }
      return 9;
    }

    function pgkBoardFail() {
      boardHost.innerHTML = '';
      boardHost.appendChild(hwEl('div', 'pg-empty', 'Could not load tasks'));
    }

    function pgkLoad() {
      hwJ(PGK_BASE + '/tasks').then(function (data) {
        if (!pgkAlive) { return; }
        pgkRender(data);
      }).catch(function () {
        if (!pgkAlive) { return; }
        pgkBoardFail();
      });
    }

    function pgkBuildCol(num, items) {
      var col = hwEl('div', 'pg-col');
      col.setAttribute('data-prio', String(num));

      var head = hwEl('div', 'pg-col-h');
      head.appendChild(document.createTextNode('P' + num));
      head.appendChild(hwEl('span', 'n', String(items.length)));
      col.appendChild(head);

      var body = hwEl('div', 'pg-col-body');
      body.setAttribute('data-prio', String(num));

      var i;
      for (i = 0; i < items.length; i++) {
        (function (task) {
          var card = hwEl('div', 'pg-tcard', hwClean(task.title));
          card.setAttribute('draggable', 'true');
          card.setAttribute('data-id', String(task.id));

          card.addEventListener('dragstart', function (e) {
            pgkDragId = task.id;
            if (e && e.dataTransfer) {
              try {
                e.dataTransfer.setData('text/plain', String(task.id));
                e.dataTransfer.effectAllowed = 'move';
              } catch (err) { /* ignore */ }
            }
          });

          card.addEventListener('dragend', function () {
            pgkDragId = null;
            pgkSuppressClick = true;
            setTimeout(function () { pgkSuppressClick = false; }, 250);
            pgkClearHover();
          });

          card.addEventListener('click', function () {
            if (pgkSuppressClick || pgkDragId !== null) { return; }
            pgkPost('/tasks/toggle', { id: task.id }).then(function () {
              return pgkLoad();
            }).catch(function () { /* keep board as-is */ });
          });

          body.appendChild(card);
        })(items[i]);
      }

      if (items.length === 0) {
        body.appendChild(hwEl('div', 'pg-muted', 'No tasks'));
      }

      body.addEventListener('dragover', function (e) {
        if (pgkDragId === null) { return; }
        e.preventDefault();
        if (e.dataTransfer) { e.dataTransfer.dropEffect = 'move'; }
        pgkAddHover(body);
      });

      body.addEventListener('dragleave', function (e) {
        var r = body.getBoundingClientRect();
        if (e && e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) {
          return;
        }
        body.className = 'pg-col-body';
        if (body.parentNode && body.parentNode.className) {
          body.parentNode.className = 'pg-col';
        }
      });

      body.addEventListener('drop', function (e) {
        e.preventDefault();
        pgkClearHover();
        var id = pgkDragId;
        if (id === null && e && e.dataTransfer) {
          try { id = e.dataTransfer.getData('text/plain'); } catch (err) { id = null; }
        }
        pgkDragId = null;
        if (id === null || id === '') { return; }
        pgkPost('/tasks/priority', { id: id, priority: num }).then(function () {
          return pgkLoad();
        }).catch(function () { return pgkLoad(); });
      });

      col.appendChild(body);
      return col;
    }

    function pgkClearHover() {
      var all = boardHost.getElementsByClassName('pg-col-body');
      var i;
      for (i = 0; i < all.length; i++) {
        all[i].className = 'pg-col-body';
        if (all[i].parentNode && all[i].parentNode.className) {
          all[i].parentNode.className = 'pg-col';
        }
      }
    }

    function pgkAddHover(node) {
      var all = boardHost.getElementsByClassName('pg-col-body');
      var i;
      for (i = 0; i < all.length; i++) {
        all[i].className = 'pg-col-body';
        if (all[i].parentNode && all[i].parentNode.className) {
          all[i].parentNode.className = 'pg-col';
        }
      }
      node.className = 'pg-col-body drop-hover';
      if (node.parentNode && node.parentNode.className) {
        node.parentNode.className = 'pg-col drop-hover';
      }
    }

    function pgkRender(data) {
      var tasks = pgkIsArray(data) ? data : [];
      var cols = [[], [], [], []];
      var lower = 0;
      var i;
      for (i = 0; i < tasks.length; i++) {
        var t = tasks[i];
        if (!t || t.done !== false) { continue; }
        var p = pgkPrio(t.title);
        if (p < PGK_COLS) {
          cols[p].push(t);
        } else {
          lower++;
        }
      }

      boardHost.innerHTML = '';

      var board = hwEl('div', 'pg-board');
      for (i = 0; i < PGK_COLS; i++) {
        board.appendChild(pgkBuildCol(i, cols[i]));
      }
      boardHost.appendChild(board);

      if (lower > 0) {
        boardHost.appendChild(hwEl('div', 'pg-muted', String(lower) + ' more task' + (lower === 1 ? '' : 's') + ' at lower priority'));
      }
    }

    function pgkAdd() {
      var title = String(inp.value || '').replace(/^\s+|\s+$/g, '');
      if (title === '') { return; }
      inp.value = '';
      pgkPost('/tasks/add', { title: title }).then(function () {
        return pgkLoad();
      }).catch(function () {
        boardHost.innerHTML = '';
        boardHost.appendChild(hwEl('div', 'pg-empty', 'Could not add task'));
      });
    }

    btn.addEventListener('click', pgkAdd);
    inp.addEventListener('keydown', function (e) {
      var key = e.key || e.keyCode;
      if (key === 'Enter' || key === 13) {
        e.preventDefault();
        pgkAdd();
      }
    });

    pgkLoad();

    var timer = setInterval(function () {
      if (pgkDragId === null) { pgkLoad(); }
    }, 60000);

    return function () {
      pgkAlive = false;
      clearInterval(timer);
    };
  };

  // ---- meds ----
  // Rebuilt from the previous mirror, which had two things this page had lost:
  //   1. the count is click-to-type, not just +/- (typing 12 beats tapping + twelve times)
  //   2. a cigarettes counter, kept as its own tinted row
  // Counts persist per name under padawan_meds_v1, so adding a medication later does not
  // wipe the others.
  HW_PAGE['meds'] = function (host) {
    host.innerHTML = '';

    var pgMedsKey = 'padawan_meds_v1';
    var pgMedsResetTimer = null;
    var pgMedsAlive = true;

    // edit this list: { key } is what the stored count is filed under
    var pgMedsMeds = [
      { key: 'Concerta',   name: 'Concerta',   dose: '36mg at 8am', note: 'taken' },
      { key: 'Fluoxetine', name: 'Fluoxetine', dose: '40mg at 8am', note: 'taken' },
      { key: 'Olanzapine', name: 'Olanzapine', dose: '30mg at 6pm', note: 'taken' }
    ];
    var pgMedsCigKey = 'Cigarettes';

    var pgMedsWrap = hwEl('div', 'pg-wrap');
    host.appendChild(pgMedsWrap);

    var pgMedsRows = hwEl('div', 'pg-wrap');
    pgMedsRows.style.gap = '12px';
    pgMedsWrap.appendChild(pgMedsRows);

    var pgMedsFoot = hwEl('div', 'pg-med-foot');
    var pgMedsHint = hwEl('div', 'pg-med-note',
      'Tap a number to type it. Counts are saved as you go.');
    pgMedsFoot.appendChild(pgMedsHint);

    var pgMedsResetBtn = hwEl('button', 'pg-btn warn', 'Reset all');
    pgMedsResetBtn.type = 'button';
    pgMedsFoot.appendChild(pgMedsResetBtn);
    pgMedsWrap.appendChild(pgMedsFoot);

    // ---------- storage ----------
    function pgMedsBlank() {
      var d = {};
      for (var i = 0; i < pgMedsMeds.length; i++) d[pgMedsMeds[i].key] = 0;
      d[pgMedsCigKey] = 0;
      return d;
    }

    function pgMedsRead() {
      var raw = hwLS.get(pgMedsKey, null);
      var out = pgMedsBlank();
      if (raw && typeof raw === 'object') {
        for (var k in out) {
          if (!Object.prototype.hasOwnProperty.call(out, k)) continue;
          var v = Number(raw[k]);
          if (v === v && v >= 0) out[k] = Math.floor(v);
        }
      }
      return out;
    }

    var pgMedsData = pgMedsRead();

    function pgMedsSave() {
      hwLS.set(pgMedsKey, pgMedsData);
    }

    // ---------- one row ----------
    function pgMedsRow(key, name, dose, isCig) {
      var row = hwEl('div', 'pg-row pg-med-row' + (isCig ? ' pg-cig' : ''));

      var main = hwEl('div', 'pg-main');
      main.appendChild(hwEl('div', 'pg-med-name', name));
      main.appendChild(hwEl('div', 'pg-med-dose', dose));
      // a SEPARATE note line: the dosage above must stay visible
      var note = hwEl('div', 'pg-med-note', '');
      main.appendChild(note);
      row.appendChild(main);

      var count = hwEl('div', 'pg-med-count');

      var minus = hwEl('button', 'pg-btn pg-med-btn', '\u2212');
      minus.type = 'button';
      minus.title = isCig ? 'One fewer left' : 'One fewer taken';

      var num = hwEl('div', 'pg-med-num', '0');
      num.setAttribute('role', 'button');
      num.setAttribute('tabindex', '0');
      num.title = 'Tap to type the number';

      var plus = hwEl('button', 'pg-btn pg-med-btn', '+');
      plus.type = 'button';
      plus.title = isCig ? 'One more left' : 'One more taken';

      count.appendChild(minus);
      count.appendChild(num);
      count.appendChild(plus);
      row.appendChild(count);

      function get() { return pgMedsData[key] || 0; }

      function set(v) {
        v = Math.max(0, Math.floor(Number(v) || 0));
        pgMedsData[key] = v;
        pgMedsSave();
        refresh();
      }

      function refresh() {
        if (!pgMedsAlive) return;
        var n = get();
        num.textContent = String(n);
        minus.disabled = n <= 0;
        note.textContent = isCig ? 'left' : noteFor(n);
      }

      function noteFor(n) {
        if (n === 0) return 'not taken yet';
        if (n === 1) return 'taken once';
        return 'taken ' + n + ' times';
      }

      // click-to-type: swap the readout for a number input, commit on blur/Enter
      function beginEdit() {
        if (!pgMedsAlive) return;
        if (row.querySelector('.pg-med-input')) return;      // already editing
        var input = document.createElement('input');
        input.type = 'number';
        input.min = '0';
        input.step = '1';
        input.inputMode = 'numeric';
        input.className = 'pg-med-input';
        input.value = String(get());
        num.style.display = 'none';
        num.parentNode.insertBefore(input, num);
        input.focus();
        input.select();

        var done = false;
        function commit(useTyped) {
          if (done) return;
          done = true;
          if (useTyped) set(parseInt(input.value, 10) || 0);
          if (input.parentNode) input.parentNode.removeChild(input);
          num.style.display = '';
          refresh();
        }

        input.addEventListener('blur', function () { commit(true); });
        input.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter') { ev.preventDefault(); commit(true); }
          if (ev.key === 'Escape') { ev.preventDefault(); commit(false); }
        });
      }

      num.addEventListener('click', beginEdit);
      num.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); beginEdit(); }
      });

      minus.onclick = function () { set(get() - 1); };
      plus.onclick = function () { set(get() + 1); };

      pgMedsRows.appendChild(row);
      refresh();
      return row;
    }

    for (var mi = 0; mi < pgMedsMeds.length; mi++) {
      var m = pgMedsMeds[mi];
      pgMedsRow(m.key, m.name, m.dose, false);
    }
    pgMedsRow(pgMedsCigKey, 'Cigarettes', 'left', true);

    // ---------- reset all (two-click, no alert) ----------
    function pgMedsDisarm() {
      if (pgMedsResetTimer) { clearTimeout(pgMedsResetTimer); pgMedsResetTimer = null; }
      pgMedsResetBtn.textContent = 'Reset all';
    }

    pgMedsResetBtn.onclick = function () {
      if (pgMedsResetBtn.textContent.indexOf('Sure') === -1) {
        pgMedsResetBtn.textContent = 'Sure?';
        if (pgMedsResetTimer) clearTimeout(pgMedsResetTimer);
        pgMedsResetTimer = setTimeout(pgMedsDisarm, 4000);
        return;
      }
      pgMedsDisarm();
      pgMedsData = pgMedsBlank();
      pgMedsSave();
      // re-render the whole page so every row picks up the zeroed values
      var page = document.getElementById('hw-page-body');
      if (page) HW_PAGE['meds'](page);
    };

    return function () {
      pgMedsAlive = false;
      if (pgMedsResetTimer) clearTimeout(pgMedsResetTimer);
      pgMedsResetTimer = null;
    };
  };

  // ---- money ----
  // Rebuilt from the previous mirror, which had four tabs and - the important part -
  // was fully EDITABLE: every figure on screen writes back to the money backend. The
  // version this replaces was read-only, which made it useless for actually tracking
  // money.
  //
  // Tabs: Overview (net worth, cash/savings cards, accounts), Goals, Subs, Ledger.
  // Every amount is tap-to-edit; every list has a delete control and an add bar.
  //
  // NOTE: this page talks to the real ledger at padawan/money_data.json. There is no
  // undo, so the delete controls are two-click (see pgMoneyArmDelete).
  HW_PAGE['money'] = function (host) {
    host.innerHTML = '';

    var pgMoneyAPI = 'http://localhost:2008/api/money';
    var pgMoneyTab = 'overview';
    var pgMoneyAlive = true;
    var pgMoneyArmTimer = null;
    var pgMoneyArmed = null;      // { btn, run } - pending second-click confirmation

    // ---------- shell ----------
    var pgMoneyWrap = hwEl('div', 'pg-wrap');
    host.appendChild(pgMoneyWrap);

    var pgMoneyTabs = hwEl('div');
    pgMoneyTabs.id = 'money-tabs';
    pgMoneyWrap.appendChild(pgMoneyTabs);

    var pgMoneyPane = hwEl('div');
    pgMoneyPane.id = 'money-pane';
    pgMoneyWrap.appendChild(pgMoneyPane);

    var pgMoneyAddZone = hwEl('div', 'money-addrow');
    pgMoneyWrap.appendChild(pgMoneyAddZone);

    var pgMoneyTabsList = [
      { id: 'overview', label: 'Overview' },
      { id: 'goals', label: 'Goals' },
      { id: 'subs', label: 'Subs' },
      { id: 'ledger', label: 'Ledger' }
    ];
    var pgMoneyTabBtns = {};

    for (var ti = 0; ti < pgMoneyTabsList.length; ti++) {
      (function (t) {
        var b = hwEl('button', 'money-tab' + (t.id === pgMoneyTab ? ' active' : ''), t.label);
        b.type = 'button';
        b.onclick = function () {
          pgMoneyTab = t.id;
          pgMoneySyncTabs();
          pgMoneyLoad();
        };
        pgMoneyTabBtns[t.id] = b;
        pgMoneyTabs.appendChild(b);
      })(pgMoneyTabsList[ti]);
    }

    function pgMoneySyncTabs() {
      for (var k in pgMoneyTabBtns) {
        if (!Object.prototype.hasOwnProperty.call(pgMoneyTabBtns, k)) continue;
        pgMoneyTabBtns[k].className = 'money-tab' + (k === pgMoneyTab ? ' active' : '');
      }
    }

    // ---------- helpers ----------
    function pgMoneyNum(v) {
      var n = Number(v);
      if (n !== n || n === Infinity || n === -Infinity) return 0;
      return n;
    }

    function pgMoneyFmt(n) {
      var v = pgMoneyNum(n);
      return '$' + v.toLocaleString('en-AU', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    }

    function pgMoneyPost(path, body) {
      return fetch(pgMoneyAPI + path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body || {})
      }).then(function (r) {
        // the backend answers with the updated figures; re-render from the source of truth
        return pgMoneyLoad();
      });
    }

    // second-click confirm: the backend has no undo, so a single stray tap on a delete
    // button must not remove a real account
    function pgMoneyDisarm() {
      if (pgMoneyArmTimer) { clearTimeout(pgMoneyArmTimer); pgMoneyArmTimer = null; }
      if (pgMoneyArmed && pgMoneyArmed.btn) {
        pgMoneyArmed.btn.textContent = pgMoneyArmed.btn.dataset.label || 'x';
        pgMoneyArmed.btn.classList.remove('pg-del-armed');
      }
      pgMoneyArmed = null;
    }

    function pgMoneyArmDelete(btn, run, label) {
      if (pgMoneyArmed && pgMoneyArmed.btn === btn) {
        pgMoneyDisarm();
        run();
        return;
      }
      pgMoneyDisarm();
      btn.dataset.label = label || 'x';
      pgMoneyArmed = { btn: btn, run: run };
      btn.textContent = 'sure?';
      btn.classList.add('pg-del-armed');
      pgMoneyArmTimer = setTimeout(pgMoneyDisarm, 4000);
    }

    // tap the amount to type a new one; Enter/blur commits, Escape cancels
    function pgMoneyEditable(node, get, save) {
      node.addEventListener('click', function () {
        if (node.querySelector('input')) return;
        var input = document.createElement('input');
        input.type = 'number';
        input.step = '0.01';
        input.min = '0';
        input.inputMode = 'decimal';
        input.className = 'money-amt-input';
        input.value = String(get());
        var original = node.textContent;
        node.textContent = '';
        node.appendChild(input);
        input.focus();
        input.select();

        var done = false;
        function finish(commit) {
          if (done) return;
          done = true;
          var raw = input.value.trim();
          if (commit && raw !== '' && raw !== String(get())) {
            save(parseFloat(raw) || 0);
          } else {
            node.textContent = original;      // nothing changed: put the text back
          }
        }
        input.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') { e.preventDefault(); finish(true); }
          if (e.key === 'Escape') { e.preventDefault(); finish(false); }
        });
        input.addEventListener('blur', function () { finish(true); });
      });
    }

    function pgMoneyAddBar(fields, buttonLabel, onAdd) {
      pgMoneyAddZone.innerHTML = '';
      var r = hwEl('div', 'r');
      var inputs = [];
      for (var i = 0; i < fields.length; i++) {
        var f = fields[i];
        var inp = hwEl('input', 'money-in2');
        inp.placeholder = f.placeholder;
        if (f.type) inp.type = f.type;
        if (f.type === 'number') { inp.min = '0'; inp.step = '0.01'; inp.inputMode = 'decimal'; }
        if (f.flex) inp.style.flex = f.flex;
        inputs.push(inp);
        r.appendChild(inp);
      }
      var btn = hwEl('button', 'money-in2', buttonLabel);
      btn.type = 'button';
      btn.style.flex = '0 0 auto';
      btn.style.width = 'auto';
      btn.style.padding = '0 22px';
      btn.onclick = function () { onAdd(inputs); };
      r.appendChild(btn);
      for (var j = 0; j < inputs.length; j++) {
        inputs[j].addEventListener('keydown', function (e) {
          if (e.key === 'Enter') { e.preventDefault(); onAdd(inputs); }
        });
      }
      pgMoneyAddZone.appendChild(r);
    }

    function pgMoneyShowError(msg) {
      pgMoneyPane.innerHTML = '';
      pgMoneyAddZone.innerHTML = '';
      pgMoneyPane.appendChild(hwEl('div', 'money-empty', msg));
    }

    // ---------- OVERVIEW ----------
    function pgMoneyOverview(d) {
      var accounts = (d && d.accounts) || {};
      var keys = Object.keys(accounts).sort();
      var accTotal = 0;
      for (var i = 0; i < keys.length; i++) accTotal += pgMoneyNum(accounts[keys[i]]);

      var hero = hwEl('div');
      hero.id = 'money-hero';
      var nw = hwEl('div', 'nw', pgMoneyFmt(d.netWorth));
      hero.appendChild(nw);
      hero.appendChild(hwEl('div', 'nwl', 'NET WORTH'));
      pgMoneyPane.appendChild(hero);

      var cards = hwEl('div');
      cards.id = 'money-cards';

      var cashN = hwEl('div', 'n', pgMoneyFmt(d.cash));
      var cashCard = hwEl('div', 'money-card');
      cashCard.appendChild(cashN);
      var cashL = hwEl('div', 'l');
      cashL.appendChild(document.createTextNode('CASH'));
      cashL.appendChild(hwEl('span', 'hint', 'tap to edit'));
      cashCard.appendChild(cashL);

      var savN = hwEl('div', 'n', pgMoneyFmt(d.savings));
      var savCard = hwEl('div', 'money-card');
