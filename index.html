  // Monday-first, matching how the mirror reads a week
  const scStartOfWeek = (d) => {
    const s = scStartOfDay(d);
    return scAddDays(s, -((s.getDay() + 6) % 7));
  };
  const scStartOfMonth = (d) => new Date(d.getFullYear(), d.getMonth(), 1);
  const scSameDay = (a, b) => a.getFullYear() === b.getFullYear() &&
    a.getMonth() === b.getMonth() && a.getDate() === b.getDate();

  function scRangeFor() {
    if (scView === 'day') return [scStartOfDay(scAnchor), scStartOfDay(scAnchor)];
    if (scView === 'week') {
      const s = scStartOfWeek(scAnchor);
      return [s, scAddDays(s, 6)];
    }
    // month: cover the whole grid, including the leading/trailing days it shows
    const first = scStartOfMonth(scAnchor);
    const gridStart = scStartOfWeek(first);
    const last = new Date(scAnchor.getFullYear(), scAnchor.getMonth() + 1, 0);
    const gridEnd = scAddDays(scStartOfWeek(last), 6);
    return [gridStart, gridEnd];
  }

  function scPeriodLabel() {
    const M = ['January','February','March','April','May','June',
               'July','August','September','October','November','December'];
    if (scView === 'day') {
      return scAnchor.toLocaleDateString('en-AU',
        { weekday: 'long', day: 'numeric', month: 'long' });
    }
    if (scView === 'week') {
      const s = scStartOfWeek(scAnchor), e = scAddDays(s, 6);
      const sm = M[s.getMonth()].slice(0, 3), em = M[e.getMonth()].slice(0, 3);
      return s.getMonth() === e.getMonth()
        ? s.getDate() + ' - ' + e.getDate() + ' ' + sm
        : s.getDate() + ' ' + sm + ' - ' + e.getDate() + ' ' + em;
    }
    return M[scAnchor.getMonth()] + ' ' + scAnchor.getFullYear();
  }

  // events whose start falls on a given local day
  function scEventsOn(day) {
    return scEvents.filter(function (ev) {
      const s = new Date(ev.start);
      return scSameDay(s, day);
    }).sort(function (a, b) { return new Date(a.start) - new Date(b.start); });
  }

  function scTimeLabel(ev) {
    if (!ev.start) return 'All day';
    const s = new Date(ev.start), e = ev.end ? new Date(ev.end) : null;
    const f = (d) => d.toLocaleTimeString('en-AU',
      { hour: 'numeric', minute: '2-digit', hour12: true });
    // midnight-to-midnight reads as an all-day entry
    if (s.getHours() === 0 && s.getMinutes() === 0 && e &&
        e.getHours() === 0 && e.getMinutes() === 0) return 'All day';
    return f(s) + (e ? ' - ' + f(e) : '');
  }

  // ---- rendering ----
  function scRenderDay() {
    const host = el('sc-day');
    if (!host) return;
    host.innerHTML = '';
    const day = scStartOfDay(scAnchor);
    const evs = scEventsOn(day);
    if (!evs.length) {
      host.innerHTML = '<div id="sc-empty">Nothing scheduled for this day.</div>';
      return;
    }
    const now = new Date();
    evs.forEach(function (ev) {
      const s = new Date(ev.start), e = ev.end ? new Date(ev.end) : s;
      const row = document.createElement('div');
      row.className = 'sc-ev';
      if (e < now) row.classList.add('past');
      if (s <= now && now < e) row.classList.add('now');
      const allDay = scTimeLabel(ev) === 'All day';
      if (allDay) row.classList.add('all-day');

      const t = document.createElement('div');
      t.className = 'sc-ev-time';
      t.textContent = scTimeLabel(ev);
      row.appendChild(t);

      const m = document.createElement('div');
      m.className = 'sc-ev-main';
      const ti = document.createElement('div');
      ti.className = 'sc-ev-title';
      ti.textContent = ev.summary || '(untitled)';
      m.appendChild(ti);
      if (ev.location) {
        const lo = document.createElement('div');
        lo.className = 'sc-ev-loc';
        lo.textContent = ev.location;
        m.appendChild(lo);
      }
      row.appendChild(m);
      host.appendChild(row);
    });
  }

  function scRenderWeek() {
    const host = el('sc-week');
    if (!host) return;
    host.innerHTML = '';
    const start = scStartOfWeek(scAnchor);
    const today = new Date();
    for (let i = 0; i < 7; i++) {
      const day = scAddDays(start, i);
      const col = document.createElement('div');
      col.className = 'sc-daycol' + (scSameDay(day, today) ? ' today' : '');
      const h = document.createElement('div');
      h.className = 'h';
      h.innerHTML = day.toLocaleDateString('en-AU', { weekday: 'short' }) +
        '<span class="dnum">' + day.getDate() + '</span>';
      col.appendChild(h);
      const evs = document.createElement('div');
      evs.className = 'evs';
      scEventsOn(day).forEach(function (ev) {
        const chip = document.createElement('div');
        chip.className = 'sc-chip';
        chip.title = (ev.summary || '') + ' \u2014 ' + scTimeLabel(ev);
        const tt = document.createElement('span');
        tt.className = 'tt';
        // just the hour in the chip: the column is narrow
        const s = new Date(ev.start);
        tt.textContent = scTimeLabel(ev) === 'All day' ? ''
          : s.toLocaleTimeString('en-AU', { hour: 'numeric', hour12: true }).replace(' ', '');
        chip.appendChild(tt);
        chip.appendChild(document.createTextNode(ev.summary || '(untitled)'));
        evs.appendChild(chip);
      });
      col.appendChild(evs);
      host.appendChild(col);
    }
  }

  function scRenderMonth() {
    const host = el('sc-month');
    if (!host) return;
    host.innerHTML = '';
    const DOW = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    DOW.forEach(function (d) {
      const h = document.createElement('div');
      h.className = 'sc-mhead';
      h.textContent = d;
      host.appendChild(h);
    });
    const gridStart = scStartOfWeek(scStartOfMonth(scAnchor));
    const today = new Date();
    const month = scAnchor.getMonth();
    for (let i = 0; i < 42; i++) {
      const day = scAddDays(gridStart, i);
      const cell = document.createElement('div');
      cell.className = 'sc-mcell' +
        (day.getMonth() !== month ? ' out' : '') +
        (scSameDay(day, today) ? ' today' : '');
      const dn = document.createElement('div');
      dn.className = 'dn';
      dn.textContent = day.getDate();
      cell.appendChild(dn);
      const evs = scEventsOn(day);
      // two titles fit in a month cell; the rest become a count
      evs.slice(0, 2).forEach(function (ev) {
        const mini = document.createElement('div');
        mini.className = 'mini';
        mini.textContent = ev.summary || '(untitled)';
        cell.appendChild(mini);
      });
      if (evs.length > 2) {
        const more = document.createElement('div');
        more.className = 'more';
        more.textContent = '+' + (evs.length - 2) + ' more';
        cell.appendChild(more);
      }
      host.appendChild(cell);
    }
  }

  function scRender() {
    if (!scOpen) return;
    if (el('sc-period')) el('sc-period').textContent = scPeriodLabel();
    el('sc-day').style.display = scView === 'day' ? 'flex' : 'none';
    el('sc-week').style.display = scView === 'week' ? 'grid' : 'none';
    el('sc-month').style.display = scView === 'month' ? 'grid' : 'none';
    document.querySelectorAll('.sc-tab').forEach(function (b) {
      b.classList.toggle('active', b.dataset.view === scView);
    });
    if (scView === 'day') scRenderDay();
    else if (scView === 'week') scRenderWeek();
    else scRenderMonth();
  }

  async function scLoad() {
    const [a, b] = scRangeFor();
    if (el('sc-empty')) el('sc-empty').textContent = 'Loading...';
    scLoading = true;
    try {
      const r = await fetch(SC_RANGE + '?start=' + scYMD(a) + '&end=' + scYMD(b));
      const evs = await r.json();
      scEvents = Array.isArray(evs) ? evs : [];
    } catch (e) {
      scEvents = [];
      if (el('sc-period')) el('sc-period').textContent = 'Schedule unavailable';
    }
    scLoading = false;
    scRender();
  }

  function scSetView(v) {
    if (scView === v) return;
    scView = v;
    scLoad();
  }
  function scStep(dir) {
    // move one day / week / month, keeping the anchor's position in the period
    if (scView === 'day') scAnchor = scAddDays(scAnchor, dir);
    else if (scView === 'week') scAnchor = scAddDays(scAnchor, dir * 7);
    else scAnchor = new Date(scAnchor.getFullYear(), scAnchor.getMonth() + dir, 1);
    scLoad();
  }

  async function scLoadWeather() {
    const tempEl = el('sc-wx-temp'), condEl = el('sc-wx-cond');
    const feelsEl = el('sc-wx-feels'), daysEl = el('sc-wx-days'), errEl = el('sc-wx-err');
    if (!tempEl) return;
    try {
      const r = await fetch(SC_WX);
      const d = await r.json();
      const cur = d.current || {};
      const daily = d.daily || {};
      tempEl.innerHTML = Math.round(cur.temperature_2m) + '<small>&deg;</small>';
      condEl.textContent = scWmo(cur.weather_code);
      feelsEl.textContent = (cur.apparent_temperature != null)
        ? 'Feels like ' + Math.round(cur.apparent_temperature) + '\u00b0' : '';
      daysEl.innerHTML = '';
      (daily.time || []).forEach(function (iso, i) {
        const when = new Date(iso + 'T00:00:00');
        const row = document.createElement('div');
        row.className = 'sc-wxd';
        const day = document.createElement('div');
        day.className = 'd';
        day.textContent = i === 0 ? 'Today'
          : when.toLocaleDateString('en-AU', { weekday: 'short' });
        row.appendChild(day);
        const cond = document.createElement('div');
        cond.className = 'c';
        cond.textContent = scWmo(daily.weather_code && daily.weather_code[i]);
        row.appendChild(cond);
        const t = document.createElement('div');
        t.className = 't';
        t.innerHTML = Math.round(daily.temperature_2m_max[i]) + '\u00b0' +
          ' <span class="lo">' + Math.round(daily.temperature_2m_min[i]) + '\u00b0</span>';
        row.appendChild(t);
        daysEl.appendChild(row);
      });
      if (errEl) errEl.textContent = '';
    } catch (e) {
      condEl.textContent = 'Weather unavailable';
      if (errEl) errEl.textContent = 'Could not reach open-meteo.';
    }
  }

  // ---- open / close (mirrors the Spotify window's morph exactly) ----
  function scAimMorph() {
    const win = el('sc-window');
    const src = el('clockbox');
    if (!win || !src) return;
    const sr = src.getBoundingClientRect();
    win.style.setProperty('--sc-dx', Math.round((sr.left + sr.width / 2) - window.innerWidth / 2) + 'px');
    win.style.setProperty('--sc-dy', Math.round((sr.top + sr.height / 2) - window.innerHeight / 2) + 'px');
  }

  function scOpenWindow() {
    if (scOpen) return;
    scOpen = true;
    const win = el('sc-window'), bd = el('sc-backdrop');
    // aim at the clock before the class flips, then force a reflow so the morph runs
    if (win) { win.classList.remove('open'); scAimMorph(); void win.offsetWidth; }
    document.body.classList.add('sc-open');
    if (win) win.classList.add('open');
    if (bd) bd.classList.add('open');
    scAnchor = new Date();
    scLoad();
    scLoadWeather();
  }

  function scCloseWindow() {
    if (!scOpen) return;
    scOpen = false;
    document.body.classList.remove('sc-open');
    const win = el('sc-window'), bd = el('sc-backdrop');
    if (win) scAimMorph();
    if (bd) bd.classList.remove('open');
    if (win) win.classList.remove('open');
  }

  // wire it up
  const clockboxEl = document.getElementById('clockbox');
  if (clockboxEl) clockboxEl.addEventListener('click', scOpenWindow);
  if (el('sc-close')) el('sc-close').addEventListener('click', scCloseWindow);
  if (el('sc-backdrop')) el('sc-backdrop').addEventListener('click', scCloseWindow);
  if (el('sc-window')) el('sc-window').addEventListener('click', function (ev) { ev.stopPropagation(); });
  document.querySelectorAll('.sc-tab').forEach(function (b) {
    b.addEventListener('click', function () { scSetView(b.dataset.view); });
  });
  if (el('sc-prev')) el('sc-prev').addEventListener('click', function () { scStep(-1); });
  if (el('sc-next')) el('sc-next').addEventListener('click', function () { scStep(1); });
  if (el('sc-today-btn')) el('sc-today-btn').addEventListener('click', function () {
    scAnchor = new Date(); scLoad();
  });


  // ================= layout switching (router) =================
  // Orb state colours — also drives the dot in the voice panel header.
  const COLORS = { idle: '#00e676', listening: '#3b82f6', thinking: '#f59e0b', error: '#ef4444' };
  const LABELS = { idle: 'READY', listening: 'LISTENING', thinking: 'THINKING', error: 'ERROR' };
  function orbState(s) {
    const color = COLORS[s] || COLORS.idle;
    if (orbApi) orbApi.setColor(color);
    const ol = document.getElementById('orb-label');
    if (ol) ol.textContent = LABELS[s] || 'READY';
    const ind = document.getElementById('vc-ind');
    const st = document.getElementById('vc-state');
    if (ind) ind.className = s || '';
    if (st) st.textContent = LABELS[s] || 'READY';
  }

  // A page is one entry here: which layout it shows, its aliases, its title, which
  // content block to reveal, and what to load when it opens. There is no second
  // place to edit — the ring, the orb, the voice backend and the parent map are all
  // derived from / checked against this table.
  //
  // HOME ONLY. The rebuild site starts from the home screen and nothing else; every
  // other page was stripped out and will be added back one at a time. Keep this table
  // honest — a page missing here does not exist as far as the router, the ring, the
  // parent map and the voice backend are concerned.
  //
  //   mode: 'hub'  = orb + ring, no window (the ring contents come from RINGS)
  //         'leaf' = full window, orb parked small in the top-right corner
  const PAGE_LIST = [
    // layout        title            mode    body            loader
    { id: 'home',              title: '',             mode: 'hub'  },
  ];
  // Aliases: anything the voice model, a link or muscle memory might say. Every one
  // has to land on a page that still exists — home is the only destination now.
  const PAGE_ALIAS = {
    main: 'home', dashboard: 'home', 'main menu': 'home', menu: 'home', clock: 'home',
    start: 'home', home: 'home',
  };
  // Orb size per mode, in vmin. On a hub the size is per-hub so the home screen reads
  // as the main screen and the deeper hubs stay compact; the CSS block above carries
  // the matching hub size (26vmin) as the pre-JS value.
  const ORB_VMIN = { hub: 0.26, leaf: 0.13, home: 0.29 };
  const PAGE_ORB = { home: ORB_VMIN.home };
  const HUB_ORB_TOP_VMIN = 0.60;   // orb centre, as a fraction of viewport height
  const HUB_ORB_TOP_LEAF = 0.14;   // leaf pages park the orb in the top-right corner

  const PAGE = {};
  PAGE_LIST.forEach(function (p) { PAGE[p.id] = p; });

  // The body class carries the layout plus flags ('hub', 'vc-open'), so never treat
  // the whole className as a layout id — always resolve token by token.
  function canonicalLayout(layout) {
    var k = String(layout == null ? '' : layout).trim().toLowerCase().split(/\s+/)[0] || '';
    if (PAGE[k]) return k;
    if (PAGE_ALIAS[k]) return PAGE_ALIAS[k];
    return 'home';
  }
  function orbVmin(layout) {
    return (PAGE_ORB && PAGE_ORB[layout]) || (PAGE[layout] && PAGE[layout].mode === 'leaf' ? ORB_VMIN.leaf : ORB_VMIN.hub);
  }
  function currentLayout() {
    var toks = String(document.body.className || '').split(/\s+/);
    for (var i = 0; i < toks.length; i++) if (PAGE[toks[i]]) return toks[i];
    return 'home';
  }
  function isHub() { return PAGE[currentLayout()].mode === 'hub'; }

  function orbTopPx(layout) {
    // home places the orb from the measured page (see layoutHome); leaf pages anchor it
    // to the top edge; every other hub centres it in the ring
    if (layout === 'home') {
      const g = (typeof homeGeom === 'function') ? homeGeom() : null;
      if (g) return g.orbCy;
    }
    return (PAGE[layout] && PAGE[layout].mode === 'leaf')
      ? Math.min(window.innerWidth, window.innerHeight) * HUB_ORB_TOP_LEAF
      : window.innerHeight * HUB_ORB_TOP_VMIN;
  }

  // Content blocks that showLayout reveals one at a time. Empty while the site is
  // home-only — home has no window block at all, so nothing is ever revealed. Add a
  // page, add its body id here.
  var CONTENT_IDS = [];

  function showLayout(layout) {
    layout = canonicalLayout(layout);
    const page = PAGE[layout];
    const current = currentLayout();

    // Body class: the layout id plus, on hubs, the `hub` flag the CSS keys off.
    document.body.className = layout + (page.mode === 'hub' ? ' hub' : ' leaf');
    if (layout !== current) document.body.dataset.prevLayout = current;
    if (layout !== 'home') closeVoicePanel();
    if (orbApi) orbApi.setSize(Math.min(window.innerWidth, window.innerHeight) * orbVmin(layout));
    orbApi && orbApi.setTop && orbApi.setTop(orbTopPx(layout));
    if (page.mode === 'hub') { voicePanelOpen = false; document.body.classList.remove('vc-open'); }
    // home lays itself out from the live page (big orb, pill and agenda, no ring)
    if (layout === 'home') { try { layoutHome(); } catch (e) { console.error('home layout', e); } }

    // Reveal exactly one content block (or none, on a hub). No page has a window block
    // yet, so this loop is a no-op — it is the hook every rebuilt page plugs into: add
    // the page's body id to CONTENT_IDS and give its PAGE_LIST row a `body`.
    CONTENT_IDS.forEach(function (id) {
      const el = document.getElementById(id);
      if (el) { el.style.display = 'none'; el.style.flexDirection = ''; }
    });
    if (page.body) {
      const el = document.getElementById(page.body);
      if (el) el.style.display = 'flex';
    }

    renderAppRing();
    if (page.load && typeof window[page.load] === 'function') {
      try { window[page.load](); } catch (e) { console.error('load ' + page.load, e); }
    }
  }

  // ================= navigation =================
  // The orb is the up button. Navigation is a FIXED PARENT MAP (user's explicit
  // preference): leaf -> its hub -> apps -> home. Never a back-stack.
  // Home is the only page, so every "up" lands back on home — the orb and Escape both
  // route through here. As pages come back, restore their real parent.
  const PARENT = {
    home: 'home',
  };

  // The orb does one of three things, in this order of priority:
  //   1. panel is up  -> close it (and go back to full-size on the hub)
  //   2. on an app    -> up to its parent hub
  //   3. somewhere else -> home
  function orbUp() {
    const cur = currentLayout();
    if (voicePanelOpen) { closeVoicePanel(); return; }
    showLayout(PARENT[cur] || 'home');
  }
  document.getElementById('orb').addEventListener('click', orbUp);

  // Escape always means "back", from anywhere, including inside a text box.
  // The two windows are the innermost layers: whichever is up closes first.
  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !e.repeat) {
      const t = e.target;
      const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA');
      if (scOpen) { scCloseWindow(); return; }
      if (spPlayerOpen) { spClosePlayer(); return; }
      // collapsed the expanded home window before backing out of the page
      if (typeof hwOpen !== 'undefined' && hwOpen) { hwSet(false); return; }
      if (typing && t.value) return;   // let a field's own Escape handler win
      orbUp();
    }
  });

  // Keep the ring wrapped around the orb through resizes and orientation changes.
  function relayout() {
    const cur = currentLayout();
    if (orbApi) {
      orbApi.setSize(Math.min(window.innerWidth, window.innerHeight) * orbVmin(cur));
      orbApi.setTop(orbTopPx(cur));
    }
    if (cur === 'home') layoutHome();
    renderAppRing();
  }
  window.addEventListener('resize', relayout);
  window.addEventListener('orientationchange', relayout);
  // ================= apps ring =================
  // The ring of buttons around the orb. It wraps the orb (same centre, same maths)
  // so nothing ever drifts, buttons size themselves to fit the ring, and every
  // button shows a one-line live status pulled from the page it opens — so the home
  // screen tells you something instead of being ten identical pills.

  // Label per button. Kept as a lookup because several pages read better in caps or
  // with a space (KANBAN -> TO DO). Rebuilt pages add their own line back here.
  function ringLabel(p) {
    return p.toUpperCase();
  }
  function ringStatus(p) {
    const s = RING_STATUS[p];
    return s ? String(s) : '';
  }

  // Hub -> the buttons that live on it. Everything downstream (orb up-button,
  // voice navigation, parent map) is derived from this one structure.
  // Six buttons is the most a hub ring can hold and stay readable on the mirror's
  // screen, so anything past six lives in a hub.
  // Home is ring-less by design, and it is the only page — so this table starts empty
  // and each rebuilt page adds itself back to its hub's row.
  const RINGS = {
    home:      [],      // home has NO ring — big orb + clock + Spotify + today's agenda
  };

  function ringButtons(cls) {
    const ids = RINGS[cls] || RINGS.home;
    return ids.map(id => ({ id: id, label: ringLabel(id), fn: () => showLayout(id) }));
  }

  // Ring geometry — solved against the live page so a button can never end up
  // off-screen, on top of the clock, or on top of the orb. The band between the
  // clock/agenda and the bottom of the screen is measured, the button size is derived
  // from it, and the ring radius is then the largest value satisfying three
  // constraints at once: vertical room in the band, horizontal room to the screen
  // edge, and arc room so neighbours do not touch. If no radius works, the buttons
  // shrink and the orb shrinks with them.
  function hubBand() {
    const vh = window.innerHeight;
    let top = 0;
    ['clockbox', 'spotify-pill'].forEach(function (id) {
      const el = document.getElementById(id);
      if (!el) return;
      const r = el.getBoundingClientRect();
      if (r.height) top = Math.max(top, r.bottom);
    });
    return { top: (top || vh * 0.22) + 12, bottom: vh - 18 };
  }

  // For a given button size, the ring radius must be no larger than the room left by
  // the band and the screen edges, and no smaller than what the arc per button and the
  // orb need. rMax falls as the button grows; rArc rises. So there is one crossing
  // point: binary-search it. The orb is then whatever fits inside the ring.
  // Solve the ring against the live page. For a given button size there is exactly one
  // sensible radius: the largest that keeps the top and bottom buttons inside the free
  // band and the side buttons on screen. As the button grows that radius shrinks while
  // the radius the buttons and orb need grows, so "does this size fit?" is monotone —
  // binary-search the largest size that fits, then place the ring at that radius.
  function ringFits(size, ctx) {
    const rVert = ctx.bandH / 2 - size / 2 - ctx.pad;
    const rHoriz = ctx.vw / 2 - size / 2 - 14;
    const r = Math.min(rVert, rHoriz);
    const need = Math.max((size * Math.SQRT2) / (2 * Math.sin(Math.PI / ctx.n)),  // neighbours keep clear
                          ctx.orb / 2 + size / 2 + 18);                          // orb stays inside
    return r >= need ? r : null;
  }

  function solveRing(n, band) {
    const vw = window.innerWidth, vh = window.innerHeight;
    const vmin = Math.min(vw, vh);
    const bandH = Math.max(band.bottom - band.top, vmin * 0.34);
    const cy = (band.top + band.bottom) / 2;
    const pad = 10;
    const density = n <= 2 ? 2.3 : n <= 4 ? 2.6 : 3.0;
    const ideal = Math.min(vmin * 0.23, bandH * 0.40, (vw * 0.94) / density);

    // the orb gives way first if it would force unusably small buttons
    let orb = Math.min(vmin * orbVmin(currentLayout()), vmin * 0.26);
    const orbCap = 2 * (bandH / 2 - pad - 46 / 2 - 18);
    if (orb > orbCap) orb = Math.max(vmin * 0.09, orbCap);

    const ctx = { n: n, vw: vw, bandH: bandH, pad: pad, orb: orb };
    let lo = 44, hi = Math.max(ideal, 46);
    if (ringFits(hi, ctx)) { lo = hi; }
    else {
      for (let i = 0; i < 44; i++) {              // fixed count: same answer every call
        const mid = (lo + hi) / 2;
        if (ringFits(mid, ctx)) lo = mid; else hi = mid;
      }
    }
    const size = lo;
    const r = ringFits(size, ctx) || Math.max(vmin * 0.11, orb / 2 + size / 2 + 18);
    return { cx: vw / 2, cy: cy, r: r, size: size, orb: orb, vmin: vmin, bandH: bandH };
  }

  function ringGeom(total) {
    const cur = currentLayout();
    const vmin = Math.min(window.innerWidth, window.innerHeight);
    if (PAGE[cur].mode !== 'hub') {
      const wantOrb = vmin * orbVmin(cur);
      return { cx: window.innerWidth / 2, cy: orbTopPx(cur), r: wantOrb * 1.6, size: vmin * 0.13, orb: wantOrb, vmin: vmin };
    }
    return solveRing(total, hubBand());
  }

  function renderAppRing() {
    const ring = document.getElementById('app-ring');
    if (!ring) return;
    ring.innerHTML = '';
    if (PAGE[currentLayout()].mode !== 'hub') return;   // leaf pages have no ring
    // home carries no ring: it lays itself out (big orb + pill + today's card) instead
    if (currentLayout() === 'home') { layoutHome(); return; }
    const items = ringButtons(currentLayout());
    const total = items.length;
    if (!total) return;

    const g = ringGeom(total);
    if (orbApi) {
      const now = document.getElementById('orb').width;
      if (Math.abs(now - g.orb) > 2) orbApi.setSize(g.orb);
      orbApi.setTop(Math.round(g.cy));
    }

    items.forEach((app, i) => {
      const ang = (-90 + (i * 360) / total) * Math.PI / 180;   // 12 o'clock first
      const btn = document.createElement('button');
      btn.className = 'app-btn';
      btn.type = 'button';
      btn.style.width = Math.round(g.size) + 'px';
      btn.style.height = Math.round(g.size) + 'px';
      btn.style.left = Math.round(g.cx + g.r * Math.cos(ang)) + 'px';
      btn.style.top = Math.round(g.cy + g.r * Math.sin(ang)) + 'px';
      const lab = document.createElement('span');
      lab.className = 'app-btn-label';
      lab.textContent = app.label;
      btn.appendChild(lab);
      const st = ringStatus(app.id);
      if (st) {
        const sub = document.createElement('span');
        sub.className = 'app-btn-sub';
        sub.textContent = st;
        btn.appendChild(sub);
      }
      btn.title = app.label + (st ? ' — ' + st : '');
      btn.addEventListener('click', () => app.fn && app.fn());
      ring.appendChild(btn);
      fitLabel(lab, btn, g.size);
    });
  }

  // Shrink a label until it fits its button, whatever the word length. This is what
  // lets SUPERVISING and MUSIC share one button size without either overflowing.
  function fitLabel(lab, btn, size) {
    let fs = Math.max(11, Math.min(size * 0.30, (size * 0.86) / Math.max(4, lab.textContent.length) * 1.55));
    lab.style.fontSize = fs.toFixed(1) + 'px';
    const avail = size - 18;
    for (let i = 0; i < 30; i++) {
      if (lab.scrollWidth <= avail && lab.scrollHeight <= avail) break;
      fs *= 0.93;
      if (fs < 8.5) break;
      lab.style.fontSize = fs.toFixed(1) + 'px';
    }
  }

  // Live status strip: fills the hub buttons with something worth reading.
  // Defined before the ring so nothing depends on hoisting quirks; each producer is
  // best-effort and a failed fetch just leaves that button plain.
  //
  // Home has no ring and is the only page, so there is nothing to fill yet — no point
  // polling :2008 every minute for buttons that do not exist. Each rebuilt page adds
  // its own producer back here (kanban -> open task count, schedule -> next event...).
  const RING_STATUS = {};
  function setRingStatus(id, text) {
    if (RING_STATUS[id] === text) return;
    RING_STATUS[id] = text;
    if (PAGE[currentLayout()].mode === 'hub') renderAppRing();
  }

  renderAppRing();

  // ================= home: today's schedule + big-orb layout =================
  // Home is a hub but has NO ring (user's spec): clock/date on top, the Spotify pill
  // under it, one big orb in the middle, today's schedule in a wide card underneath.
  // Placement is measured against the live page (clock height, pill height, viewport)
  // so nothing can overlap at any window size — never a hardcoded centre.
  // Home shows no schedule list: the agenda line under the clock (#c-agenda /
  // #c-agenda-time, written by refreshAgenda) is home's only schedule readout, and with
  // no card to size the orb against there is nothing else here to fetch.

  // Measure the live page and place pill and orb. With no card on home the orb takes the
  // whole space below the pill, so it is as large as the mirror allows.
  function homeGeom() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const vmin = Math.min(vw, vh);
    const clock = document.getElementById('clockbox');
    const pill = document.getElementById('spotify-pill');
    // Measure SETTLED geometry: #clockbox and #spotify-pill carry the .anim transition,
    // so straight after a page change they still report the position they are travelling
    // FROM (a leaf page parks the clock in the top-left corner) — which would place the
    // pill and the orb too high. Killing the transition resolves them to their final spot.
    const saved = [];
    [clock, pill].forEach(function (el) {
      if (el) { saved.push([el, el.style.transition]); el.style.transition = 'none'; }
    });
    const cr = clock ? clock.getBoundingClientRect() : { top: vh * 0.02, bottom: vh * 0.16 };
    const pr = pill ? pill.getBoundingClientRect() : { height: vmin * 0.09 };
    saved.forEach(function (s) { s[0].style.transition = s[1]; });

    const clockTop = cr.top || 0;
    const pillH = pr.height || vmin * 0.09;
    const gap = Math.max(10, vmin * 0.02);

    const pillTop = Math.max(cr.bottom + gap, clockTop + vmin * 0.14);
    const pillBottom = pillTop + pillH;

    // the orb has the rest of the screen, minus a strip at the bottom for the arrow.
    // Reserving it here (rather than placing the arrow after the fact) is what stops the
    // arrow hanging off the bottom of the screen when the orb fills the viewport.
    const arrowStrip = Math.max(56, vmin * 0.075);
    const orbTop = pillBottom + gap;
    const orbBottom = vh - gap - arrowStrip;
    const orbSize = Math.max(vmin * 0.22,
      Math.min(vmin * 0.70, orbBottom - orbTop, vw * 0.56));
    return {
      vw: vw, vh: vh, vmin: vmin, pillTop: pillTop, pillBottom: pillBottom,
      orbCy: (orbTop + orbBottom) / 2, orbSize: orbSize, arrowStrip: arrowStrip,
      // the vertical middle of the top block (clock + pill). The parked orb lines up
      // with this so the top row reads as one band instead of two unrelated things.
      clockTop: clockTop,
      topMid: (clockTop + pillBottom) / 2,
    };
  }

  function layoutHome() {
    const g = homeGeom();
    // In voice mode the panel owns the right half: tuck the orb left and shrink it.
    // This lives here (not in applyVoiceLayout) because renderAppRing() also calls
    // layoutHome() on home — two places sizing the orb would fight each other.
    const shrink = (typeof voicePanelOpen !== 'undefined') && voicePanelOpen;
    // Expanded (swipe up): the orb parks small in the top-right corner instead, and the
    // window takes the space it left. This is the ONE place the home orb is positioned,
    // so the three states (normal / voice / expanded) can never fight each other.
    const expanded = (typeof hwOpen !== 'undefined') && hwOpen;
    const pill = document.getElementById('spotify-pill');
    const winEl = document.getElementById('hw-window');
    const arrowEl = document.getElementById('hw-arrow');
    const wrap = document.getElementById('orbwrap');

    if (expanded) {
      // ---- orb parked top-right, small ----
      // Two alignments the user asked for:
      //   * the orb's CENTRE sits on the vertical middle of the clock+pill block, so the
      //     top row reads as one band
      //   * the orb is the rightmost thing, with the same margin the pill uses
      const size = Math.min(g.vmin * 0.22, g.vw * 0.2);
      const rightMargin = Math.max(26, g.vmin * 0.03);
      const cy = g.topMid;                          // lined up with the top block
      const cx = g.vw - rightMargin - size / 2;     // orb centre, measured from the right
      if (orbApi) { orbApi.setSize(size); orbApi.setTop(cy); }
      if (wrap) {
        wrap.style.width = Math.round(size) + 'px';
        wrap.style.height = Math.round(size) + 'px';
        wrap.style.left = Math.round(cx) + 'px';
        wrap.style.top = Math.round(cy) + 'px';
      }
      const glow = document.getElementById('orb-glow');
      if (glow) {
        glow.style.width = Math.round(size * 1.38) + 'px';
        glow.style.height = Math.round(size * 1.38) + 'px';
      }
      if (arrowEl) {
        // arrow tucks directly under the parked orb, same x
        arrowEl.style.left = Math.round(cx) + 'px';
        arrowEl.style.top = Math.round(cy + size / 2 + 40) + 'px';
      }
      if (winEl) {
        // The window is CENTRED on the viewport axis (same as the clock and pill above it)
        // and centred vertically in the space below the orb/arrow. It is capped short of
        // the full band so the centring is visible as an even gap above and below, rather
        // than the window hugging the top with all the slack at the bottom.
        const bandTop = Math.max(g.pillBottom + 14, cy + size / 2 + 40 + 32 + 14);
        const bandBot = g.vh - 24;
        const bandH = Math.max(240, bandBot - bandTop);
        const winH = Math.min(bandH, 660);                 // capped so the gap is even
        const orbColumn = rightMargin + size;              // width the corner orb occupies
        const winW = Math.min(g.vw * 0.86, g.vw - orbColumn - 40);
        winEl.style.left = Math.round(g.vw / 2) + 'px';    // centred on the viewport
        winEl.style.top = Math.round(bandTop + bandH / 2) + 'px';
        winEl.style.width = Math.round(winW) + 'px';
        winEl.style.height = Math.round(winH) + 'px';
      }
      if (pill) pill.style.top = Math.round(g.pillTop) + 'px';
      return;
    }

    // ---- collapsed: the big centred orb ----
    const size = shrink ? Math.min(g.orbSize, g.vmin * 0.22) : g.orbSize;
    const cy = shrink ? g.vh * 0.5 : g.orbCy;
    if (pill) pill.style.top = Math.round(g.pillTop) + 'px';
    if (orbApi) {
      orbApi.setSize(size);
      orbApi.setTop(cy);
    }
    if (wrap) {
      wrap.style.width = Math.round(size) + 'px';
      wrap.style.height = Math.round(size) + 'px';
      wrap.style.left = shrink ? '22vw' : '50%';
      wrap.style.top = Math.round(cy) + 'px';
    }
    const glow = document.getElementById('orb-glow');
    if (glow) {
      glow.style.width = Math.round(size * 1.38) + 'px';
      glow.style.height = Math.round(size * 1.38) + 'px';
    }
    if (arrowEl) {
      // sits in the strip reserved under the orb, centred
      arrowEl.style.left = (shrink ? '22vw' : '50%');
      arrowEl.style.top = Math.round(cy + size / 2 + g.arrowStrip / 2) + 'px';
    }
  }
  window.layoutHome = layoutHome;

  // ================= home: expand / collapse =================
  // Swipe up (or the up arrow) parks the orb in the top-right corner and opens a window
  // in the space it left; swipe down / the down arrow / Escape puts it back.
  //
  // The window is intentionally empty for now — it is the container the next screens get
  // built into. layoutHome() above does the geometry; this only owns the flag.
  var hwOpen = false;

  function hwSet(open) {
    if (hwOpen === open) return;
    hwOpen = open;
    document.body.classList.toggle('hw-open', open);
    layoutHome();
  }
  const hwToggle = () => hwSet(!hwOpen);

  const hwArrowEl = document.getElementById('hw-arrow');
  if (hwArrowEl) {
    hwArrowEl.addEventListener('click', function (ev) {
      ev.stopPropagation();
      hwToggle();
    });
  }
  // the empty window does not close on click (it will hold controls later)
  const hwWinEl = document.getElementById('hw-window');
  if (hwWinEl) hwWinEl.addEventListener('click', function (ev) { ev.stopPropagation(); });

  // ---- swipe up / down on the home screen ----
  // Only fires when the gesture is clearly vertical and long enough, so it cannot be
  // confused with a tap on the orb or a drag inside a slider.
  (function wireHomeSwipe() {
    let sy = 0, sx = 0, tracking = false;
    const THRESH = 70;          // px of travel before it counts as a swipe
    const SLOP = 60;            // horizontal slop allowed before it is treated as a drag
    window.addEventListener('touchstart', function (e) {
      if (!document.body.classList.contains('home')) return;
      if (!e.touches || e.touches.length !== 1) return;
      const t = e.target;
      // never hijack a control
      if (t && t.closest && t.closest('input, textarea, button, #sp-player, #sc-window, #vc-panel')) return;
      sy = e.touches[0].clientY; sx = e.touches[0].clientX; tracking = true;
    }, { passive: true });
    window.addEventListener('touchend', function (e) {
      if (!tracking) return;
      tracking = false;
      if (!document.body.classList.contains('home')) return;
      const ct = (e.changedTouches && e.changedTouches[0]);
      if (!ct) return;
      const dy = ct.clientY - sy, dx = ct.clientX - sx;
      if (Math.abs(dx) > SLOP || Math.abs(dy) < THRESH) return;
      if (dy < 0) hwSet(true);          // swipe up -> expand
      else hwSet(false);                // swipe down -> collapse
    }, { passive: true });
    // Trackpads and mice: wheel up/down over the home background does the same thing,
    // debounced so one flick is one toggle.
    let wheelLock = 0;
    window.addEventListener('wheel', function (e) {
      if (!document.body.classList.contains('home')) return;
      if (vcOpenLike()) return;
      const t = e.target;
      if (t && t.closest && t.closest('input, textarea, #sp-player, #sc-window, #vc-panel')) return;
      if (Math.abs(e.deltaY) < 24 || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
      const now = Date.now();
      if (now < wheelLock) return;
      wheelLock = now + 700;
      hwSet(e.deltaY < 0);
    }, { passive: true });

    // ---- mouse / trackpad DRAG ----
    // Press on the home background and drag up or down, the same gesture a touch screen
    // uses. Only starts on a non-interactive target so it cannot steal a click from the
    // orb, the pill or any control.
    let dragY = null, dragX = null, dragMoved = false;
    const DRAG_THRESH = 70, DRAG_SLOP = 60;
    window.addEventListener('mousedown', function (e) {
      if (!document.body.classList.contains('home')) return;
      if (e.button !== 0) return;
      if (vcOpenLike()) return;
      const t = e.target;
      if (t && t.closest && t.closest('button, input, textarea, a, #sp-player, #sc-window, #vc-panel, #hw-window')) return;
      dragY = e.clientY; dragX = e.clientX; dragMoved = false;
    });
    window.addEventListener('mousemove', function (e) {
      if (dragY === null) return;
      if (Math.abs(e.clientY - dragY) > 4 || Math.abs(e.clientX - dragX) > 4) dragMoved = true;
    });
    window.addEventListener('mouseup', function (e) {
      if (dragY === null) return;
      const dy = e.clientY - dragY, dx = e.clientX - dragX;
      dragY = null; dragX = null;
      if (!document.body.classList.contains('home')) return;
      if (!dragMoved) return;                              // a click, not a drag
      if (Math.abs(dx) > DRAG_SLOP || Math.abs(dy) < DRAG_THRESH) return;
      if (dy < 0) hwSet(true);                            // dragged up -> expand
      else hwSet(false);                                  // dragged down -> collapse
    });

    // ---- keyboard ----
    // Up arrow (or PageUp) expands, Down arrow (or PageDown) collapses. Arrow keys are
    // only claimed when there is nothing to scroll and no window is taking input, so they
    // still work normally inside the schedule and Spotify windows.
    window.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown' &&
          e.key !== 'PageUp' && e.key !== 'PageDown') return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (!document.body.classList.contains('home')) return;
      if (vcOpenLike()) return;
      const t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      // inside a scrollable window, leave the arrows to the scroll
      if (t && t.closest && t.closest('#sp-player, #sc-window, #vc-panel')) return;
      e.preventDefault();
      const up = (e.key === 'ArrowUp' || e.key === 'PageUp');
      hwSet(up);
    });

    function vcOpenLike() {
      return (typeof voicePanelOpen !== 'undefined' && voicePanelOpen) ||
             (typeof spPlayerOpen !== 'undefined' && spPlayerOpen) ||
             (typeof scOpen !== 'undefined' && scOpen);
    }
  })();
  // ================= voice chat (wake word + Space) =================
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  const recog = SpeechRec ? new SpeechRec() : null;
  if (recog) { recog.continuous = true; recog.interimResults = true; recog.lang = 'en-AU'; }
  let voiceBusy = false;
  // NB: `var`, not `let` — layoutHome() (called by renderAppRing during this script's own
  // execution) reads it, and a `let` here would still be in its temporal dead zone:
  // `typeof x` does NOT protect against TDZ, it throws.
  var voicePanelOpen = false;          // whether the voice-chat transcript panel is open on home

  function openVoicePanel() {
    voicePanelOpen = true;
    document.body.classList.add('vc-open');
    applyVoiceLayout();
    if (currentLayout() === 'home') layoutHome();   // one place sizes the home orb
  }
  function closeVoicePanel() {
    if (!voicePanelOpen && !document.body.classList.contains('vc-open')) return;
    voicePanelOpen = false;
    document.body.classList.remove('vc-open');
    applyVoiceLayout();
    if (currentLayout() === 'home') layoutHome();
  }
  // Voice mode works on ANY page now, not just home: the panel takes the right half
  // and everything else steps aside (CSS: body.hub.vc-open / body.vc-open).
  function applyVoiceLayout() {
    const cur = currentLayout();
    if (!orbApi) return;
    const v = Math.min(window.innerWidth, window.innerHeight);
    if (PAGE[cur].mode === 'hub') {
      if (cur === 'home') {
        // home has no ring: shrink the big orb into the left gap while the panel is up
        const g = homeGeom();
        orbApi.setSize(voicePanelOpen ? Math.min(g.orbSize, g.vmin * 0.22) : g.orbSize);
        orbApi.setTop(voicePanelOpen ? g.vh * 0.5 : g.orbCy);
        const wrap = document.getElementById('orbwrap');
        if (wrap) { wrap.style.left = voicePanelOpen ? '22vw' : '50%'; }
      } else {
        orbApi.setSize(v * (voicePanelOpen ? 0.22 : orbVmin(cur)));
        orbApi.setTop(voicePanelOpen ? window.innerHeight * 0.5 : orbTopPx(cur));
      }
    }
    renderAppRing();
  }

  function vcAppend(cls, text) {
    const box = document.getElementById('vc-scroll');
    if (!box) return;
    const el = document.createElement('div');
    el.className = 'chat-msg ' + cls;
    el.textContent = text || '';
    box.appendChild(el);
    box.scrollTop = box.scrollHeight;
  }
  function vcClear() { const box = document.getElementById('vc-scroll'); if (box) box.innerHTML = ''; }
  // vcClear kept for debugging via console: vcClear() empties the transcript

  function sendVoice(text) {
    if (voiceBusy) return;
    const v = (text || '').trim();
    if (!v) return;
    voiceBusy = true; orbState('thinking');
    vcAppend('you', v);
    // abort if the backend hangs (keeps wake word alive)
    const abort = new AbortController();
    const kill = setTimeout(() => abort.abort(), 45000);
    fetch('http://localhost:2009/api/a2ui/send', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: v, session_id: 'voice-' + location.port }), signal: abort.signal })
      .then(r => r.json())
      .then(d => {
        clearTimeout(kill);
        if (d.ok) {
          orbState('idle');
          const clean = (d.reply || '').replace(/\[\[\s*SHOW\s+[^\]]*\]\]/gi, '').trim();
          vcAppend('bot', clean);
          speak(clean);
          if (d.show) {
            // navigating — close the voice panel and switch to the requested page
            stopVoice(); closeVoicePanel();
            showLayout(d.show);
          }
        } else { orbState('error'); vcAppend('err', d.error || 'Error'); }
      })
      .catch(() => { orbState('error'); vcAppend('err', 'Backend unreachable on :2009'); })
      .then(() => { voiceBusy = false; });
  }

  let ttsPause = false;                // echo guard: true while the mirror is talking
  function speak(text) {
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{23F0}-\u{23FF}\u{2B00}-\u{2BFF}]/gu, ''));
      u.lang = 'en-AU';
      // echo guard: pause recognition while the mirror talks so the mic
      // doesn't transcribe its own voice and loop it back as a command
      u.onstart = () => { ttsPause = true; try { recog && recog.abort(); } catch (err) {} };
      u.onend = () => {
        ttsPause = false;
        setTimeout(() => { if (recog && !recog._on) { try { recog.start(); } catch (err) {} } }, 300);
      };
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  function startListen() {
    if (!recog || recog._on) return;
    recog._on = true;
    try { recog.start(); } catch (e) {}
  }

  // ── typed input ─────────────────────────────────────────────────────
  // Same brain, no microphone. Enter sends, Escape leaves the field (and the
  // window-level Escape then back-steps a level).
  (function wireVoiceInput() {
    const inp = document.getElementById('vc-input');
    const btn = document.getElementById('vc-send');
    if (!inp || !btn) return;
    function submit() {
      const v = inp.value.trim();
      if (!v) return;
      inp.value = '';
      openVoicePanel();
      sendVoice(v);
    }
    btn.addEventListener('click', submit);
    inp.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); submit(); }
      else if (e.key === 'Escape') { inp.blur(); }
    });
  })();

  // ── wake word state machine ─────────────────────────────────────────
  // standby: always listening, waiting for "jarvis" or "padawan" to activate.
  // active:   panel open, every phrase is sent to the assistant; "stop" /
  //           "sleep" / "goodbye" (or Space) returns to standby.
  let active = false;
  const WAKE = /\b(jarvis|padawan)\b/i;
  const DEACTIVATE = /\b(stop|sleep|goodbye|quiet|go to sleep)\b/i;

  function activate() {
    active = true;
    openVoicePanel();
    orbState('listening');
    if (typeof speak === 'function') speak("Yes?");
  }
  function deactivate() {
    active = false;
    shownText = '';
    closeVoicePanel();
    orbState('idle');
  }

  let shownText = '';
  if (recog) {
    recog.onresult = function (e) {
      // collect final transcripts from this event
      let phrase = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) phrase += (e.results[i][0].transcript || '');
      }
      const t = phrase.trim();
      if (!t) return;

      // deactivation (only when active)
      if (active && DEACTIVATE.test(t)) { deactivate(); return; }

      // strip wake word if present (works in both states)
      let command = t;
      const wm = t.match(WAKE);
      const woke = wm && !active;
      if (wm) {
        command = t.replace(WAKE, '').trim()
          .replace(/^(hey|ok|okay|oi|yo|hi|hello)\b[,\s]*/i, '').trim()
          .replace(/^[,\s]+|[,\s]+$/g, '');
      }

      if (woke) {
        // first wake: open the speech page; send a command only if one came attached
        activate();
        if (command && command.length > 2) sendVoice(command);
        return;
      }

      // active mode: send the phrase (wake word stripped if it rode along)
      if (active) {
        if (command && command.length > 1 && command !== shownText) { shownText = command; sendVoice(command); }
        return;
      }

      // standby: ignore non-wake speech
    };
    recog.onend = function () {
      recog._on = false;
      // keep always-on standby listening (mirror is persistent);
      // hold off while TTS is speaking (echo guard) or the tab is hidden
      setTimeout(function () {
        if (!document.hidden && !ttsPause && recog && !recog._on) {
          try { recog.start(); } catch (err) {}
        }
      }, 200);
    };
    recog.onerror = function (e) {
      recog._on = false;
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        orbState('error');
        return;
      }
      // transient error -> resume standby listening (unless TTS is talking)
      setTimeout(function () {
        if (!ttsPause && recog && !recog._on) { try { recog.start(); } catch (err) {} }
      }, 300);
    };
    // start standby listening on load (browser will ask once for mic permission)
    startListen();
  }

  // Space toggles active<->standby voice chat.
  window.addEventListener('keydown', function (e) {
    if (e.target !== document.body) return;
    if (e.code !== 'Space' || e.repeat) return;
    // the player owns the screen while it is up — Space must not wake the mic behind it
    if (spPlayerOpen) return;
    e.preventDefault();
    if (active) { stopVoice(); deactivate(); }
    else { activate(); }
  });

  function stopVoice() {
    shownText = '';
    orbState('idle');
  }
// ================= boot =================
// Bring the mirror up on home. There is only one page while the site is being
// rebuilt, so anything in the URL or localStorage that is not home simply lands on
// home — a stale #schedule from the old site must not strand a blank screen.
(function boot() {
  function start() {
    showLayout('home');
    setTimeout(relayout, 320);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();

  // remember the page across reloads (the mirror is left running for days)
  var _showLayout = showLayout;
  showLayout = function (l) {
    _showLayout(l);
    try { localStorage.setItem('padawan.layout', canonicalLayout(l)); } catch (e) {}
  };
  window.addEventListener('hashchange', function () {
    showLayout(canonicalLayout(location.hash.replace(/^#/, '')));
  });
})();
</script>
</body>
</html>
