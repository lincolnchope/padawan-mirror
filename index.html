<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Padawan Mirror</title>
<style>
  :root {
    --orb-color: #00e676;
    --bg-1: #0a2e1a; --bg-2: #061a0f; --bg-3: #020a05;
    --text: #eef7f0; --muted: #a9c8b6; --accent: #7ff0b8;
    --card: rgba(255,255,255,.05); --card-border: rgba(255,255,255,.14);
    /* One typeface everywhere. Inter ships with this machine and is also the
       desktop UI font, so it renders identically on the mirror and in Chrome.
       "Segoe UI" is NOT installed here — it silently fell back to Selawik. */
    --font: "Inter", "Noto Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --ease: cubic-bezier(.6,.05,.28,.99);
    --dur: .6s;
  }
  * { box-sizing: border-box; }
  /* Belt and braces: the app font is the DEFAULT on every element, so no control
     can silently fall back to the browser's Times New Roman. Declaring it on the
     universal selector beats the UA stylesheet for input/textarea/select. */
  * { font-family: var(--font); }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(circle at 50% 30%, var(--bg-1) 0%, var(--bg-2) 40%, var(--bg-3) 70%, #000 100%);
    background-attachment: fixed;
    color: var(--text);
    font-family: var(--font);
    height: 100vh;
  }
  button { font-family: inherit; color: inherit; cursor: pointer; background: none; border: none; }

  /* ===== stage ===== */
  #stage { position: fixed; inset: 0; }

  /* every positioned element animates left/top/width/height + opacity */
  .anim {
    position: absolute;
    transition:
      left var(--dur) var(--ease),
      top var(--dur) var(--ease),
      width var(--dur) var(--ease),
      height var(--dur) var(--ease),
      opacity var(--dur) var(--ease);
  }

  /* ===== clock block (size never changes; only position) ===== */
  #clockbox { display: flex; flex-direction: column; text-align: center; line-height: 1.05; will-change: left, top; }
  #clockbox .t { font-weight: 700; letter-spacing: 1px; font-size: 2.7rem; }
  #clockbox .d { color: var(--muted); letter-spacing: 1px; font-size: 1.2rem; }
  #clockbox .a { color: var(--accent); font-weight: 600; margin-top: 3px; font-size: 1.6rem; }
  #clockbox .at { color: var(--muted); font-size: 1rem; }

  /* ===== orb ===== */
  #orbwrap { display: flex; flex-direction: column; align-items: center; justify-content: center; will-change: left, top, width, height; }
  #orb-glow {
    position: absolute; border-radius: 50%;
    background: radial-gradient(circle, rgba(0,230,118,.35) 0%, rgba(0,230,118,.12) 40%, transparent 70%);
    filter: blur(20px); animation: orb-pulse 3.5s ease-in-out infinite; pointer-events: none;
    transition: width var(--dur) var(--ease), height var(--dur) var(--ease);
  }
  @keyframes orb-pulse { 0%,100% { transform:scale(1); opacity:0.85; } 50% { transform:scale(1.12); opacity:1; } }
  #orb { position: relative; display: block; cursor: pointer; }
  #orb-label { color: var(--muted); letter-spacing: 3px; font-size: .8rem; margin-top: 6px; }
  /* The home screen is the calm one — the orb speaks for itself, so the READY /
     LISTENING word under it is hidden here. Hub and leaf pages keep it. */
  body.home #orb-label { display: none; }

  /* ===== spotify pill ===== */
  #spotify-pill {
    display: flex; align-items: center; gap: 16px;
    background: rgba(10,20,14,.8); border: 1px solid var(--card-border);
    border-radius: 100px; padding: 8px 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,.5); backdrop-filter: blur(8px);
    will-change: left, top;
  }
  #sp-ico { color: var(--accent); font-weight: 800; font-size: 1rem; flex: 0 0 auto; }
  #sp-text { display: flex; flex-direction: column; min-width: 0; }
  #sp-title { font-weight: 600; font-size: 1.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sp-artist { color: var(--muted); font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sp-btn {
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(110,231,183,.16); border: 1px solid rgba(110,231,183,.4);
    color: var(--accent); display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
  }
  .sp-btn.play { width: 52px; height: 52px; background: rgba(110,231,183,.32); }
  .sp-btn:hover { background: rgba(110,231,183,.4); }
  /* The pill positions itself with translateX(-50%) on home/hub (see the layout rules
     below). Any transform here must PRESERVE that, or the pill snaps to the left edge —
     so each state repeats the centring translate. */
  #spotify-pill { cursor: pointer; transition: transform .3s var(--ease), border-color .2s var(--ease); }
  #spotify-pill:hover { border-color: rgba(110,231,183,.5); transform: scale(1.03); }
  body.home #spotify-pill:hover, body.hub #spotify-pill:hover {
    transform: translateX(-50%) scale(1.03);
  }
  /* while the player is up, the pill is the thing it came from — lift it slightly so
     the morph reads as connected to it */
  body.sp-open #spotify-pill { border-color: rgba(110,231,183,.7); }
  body.home.sp-open #spotify-pill, body.hub.sp-open #spotify-pill {
    transform: translateX(-50%) scale(1.06);
  }
  /* the rest of the mirror steps back while the player is open */
  body.sp-open #clockbox { opacity: .25; }
  #clockbox { transition: opacity .38s var(--ease); }

  /* ============ SPOTIFY PLAYER WINDOW ============
     Opened by clicking the pill. Layout, left to right:
       [ playlist grid ] [ album cover ] [ transport + seek ]
                                            [ vertical volume ]  <- far right
     The backdrop blurs and dims the whole mirror behind the window, so the
     controls are the only thing in focus.

     OPEN/CLOSE MOTION — the window morphs out of the pill it was clicked from and
     collapses back into it. JS measures the pill's centre and sets --sp-dx/--sp-dy
     (the offset from the window's centred position); the closed state applies that
     offset plus a small scale, the open state zeroes it. That is a real spatial cue
     ("this came from there") instead of a generic centre pop.

     visibility (not display) is what hides it: a display swap cannot be transitioned,
     and the old code toggled display:none in the same frame as the class, so the
     open animation frequently did not run at all. */
  #sp-player-backdrop {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(2,10,5,0);
    backdrop-filter: blur(0px) saturate(1);
    -webkit-backdrop-filter: blur(0px) saturate(1);
    opacity: 0; visibility: hidden; pointer-events: none;
    transition:
      opacity .38s var(--ease),
      background-color .38s var(--ease),
      backdrop-filter .38s var(--ease),
      -webkit-backdrop-filter .38s var(--ease),
      visibility 0s linear .38s;
  }
  #sp-player-backdrop.open {
    background: rgba(2,10,5,.55);
    backdrop-filter: blur(14px) saturate(.9);
    -webkit-backdrop-filter: blur(14px) saturate(.9);
    opacity: 1; visibility: visible; pointer-events: auto;
    transition:
      opacity .38s var(--ease),
      background-color .38s var(--ease),
      backdrop-filter .38s var(--ease),
      -webkit-backdrop-filter .38s var(--ease),
      visibility 0s linear 0s;
  }

  #sp-player {
    position: fixed; left: 50%; top: 50%; z-index: 61;
    /* closed = sitting on the pill, small and clear */
    transform: translate(calc(-50% + var(--sp-dx, 0px)), calc(-50% + var(--sp-dy, 0px))) scale(.12);
    width: min(96vw, 1800px); height: min(92vh, 1020px);
    display: flex; flex-direction: row; gap: 30px;
    padding: 26px 30px;
    background: rgba(8,20,13,.92);
    border: 1px solid rgba(110,231,183,.28);
    border-radius: 28px;
    box-shadow: 0 30px 90px rgba(0,0,0,.7);
    opacity: 0; visibility: hidden; pointer-events: none;
    transform-origin: 50% 50%;
    transition:
      opacity .30s var(--ease),
      transform .46s cubic-bezier(.22,1,.36,1),
      visibility 0s linear .46s;
  }
  #sp-player.open {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1; visibility: visible; pointer-events: auto;
    transition:
      opacity .30s var(--ease),
      transform .46s cubic-bezier(.22,1,.36,1),
      visibility 0s linear 0s;
  }
  /* the three columns settle in just behind the window, so it feels assembled rather
     than snapped into place */
  #sp-pl-col, #sp-mid-col, #sp-vol-col {
    opacity: 0; transform: translateY(14px);
    transition: opacity .34s var(--ease), transform .34s var(--ease);
  }
  #sp-player.open #sp-pl-col,
  #sp-player.open #sp-mid-col,
  #sp-player.open #sp-vol-col { opacity: 1; transform: none; }
  #sp-player.open #sp-pl-col  { transition-delay: .14s; }
  #sp-player.open #sp-mid-col { transition-delay: .20s; }
  #sp-player.open #sp-vol-col { transition-delay: .26s; }

  /* Respect the OS setting: no morph, just appear. */
  @media (prefers-reduced-motion: reduce) {
    #sp-player, #sp-player-backdrop,
    #sp-pl-col, #sp-mid-col, #sp-vol-col {
      transition: opacity .12s linear !important;
      transform: none !important;
    }
    #sp-player { transform: translate(-50%, -50%) !important; }
  }

  /* ---- playlist grid (leftmost) ----
     A fixed 3x4: twelve of the most-listened playlists, three across and four down.
     The grid overlays the whole column and centres itself, so the block is centred in
     the WINDOW top-to-bottom. The cover size is solved so the block always clears the
     search bar above it, which is why the fit reserves that height on both sides. */
  #sp-pl-col {
    flex: 0 0 40%; display: flex; flex-direction: column;
    position: relative; min-width: 0;
    padding-top: 40px;      /* keeps the search bar's top edge level with the close button */
  }
  #sp-top { display: block; position: relative; z-index: 2; }

  /* search bar, above the playlists */
  #sp-search-wrap { display: flex; gap: 10px; margin-bottom: 12px; }
  #sp-search {
    flex: 1 1 auto; min-width: 0;
    font-family: inherit; font-size: 1.05rem; color: var(--text);
    background: rgba(255,255,255,.06); border: 1px solid var(--card-border);
    border-radius: 12px; padding: 12px 16px; outline: none;
  }
  #sp-search::placeholder { color: var(--muted); }
  #sp-search:focus { border-color: rgba(110,231,183,.55); }
  #sp-search-clear {
    flex: 0 0 auto; width: 46px; border-radius: 12px;
    background: rgba(255,255,255,.06); border: 1px solid var(--card-border);
    color: var(--muted); font-size: 1.1rem; cursor: pointer;
  }
  #sp-search-clear:hover { background: rgba(255,83,112,.2); color: #ff9aae; border-color: rgba(255,83,112,.45); }
  #sp-search-clear.hidden { display: none; }

  /* search results list — replaces the grid while a query is active */
  #sp-search-results {
    display: none; flex-direction: column; gap: 8px;
    overflow-y: auto; padding: 2px 8px 2px 2px;
  }
  #sp-search-results.on { display: flex; }
  .sp-sr {
    display: flex; align-items: center; gap: 12px; padding: 8px 10px;
    background: rgba(255,255,255,.04); border: 1px solid var(--card-border);
    border-radius: 12px; cursor: pointer; text-align: left; min-width: 0;
  }
  .sp-sr:hover, .sp-sr:focus-visible { background: rgba(110,231,183,.14);
    border-color: rgba(110,231,183,.5); outline: none; }
  .sp-sr img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; flex: 0 0 auto; }
  .sp-sr-txt { min-width: 0; flex: 1 1 auto; }
  .sp-sr-name { font-size: 1rem; font-weight: 600; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sp-sr-artist { font-size: .85rem; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sp-sr-dur { font-size: .82rem; color: var(--muted); flex: 0 0 auto;
    font-variant-numeric: tabular-nums; }
  .sp-sr-hint { font-size: .85rem; color: var(--muted); padding: 6px 2px; }

  #sp-pl-grid {
    display: grid;
    /* overlays the whole column (including the area under the search bar) so its
       align-content:center centres the 3x4 in the window, not in the leftover space */
    position: absolute; inset: 0;
    grid-template-columns: repeat(3, 1fr);   /* the 3 of the 3x4 */
    grid-template-rows: repeat(4, auto);     /* the 4 of the 3x4 */
    gap: 12px; padding: 0;
    align-content: center;
    overflow: hidden;                        /* the fit is computed: a scrollbar is a bug */
  }
  #sp-pl-grid.off { display: none; }
  /* pinned to the bottom so it cannot steal height from the grid and skew the centre */
  #sp-pl-status {
    position: absolute; left: 0; right: 0; bottom: 0;
    font-size: .85rem; color: var(--muted); padding: 6px 2px 0; min-height: 1.2em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sp-pl-card {
    display: flex; flex-direction: column; align-items: center;
    gap: 6px; padding: 0; min-width: 0;
    background: none; border: none; text-align: center; cursor: pointer;
    transition: transform .16s var(--ease);
  }
  .sp-pl-card:hover, .sp-pl-card:focus-visible { transform: translateY(-3px); outline: none; }
  .sp-pl-art {
    position: relative; width: 100%; max-width: var(--sp-cover, 96px);
    aspect-ratio: 1 / 1; border-radius: 12px; flex: 0 0 auto;
    background: rgba(255,255,255,.06); border: 1px solid var(--card-border);
    overflow: hidden;
  }
  .sp-pl-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .sp-pl-art .noart {
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 1.6rem; font-weight: 800;
  }
  .sp-pl-card:hover .sp-pl-art { border-color: rgba(110,231,183,.6); }
  .sp-pl-card.now .sp-pl-art { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(110,231,183,.55); }
  /* one line only — a wrapped name would push the last row out of the fit */
  .sp-pl-name {
    font-size: .82rem; font-weight: 600; color: var(--text); line-height: 1.15;
    max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sp-pl-card.now .sp-pl-name { color: var(--accent); }
  /* track count lives in the card's tooltip rather than under the name */
  .sp-pl-count { display: none; }

  /* ---- album cover, track info, seek, transport (middle) ---- */
  #sp-mid-col {
    flex: 1 1 auto; display: flex; flex-direction: column;
    justify-content: center; align-items: center; gap: 18px; min-width: 0;
  }
  /* album cover sits ABOVE the track text */
  #sp-big-art {
    width: min(30vh, 290px); height: min(30vh, 290px); border-radius: 16px;
    object-fit: cover; display: block; flex: 0 0 auto;
    background: rgba(255,255,255,.05); border: 1px solid var(--card-border);
    box-shadow: 0 18px 50px rgba(0,0,0,.55);
  }
  #sp-big-art.hidden { display: none; }
  #sp-track { min-width: 0; width: 100%; text-align: center; }
  #sp-track-name {
    font-size: 2rem; font-weight: 700; letter-spacing: .5px; line-height: 1.2;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #sp-track-artist { font-size: 1.25rem; color: var(--accent); margin-top: 4px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #sp-track-album { font-size: 1rem; color: var(--muted); margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* horizontal seek bar */
  #sp-seek-wrap { display: flex; align-items: center; gap: 16px; }
  .sp-time { font-size: 1rem; color: var(--muted); font-variant-numeric: tabular-nums;
    flex: 0 0 58px; text-align: center; }
  #sp-seek {
    flex: 1 1 auto; -webkit-appearance: none; appearance: none;
    height: 12px; border-radius: 6px; background: rgba(255,255,255,.14);
    outline: none; cursor: pointer;
  }
  #sp-seek::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 26px; height: 26px;
    border-radius: 50%; background: var(--accent); border: none; cursor: pointer;
    box-shadow: 0 2px 10px rgba(0,0,0,.6);
  }
  #sp-seek::-moz-range-thumb {
    width: 26px; height: 26px; border-radius: 50%; background: var(--accent);
    border: none; cursor: pointer;
  }
  #sp-seek:disabled { opacity: .4; cursor: default; }

  /* transport row: prev / play / next, with skip-back called out */
  #sp-transport { display: flex; align-items: center; justify-content: center; gap: 26px; }
  .sp-tbtn {
    display: flex; align-items: center; justify-content: center;
    width: 74px; height: 74px; border-radius: 50%;
    background: rgba(110,231,183,.16); border: 1px solid rgba(110,231,183,.42);
    color: var(--accent); cursor: pointer;
    transition: background .16s var(--ease), transform .16s var(--ease);
  }
  .sp-tbtn:hover { background: rgba(110,231,183,.34); transform: scale(1.05); }
  .sp-tbtn:active { transform: scale(.97); }
  .sp-tbtn.big {
    width: 100px; height: 100px; background: rgba(110,231,183,.32);
    border-color: rgba(110,231,183,.7);
  }
  .sp-tbtn.big:hover { background: rgba(110,231,183,.5); }
  .sp-tbtn svg { display: block; }

  /* ---- vertical volume (far right) ---- */
  #sp-vol-col {
    flex: 0 0 auto; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    padding-left: 24px;
  }
  #sp-vol-val { font-size: 1.05rem; font-weight: 700; color: var(--accent);
    font-variant-numeric: tabular-nums; }
  #sp-vol-ico { color: var(--muted); display: flex; }
  #sp-vol-ico.muted { opacity: .4; }
  #sp-vol {
    -webkit-appearance: none; appearance: none; cursor: pointer;
    /* a horizontal range rotated upright: the browser handles the thumb maths */
    writing-mode: vertical-lr; direction: rtl;
    width: 24px; height: min(46vh, 420px);
    border-radius: 12px; background: rgba(255,255,255,.14); outline: none;
  }
  #sp-vol::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 34px; height: 34px;
    border-radius: 50%; background: var(--accent); border: none; cursor: pointer;
    box-shadow: 0 2px 10px rgba(0,0,0,.6);
  }
  #sp-vol::-moz-range-thumb {
    width: 34px; height: 34px; border-radius: 50%; background: var(--accent);
    border: none; cursor: pointer;
  }
  #sp-vol:disabled { opacity: .35; cursor: default; }

  /* ---- close + open-in-Spotify ---- */
  /* both live in the window's top-right corner: the Spotify hand-over next to the
     close button, small and out of the content's way */
  #sp-close {
    position: absolute; right: 20px; top: 18px;
    width: 48px; height: 48px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.07); border: 1px solid var(--card-border);
    color: var(--muted); font-size: 1.4rem; line-height: 1; cursor: pointer;
  }
  #sp-close:hover { background: rgba(255,83,112,.22); color: #ff9aae;
    border-color: rgba(255,83,112,.5); }

  /* "go to Spotify": hands the current playlist to the machine's Spotify app and
     resumes it there, at the position it was paused at. */
  #sp-goto {
    position: absolute; right: 80px; top: 18px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    height: 48px; padding: 0 16px; border-radius: 24px;
    background: rgba(30,215,96,.18); border: 1px solid rgba(30,215,96,.55);
    color: #7ff0b8; font-size: .9rem; font-weight: 700; letter-spacing: .3px;
    cursor: pointer; white-space: nowrap;
    transition: background .16s var(--ease), transform .16s var(--ease);
  }
  #sp-goto:hover { background: rgba(30,215,96,.32); transform: translateY(-2px); }
  #sp-goto:active { transform: translateY(0); }
  #sp-goto:disabled { opacity: .45; cursor: default; transform: none; }
  #sp-goto svg { flex: 0 0 auto; width: 18px; height: 18px; }
  /* the hand-over status line sits with the button, top-right */
  #sp-goto-hint {
    position: absolute; right: 80px; top: 70px;
    font-size: .78rem; color: var(--muted); text-align: right; max-width: 260px;
  }

  #sp-player-err {
    position: absolute; left: 34px; bottom: 12px; font-size: .85rem;
    color: #fca5a5; max-width: 60%;
  }

  /* ============ SCHEDULE WINDOW ============
     Opened by clicking the clock/date/agenda on the home screen. Same shell and motion
     as the Spotify player: a blurred backdrop and a window that morphs out of the thing
     it was opened from, so the two windows behave alike.

     Layout, left to right:
       [ day / week / month tabs + one event list ]  [ weather column ] */
  #sc-backdrop {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(2,10,5,0);
    backdrop-filter: blur(0px) saturate(1);
    -webkit-backdrop-filter: blur(0px) saturate(1);
    opacity: 0; visibility: hidden; pointer-events: none;
    transition:
      opacity .38s var(--ease),
      background-color .38s var(--ease),
      backdrop-filter .38s var(--ease),
      -webkit-backdrop-filter .38s var(--ease),
      visibility 0s linear .38s;
  }
  #sc-backdrop.open {
    background: rgba(2,10,5,.55);
    backdrop-filter: blur(14px) saturate(.9);
    -webkit-backdrop-filter: blur(14px) saturate(.9);
    opacity: 1; visibility: visible; pointer-events: auto;
    transition:
      opacity .38s var(--ease),
      background-color .38s var(--ease),
      backdrop-filter .38s var(--ease),
      -webkit-backdrop-filter .38s var(--ease),
      visibility 0s linear 0s;
  }

  #sc-window {
    position: fixed; left: 50%; top: 50%; z-index: 61;
    transform: translate(calc(-50% + var(--sc-dx, 0px)), calc(-50% + var(--sc-dy, 0px))) scale(.12);
    width: min(94vw, 1600px); height: min(88vh, 940px);
    display: flex; flex-direction: row; gap: 28px;
    padding: 26px 30px;
    background: rgba(8,20,13,.93);
    border: 1px solid rgba(110,231,183,.28);
    border-radius: 28px;
    box-shadow: 0 30px 90px rgba(0,0,0,.7);
    opacity: 0; visibility: hidden; pointer-events: none;
    transform-origin: 50% 50%;
    transition:
      opacity .30s var(--ease),
      transform .46s cubic-bezier(.22,1,.36,1),
      visibility 0s linear .46s;
  }
  #sc-window.open {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1; visibility: visible; pointer-events: auto;
    transition:
      opacity .30s var(--ease),
      transform .46s cubic-bezier(.22,1,.36,1),
      visibility 0s linear 0s;
  }
  #sc-main, #sc-side {
    opacity: 0; transform: translateY(14px);
    transition: opacity .34s var(--ease), transform .34s var(--ease);
  }
  #sc-window.open #sc-main { opacity: 1; transform: none; transition-delay: .14s; }
  #sc-window.open #sc-side { opacity: 1; transform: none; transition-delay: .22s; }

  @media (prefers-reduced-motion: reduce) {
    #sc-window, #sc-backdrop, #sc-main, #sc-side {
      transition: opacity .12s linear !important; transform: none !important;
    }
    #sc-window { transform: translate(-50%, -50%) !important; }
  }

  /* ---- left: tabs + events ---- */
  #sc-main { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
  #sc-tabs { display: flex; gap: 10px; margin-bottom: 14px; flex: 0 0 auto; }
  .sc-tab {
    flex: 1 1 0; padding: 14px 10px; border-radius: 14px;
    background: rgba(255,255,255,.05); border: 1px solid var(--card-border);
    color: var(--muted); font-size: 1.15rem; font-weight: 700; letter-spacing: 1px;
    cursor: pointer; text-transform: uppercase;
    transition: background .16s var(--ease), color .16s var(--ease);
  }
  .sc-tab:hover { background: rgba(110,231,183,.14); color: var(--text); }
  .sc-tab.active {
    background: rgba(110,231,183,.28); border-color: rgba(110,231,183,.65);
    color: var(--accent);
  }

  #sc-nav {
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px; margin-bottom: 12px; flex: 0 0 auto;
  }
  .sc-navbtn {
    width: 52px; height: 52px; border-radius: 50%; flex: 0 0 auto;
    background: rgba(255,255,255,.06); border: 1px solid var(--card-border);
    color: var(--accent); font-size: 1.5rem; line-height: 1; cursor: pointer;
  }
  .sc-navbtn:hover { background: rgba(110,231,183,.26); }
  #sc-period {
    flex: 1 1 auto; text-align: center; font-size: 1.5rem; font-weight: 700;
    color: var(--text); letter-spacing: .5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #sc-today-btn {
    flex: 0 0 auto; padding: 0 18px; height: 52px; border-radius: 26px;
    background: rgba(255,255,255,.06); border: 1px solid var(--card-border);
    color: var(--muted); font-size: .95rem; font-weight: 700; cursor: pointer;
  }
  #sc-today-btn:hover { background: rgba(110,231,183,.2); color: var(--accent); }

  #sc-body { flex: 1 1 auto; min-height: 0; overflow: hidden; }

  /* day view: a plain list of that day's events */
  #sc-day { display: flex; flex-direction: column; gap: 10px; height: 100%; overflow-y: auto; padding-right: 8px; }
  .sc-ev {
    display: flex; align-items: stretch; gap: 16px; padding: 14px 16px;
    background: rgba(255,255,255,.04); border: 1px solid var(--card-border);
    border-radius: 14px; flex: 0 0 auto;
  }
  .sc-ev-time {
    flex: 0 0 118px; font-size: 1.05rem; font-weight: 700; color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .sc-ev-main { flex: 1 1 auto; min-width: 0; }
  .sc-ev-title { font-size: 1.25rem; font-weight: 600; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sc-ev-loc { font-size: .92rem; color: var(--muted); margin-top: 3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sc-ev.all-day .sc-ev-time { color: var(--muted); }
  .sc-ev.now { border-color: rgba(110,231,183,.7); background: rgba(110,231,183,.12); }
  .sc-ev.past { opacity: .5; }
  #sc-empty { color: var(--muted); font-size: 1.15rem; text-align: center; padding: 40px 0; }

  /* week view: a 7-column grid, each day a stack of chips */
  #sc-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; height: 100%; }
  .sc-daycol {
    display: flex; flex-direction: column; gap: 6px; min-width: 0;
    background: rgba(255,255,255,.03); border: 1px solid var(--card-border);
    border-radius: 12px; padding: 8px 6px; overflow: hidden;
  }
  .sc-daycol.today { border-color: rgba(110,231,183,.6); background: rgba(110,231,183,.1); }
  .sc-daycol .h {
    font-size: .82rem; font-weight: 700; color: var(--accent); text-transform: uppercase;
    letter-spacing: .5px; text-align: center; flex: 0 0 auto;
  }
  .sc-daycol .h .dnum { display: block; font-size: 1.15rem; color: var(--text); }
  .sc-daycol .evs { flex: 1 1 auto; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
  .sc-chip {
    font-size: .74rem; line-height: 1.2; padding: 5px 6px; border-radius: 6px;
    background: rgba(110,231,183,.16); border: 1px solid rgba(110,231,183,.3);
    color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sc-chip .tt { color: var(--accent); font-weight: 700; margin-right: 4px; }

  /* month view: a 7x6 grid of date cells */
  #sc-month { display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(7, 1fr); gap: 6px; height: 100%; }
  .sc-mhead { font-size: .8rem; font-weight: 700; color: var(--muted); text-align: center;
    text-transform: uppercase; letter-spacing: .5px; display: flex; align-items: center; justify-content: center; }
  .sc-mcell {
    display: flex; flex-direction: column; gap: 3px; min-height: 0; overflow: hidden;
    background: rgba(255,255,255,.03); border: 1px solid var(--card-border);
    border-radius: 10px; padding: 5px 6px;
  }
  .sc-mcell.out { opacity: .32; }
  .sc-mcell.today { border-color: rgba(110,231,183,.7); background: rgba(110,231,183,.12); }
  .sc-mcell .dn { font-size: .95rem; font-weight: 700; color: var(--text); flex: 0 0 auto; }
  .sc-mcell.today .dn { color: var(--accent); }
  .sc-mcell .mini {
    font-size: .66rem; line-height: 1.15; color: var(--accent);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 0 0 auto;
  }
  .sc-mcell .more { font-size: .62rem; color: var(--muted); flex: 0 0 auto; }

  /* ---- right: weather column ---- */
  #sc-side {
    flex: 0 0 300px; display: flex; flex-direction: column; gap: 14px;
    border-left: 1px solid var(--card-border); padding-left: 24px;
    overflow-y: auto;
  }
  #sc-wx-loc { font-size: 1rem; font-weight: 700; color: var(--accent); letter-spacing: .5px; }
  #sc-wx-now { display: flex; align-items: center; gap: 14px; }
  #sc-wx-temp { font-size: 3.4rem; font-weight: 700; line-height: 1; color: var(--text); }
  #sc-wx-temp small { font-size: 1.4rem; color: var(--muted); }
  #sc-wx-cond { font-size: 1rem; color: var(--text); margin-top: 6px; }
  #sc-wx-feels { font-size: .88rem; color: var(--muted); }
  #sc-wx-days { display: flex; flex-direction: column; gap: 8px; }
  .sc-wxd {
    display: flex; align-items: center; gap: 10px; padding: 9px 11px;
    background: rgba(255,255,255,.04); border: 1px solid var(--card-border);
    border-radius: 12px;
  }
  .sc-wxd .d { flex: 0 0 52px; font-size: .82rem; font-weight: 700; color: var(--accent); text-transform: uppercase; }
  .sc-wxd .c { flex: 1 1 auto; font-size: .82rem; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sc-wxd .t { flex: 0 0 auto; font-size: .95rem; font-weight: 700;
    font-variant-numeric: tabular-nums; }
  .sc-wxd .t .lo { color: var(--muted); font-weight: 500; }
  #sc-wx-err { font-size: .85rem; color: #fca5a5; }

  /* ============ HOME: expanded window ============
     Swipe up, drag up or press the up arrow and the orb parks in the top-right
     corner, small, while a window opens in the space it left. The reverse puts it back.
     The geometry is driven by layoutHome() in the JS, which owns the orb's position on
     home — this is only the pre-JS default and the window chrome. */
  #hw-window {
    position: absolute; left: 50%; top: 46vh;
    transform: translate(-50%, -50%) scale(.94);
    /* Same box as #sp-player and #sc-window; layoutHome() sets the live px values. */
    width: min(94vw, 1600px); height: min(88vh, 940px);
    background: rgba(8,20,13,.86);
    border: 1px solid rgba(110,231,183,.28);
    border-radius: 24px;
    box-shadow: 0 24px 70px rgba(0,0,0,.6);
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .34s var(--ease), transform .44s cubic-bezier(.22,1,.36,1),
                visibility 0s linear .44s;
    display: flex; flex-direction: column;
    padding: 26px 28px 22px;
    overflow: hidden;
  }
  body.home.hw-open #hw-window {
    opacity: 1; visibility: visible; pointer-events: auto;
    transform: translate(-50%, -50%) scale(1);
    transition: opacity .34s var(--ease), transform .44s cubic-bezier(.22,1,.36,1),
                visibility 0s linear 0s;
  }

  /* ---- apps grid (the window's default view) ---- */
  #hw-apps { flex: 1 1 auto; overflow-y: auto; min-height: 0; padding-right: 8px; }
  .hw-group { margin-bottom: 18px; }
  .hw-group:last-child { margin-bottom: 0; }
  .hw-glabel {
    font-size: .82rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 10px;
  }
  .hw-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 12px;
  }
  .hw-app {
    display: flex; flex-direction: column; justify-content: center; gap: 5px;
    min-height: 84px; padding: 14px 16px; text-align: left;
    background: rgba(255,255,255,.04); border: 1px solid var(--card-border);
    border-radius: 14px; cursor: pointer;
    transition: background .16s var(--ease), border-color .16s var(--ease),
                transform .16s var(--ease);
  }
  .hw-app:hover, .hw-app:focus-visible {
    background: rgba(110,231,183,.16); border-color: rgba(110,231,183,.6);
    transform: translateY(-2px); outline: none;
  }
  .hw-app-name { font-size: 1.2rem; font-weight: 700; color: var(--accent);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hw-app-note { font-size: .88rem; color: var(--muted); line-height: 1.25;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

  /* ---- a single app's page (blank for now) ---- */
  #hw-page { flex: 1 1 auto; display: none; flex-direction: column; min-height: 0; }
  #hw-page.on { display: flex; }
  #hw-page-bar {
    display: flex; align-items: center; gap: 14px; flex: 0 0 auto;
    padding-bottom: 14px; margin-bottom: 14px;
    border-bottom: 1px solid var(--card-border);
  }
  #hw-back {
    display: flex; align-items: center; gap: 8px; flex: 0 0 auto;
    height: 46px; padding: 0 18px; border-radius: 23px;
    background: rgba(255,255,255,.06); border: 1px solid var(--card-border);
    color: var(--accent); font-size: .95rem; font-weight: 700; cursor: pointer;
  }
  #hw-back:hover { background: rgba(110,231,183,.24); }
  #hw-page-title { font-size: 1.6rem; font-weight: 700; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #hw-page-body {
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    display: block;
  }
  /* a page with no implementation registered: centre the one-line note */
  #hw-page-body.plain {
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 1.2rem; letter-spacing: 1px;
  }

  /* ---------- shared page building blocks ----------
     Every app page inside the window uses these, so the 15 pages look like one app.
     Deliberately big type and big tap targets, matching the rest of the mirror. */
  .pg-wrap { display: flex; flex-direction: column; gap: 12px; }
  .pg-row {
    display: flex; align-items: center; gap: 14px;
    padding: 13px 16px; border-radius: 14px;
    background: rgba(255,255,255,.04); border: 1px solid var(--card-border);
  }
  .pg-row.done { opacity: .45; }
  .pg-row.now { border-color: rgba(110,231,183,.7); background: rgba(110,231,183,.12); }
  .pg-main { flex: 1 1 auto; min-width: 0; }
  .pg-title { font-size: 1.2rem; font-weight: 600; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pg-sub { font-size: .88rem; color: var(--muted); margin-top: 3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pg-side { flex: 0 0 auto; font-size: 1rem; color: var(--accent);
    font-variant-numeric: tabular-nums; text-align: right; }
  .pg-big { font-size: 2rem; font-weight: 700; color: var(--text);
    font-variant-numeric: tabular-nums; line-height: 1.1; }
  /* ---- medications (rebuilt from the previous mirror) ----
     Bigger rows and round buttons, because the count is tapped often. The count itself
     is click-to-type as well as +/- steppable: typing the real number beats clicking
     + twelve times. */
  .pg-med-row {
    padding: 18px 20px; border-radius: 16px; gap: 18px;
  }
  .pg-med-name { font-size: 1.35rem; font-weight: 700; color: var(--text); }
  .pg-med-dose { font-size: 1rem; color: var(--muted); margin-top: 3px; }
  .pg-med-count { display: flex; align-items: center; gap: 14px; flex: 0 0 auto; }
  .pg-med-num {
    font-size: 2.4rem; font-weight: 700; color: var(--accent);
    font-variant-numeric: tabular-nums; min-width: 2.4em; text-align: center;
    cursor: pointer; border-radius: 10px; padding: 2px 6px;
  }
  .pg-med-num:hover { background: rgba(110,231,183,.12); }
  .pg-med-input {
    font-size: 2.4rem; font-weight: 700; color: var(--accent);
    background: rgba(0,0,0,.28); border: 1px solid rgba(110,231,183,.5);
    border-radius: 10px; padding: 2px 6px; text-align: center; width: 2.6em;
    font-family: inherit;
  }
  /* .pg-btn.pg-med-btn (not just .pg-med-btn): .pg-btn is declared later in this sheet,
     so a single-class rule here would lose the cascade and keep its 22px radius. */
  .pg-btn.pg-med-btn {
    width: 56px; height: 56px; border-radius: 50%; padding: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.8rem; line-height: 1;
  }
  /* the cigarettes row reads as a different thing at a glance */
  .pg-cig { border-color: rgba(255,160,120,.5); background: rgba(255,150,110,.07); }
  .pg-cig .pg-med-name { color: #ffb089; }
  .pg-cig .pg-med-num, .pg-cig .pg-med-input { color: #ffb089; }
  .pg-cig .pg-btn.pg-med-btn {
    background: rgba(255,150,110,.16); border-color: rgba(255,150,110,.45); color: #ffb089;
  }
  .pg-med-note { font-size: .92rem; color: var(--muted); margin-top: 2px; }
  .pg-med-foot { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 8px; }

  /* ---- money (rebuilt from the previous mirror) ----
     Four tabs over one pane, because a flat page could not fit accounts, goals, subs and
     the ledger at once. Every number is tap-to-edit and the add bars write straight to the
     money backend - this is the real ledger, not a read-only view. */
  #money-tabs { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .money-tab {
    min-height: 48px; padding: 0 22px; border-radius: 100px;
    border: 1px solid var(--card-border); background: rgba(255,255,255,.05);
    color: var(--muted); font-family: inherit; font-weight: 700; font-size: 1rem;
    cursor: pointer;
  }
  .money-tab.active {
    background: rgba(110,231,183,.25); color: var(--accent);
    border-color: rgba(110,231,183,.5);
  }
  #money-pane { display: flex; flex-direction: column; gap: 12px; }
  #money-hero { text-align: center; padding: 4px 0 6px; }
  #money-hero .nw {
    font-weight: 800; font-size: 2.6rem; color: var(--accent);
    font-variant-numeric: tabular-nums; line-height: 1.1;
  }
  #money-hero .nwl { color: var(--muted); font-size: .85rem; letter-spacing: 3px; margin-top: 2px; }
  #money-cards { display: flex; gap: 12px; }
  .money-card {
    flex: 1 1 0; min-width: 0; background: rgba(255,255,255,.04);
    border: 1px solid var(--card-border); border-radius: 14px;
    padding: 12px 14px; text-align: center;
  }
  .money-card .n {
    font-weight: 800; font-size: 1.5rem; color: var(--text);
    font-variant-numeric: tabular-nums; cursor: pointer;
  }
  .money-card .l { color: var(--muted); font-size: .8rem; letter-spacing: 1.5px; margin-top: 3px; }
  .money-card .l .hint { display: block; font-size: .72rem; letter-spacing: 0; opacity: .75; }
  .money-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .money-acct {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px;
    background: rgba(255,255,255,.04); border: 1px solid var(--card-border);
    border-radius: 14px;
  }
  .money-name { flex: 1 1 auto; color: var(--text); font-size: 1.05rem; word-break: break-word; }
  .money-name .sub { display: block; color: var(--muted); font-size: .85rem; margin-top: 2px; }
  .money-amt {
    font-weight: 700; color: var(--accent); font-size: 1.1rem; flex: 0 0 auto;
    font-variant-numeric: tabular-nums; cursor: pointer; border-radius: 8px; padding: 4px 8px;
  }
  .money-amt:hover { background: rgba(110,231,183,.12); }
  .money-amt-input {
    font-weight: 700; font-size: 1.1rem; color: var(--accent);
    background: rgba(0,0,0,.3); border: 1px solid rgba(110,231,183,.5);
    border-radius: 8px; padding: 4px 8px; text-align: right; width: 8em;
    font-family: inherit; flex: 0 0 auto;
  }
  .money-del {
    width: 44px; height: 44px; border-radius: 50%; flex: 0 0 auto;
    background: rgba(255,83,112,.12); border: 1px solid rgba(255,83,112,.35);
    color: #ff9aae; font-size: 1.1rem; cursor: pointer;
  }
  .money-del:hover { background: rgba(255,83,112,.3); }
  /* armed = waiting for the confirming second tap; the backend has no undo */
  .money-del.pg-del-armed {
    width: auto; min-width: 44px; padding: 0 14px; border-radius: 22px;
    background: rgba(255,83,112,.32); font-size: .95rem; font-weight: 700;
  }
  .money-in { color: #4ade80; }
  .money-out { color: #f87171; }
  .money-addrow { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .money-addrow .r { display: flex; gap: 10px; flex-wrap: wrap; }
  .money-in2 {
    flex: 1 1 140px; min-width: 0; min-height: 48px; padding: 0 14px;
    background: rgba(255,255,255,.06); border: 1px solid var(--card-border);
    border-radius: 12px; color: var(--text); font-family: inherit; font-size: 1rem; outline: none;
  }
  .money-in2:focus { border-color: rgba(110,231,183,.5); }
  button.money-in2 { cursor: pointer; font-weight: 700; }
  .money-note { color: var(--muted); font-size: .9rem; padding: 2px 0; }
  .money-empty { color: var(--muted); text-align: center; padding: 26px 0; font-size: 1rem; }
  .money-led-row {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px;
    background: rgba(255,255,255,.04); border: 1px solid var(--card-border);
    border-radius: 14px;
  }

  .pg-btn {
    flex: 0 0 auto; height: 44px; padding: 0 16px; border-radius: 22px;
    background: rgba(110,231,183,.16); border: 1px solid rgba(110,231,183,.42);
    color: var(--accent); font-size: .95rem; font-weight: 700; cursor: pointer;
  }
  .pg-btn:hover { background: rgba(110,231,183,.34); }
  .pg-btn.warn { background: rgba(255,83,112,.14); border-color: rgba(255,83,112,.42); color: #ff9aae; }
  .pg-btn.warn:hover { background: rgba(255,83,112,.28); }
  .pg-btn:disabled { opacity: .4; cursor: default; }
  .pg-input {
    flex: 1 1 auto; min-width: 0; font-family: inherit; font-size: 1.1rem;
    color: var(--text); background: rgba(255,255,255,.06);
    border: 1px solid var(--card-border); border-radius: 12px;
    padding: 12px 15px; outline: none;
  }
  .pg-input::placeholder { color: var(--muted); }
  .pg-input:focus { border-color: rgba(110,231,183,.55); }
  .pg-addbar { display: flex; gap: 10px; flex: 0 0 auto; }
  .pg-muted { color: var(--muted); font-size: 1.05rem; }
  .pg-empty { color: var(--muted); font-size: 1.1rem; text-align: center; padding: 34px 0; }
  .pg-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .pg-chip {
    padding: 8px 14px; border-radius: 18px; cursor: pointer;
    background: rgba(255,255,255,.05); border: 1px solid var(--card-border);
    color: var(--muted); font-size: .95rem; font-weight: 700;
  }
  .pg-chip.on { background: rgba(110,231,183,.26); border-color: rgba(110,231,183,.6); color: var(--accent); }
  .pg-split { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
  .pg-card {
    padding: 16px 18px; border-radius: 16px;
    background: rgba(255,255,255,.04); border: 1px solid var(--card-border);
  }
  .pg-card h3 { margin: 0 0 10px; font-size: .92rem; font-weight: 700; letter-spacing: 1.4px;
    text-transform: uppercase; color: var(--muted); }
  .pg-stat { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 7px 0; }
  .pg-stat .k { font-size: 1rem; color: var(--muted); }
  .pg-stat .v { font-size: 1.15rem; font-weight: 700; color: var(--text);
    font-variant-numeric: tabular-nums; }
  .pg-bar { height: 12px; border-radius: 6px; background: rgba(255,255,255,.1); overflow: hidden; margin-top: 8px; }
  .pg-bar i { display: block; height: 100%; background: var(--accent); }
  /* kanban columns */
  .pg-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; align-items: start; }

  .pg-hcard .st { font-size: 2rem; font-weight: 800; color: var(--muted); line-height: 1.15; margin-top: 6px; }
  .pg-hcard .lb { font-size: .72rem; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  /* whiteboard */
  .pg-wb-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .pg-sw { width: 40px; height: 40px; border-radius: 10px; border: 2px solid var(--card-border); cursor: pointer; }
  .pg-sw.on { border-color: var(--accent); }
  .pg-wb-canvas { touch-action: none; cursor: crosshair; border-radius: 14px;

  .pg-wx-temp small { font-size: 1.5rem; color: var(--muted); }
  .pg-wxd { display: flex; align-items: center; gap: 12px; padding: 11px 14px;
    background: rgba(255,255,255,.04); border: 1px solid var(--card-border); border-radius: 12px; }
  .pg-wxd .d { flex: 0 0 60px; font-size: .85rem; font-weight: 700; color: var(--accent); text-transform: uppercase; }
  .pg-wxd .c { flex: 1 1 auto; font-size: .9rem; color: var(--muted); }
  .pg-wxd .t { flex: 0 0 auto; font-size: 1rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .pg-wxd .t .lo { color: var(--muted); font-weight: 500; }

  /* on a hub that is not home the window has nothing to show */
  body:not(.home) #hw-window { display: none; }

  @media (prefers-reduced-motion: reduce) {
    #hw-window { transition: opacity .12s linear !important; }
    #hw-window { transform: translate(-50%, -50%) !important; }

  /* the clock/date/agenda are the handle for this window */
  body.home #clockbox { cursor: pointer; }
  body.home #clockbox:hover .t { color: var(--accent); }
  body.home #clockbox .t { transition: color .2s var(--ease); }

  body.sc-open #spotify-pill { opacity: .25; }

  #sc-close {
    position: absolute; right: 20px; top: 18px;
    width: 48px; height: 48px; border-radius: 50%;

    background: rgba(255,255,255,.07); border: 1px solid var(--card-border);
    color: var(--muted); font-size: 1.4rem; line-height: 1; cursor: pointer;
  }
  #sc-close:hover { background: rgba(255,83,112,.22); color: #ff9aae;
    border-color: rgba(255,83,112,.5); }

  /* ============ HOME ============
     Geometry comes from the shared HUB rule further down, so home, apps, life, work
     and referee all sit in the same place — only the ring contents change. Home just
     gets a larger orb. */

  /* when voice chat is ON: orb shrinks and tucks to the left, whole orb visible */

  /* ============ HOME voice-chat transcript panel ============ */
  #vc-panel {
    position: fixed; display: none; flex-direction: column;
    right: 4vw; top: 24vh; bottom: 24vh; width: 58vw; max-width: 720px;
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 20px; box-shadow: 0 8px 30px rgba(0,0,0,.4);
    overflow: hidden; opacity: 0; transform: translateY(14px);
    transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
  }
  body.home.vc-open #vc-panel { display: flex; opacity: 1; transform: none; }
  body.vc-open #vc-panel { display: flex; opacity: 1; transform: none; }
  #vc-head { display: flex; align-items: center; gap: 12px; padding: 14px 20px;
    border-bottom: 1px solid var(--card-border); font-weight: 700; letter-spacing: 1px; font-size: 1rem; }
  #vc-ind { width: 12px; height: 12px; border-radius: 50%; background: var(--orb-color); flex: 0 0 auto; }
  #vc-ind.listening { background: #3b82f6; }

  #vc-state { color: var(--muted); font-weight: 500; letter-spacing: 2px; font-size: .8rem; }
  #vc-scroll { flex: 1 1 auto; overflow-y: auto; padding: 16px 20px; display: flex;

  #vc-scroll .chat-msg.bot { align-self: flex-start; border-bottom-left-radius: 4px;
    background: rgba(255,255,255,.05); border: 1px solid var(--card-border); }
  #vc-scroll .chat-msg.err { align-self: flex-start; background: rgba(239,68,68,.12);
    border: 1px solid rgba(239,68,68,.4); color: #fca5a5; }
  #vc-hint { color: var(--muted); font-size: .95rem; padding: 0 20px 16px; }
  /* type-instead-of-talk bar, so the panel is usable in a quiet room */
  #vc-inputbar { display: flex; gap: 10px; padding: 10px 16px 0; flex: 0 0 auto; }
  #vc-input {
    flex: 1 1 auto; min-width: 0; font-family: inherit; font-size: 1.1rem; color: var(--text);
    background: rgba(255,255,255,.06); border: 1px solid var(--card-border);
    border-radius: 12px; padding: 12px 16px; outline: none;

  #vc-input::placeholder { color: var(--muted); }

  #vc-send {
    flex: 0 0 auto; padding: 0 22px; border-radius: 12px; font-weight: 700; font-size: 1rem;
    color: var(--accent); background: rgba(110,231,183,.2); border: 1px solid rgba(110,231,183,.45);
  }
  #vc-send:hover { background: rgba(110,231,183,.36); }
  /* on a leaf page the panel takes the right half, everything else dims out of the way */
  body.vc-open #vc-panel { right: 2vw; top: 16vh; bottom: 16vh; width: 46vw; max-width: 760px; }
  body.vc-open #clockbox, body.vc-open #spotify-pill { opacity: .18; }
  body.vc-open #window { opacity: .35; pointer-events: none; }
  body.vc-open #orb-label { opacity: .3; }
  /* ============ HUB PAGES (home, apps, templates, life, work, referee) ============
     ONE shared layout for every hub: clock + agenda up top, music pill under it,
     the orb parked in the middle of the ring of buttons. Only the ring contents
     change between hubs, so the screen never jumps when you navigate. */
  body.hub #clockbox { left: 50%; top: 2.6vh; transform: translateX(-50%); text-align: center; }
  body.hub #clockbox .t { font-size: 2.3rem; }
  body.hub #clockbox .d { font-size: 1.05rem; }
  body.hub #clockbox .a { font-size: 1.25rem; margin-top: 2px; }
  body.hub #clockbox .at { font-size: .9rem; }
  body.hub #spotify-pill { left: 50%; top: 15.5vh; transform: translateX(-50%); }
  /* The orb centre comes from HUB_ORB_TOP_VMIN in the JS and the ring wraps it with the
     same number, so a button can never drift off the orb. */
  body.hub #orbwrap {
    left: 50%; top: 60vh; width: 26vmin; height: 26vmin; transform: translate(-50%, -50%);
  }
  body.hub #orb-glow {
    width: 36vmin; height: 36vmin; left: 50%; top: 50%; transform: translate(-50%, -50%);
  }

  /* ============ HOME — the main screen (user's spec) ============
     No ring on home. One BIG orb in the middle, the clock/date above it, the Spotify
     pill between them, and today's schedule in a wide card under the orb. Everything
     below is the pre-JS default; layoutHome() in the JS measures the live page and
     places the pill, orb and card so they can never overlap at any window size. */
  body.home #app-ring { display: none !important; }
  body.home #hintbar { display: none !important; }
  body.home #clockbox { left: 50%; top: 2.2vh; transform: translateX(-50%); text-align: center; }
  body.home #clockbox .t { font-size: clamp(2.4rem, 5.4vmin, 4.6rem); }
  body.home #clockbox .d { font-size: clamp(1rem, 1.7vmin, 1.6rem); }
  body.home #clockbox .a { font-size: clamp(1.05rem, 1.9vmin, 1.85rem); margin-top: 4px; }
  body.home #clockbox .at { font-size: clamp(.85rem, 1.2vmin, 1.15rem); }
  body.home #spotify-pill { left: 50%; top: 17vh; transform: translateX(-50%); }
  body.home #orbwrap { left: 50%; top: 46vh; width: 38vmin; height: 38vmin; transform: translate(-50%, -50%); }
  body.home #orb-glow { width: 52vmin; height: 52vmin; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  body.home #orb-label { font-size: .95rem; }

  /* Home carries NO schedule card — the agenda line under the clock is the only
     schedule readout (user's spec: "remove the schedule excluding the one near the
     time"). The orb therefore gets the whole space below the pill. */

  /* ============ VOICE MODE on a hub (panel open) ============
     The panel owns the right half, so the ring steps aside, the orb shrinks to the
     left and everything else fades back instead of fighting the panel. */
  body.hub.vc-open #app-ring { display: none; }
  body.hub.vc-open #orbwrap { left: 22vw; top: 50vh; width: 22vmin; height: 22vmin; }
  body.hub.vc-open #orb-glow { width: 30vmin; height: 30vmin; }
  body.hub.vc-open #clockbox, body.hub.vc-open #spotify-pill { opacity: .18; }

  /* always-visible hint strip (hub pages only, hidden while the panel is up) */
  #hintbar {
    position: fixed; left: 30px; bottom: 22px;
    display: none; flex-direction: column; align-items: flex-start; gap: 6px;
    color: var(--muted); font-size: 1rem; letter-spacing: .3px; line-height: 1.5;
    background: rgba(6,20,12,.72); border: 1px solid var(--card-border);
    border-radius: 18px; padding: 14px 22px; backdrop-filter: blur(8px);
    max-width: 30vw;
  }
  #hintbar b { color: var(--accent); font-weight: 700; }
  body.hub #hintbar { display: flex; }
  body.hub.vc-open #hintbar { display: none; }
  @media (max-height: 620px) { #hintbar { display: none !important; } }
  /* ring of buttons around the orb */
  #app-ring { position: absolute; inset: 0; pointer-events: none; }
  #app-ring .app-btn {
    pointer-events: auto; position: absolute; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; padding: 8px 12px; border-radius: 20%;
    background: rgba(10,20,14,.86); border: 1px solid var(--card-border); color: var(--accent);
    font-weight: 700; letter-spacing: .5px; text-align: center; line-height: 1.1;
    box-shadow: 0 10px 26px rgba(0,0,0,.5); backdrop-filter: blur(6px);
    transition: background .2s var(--ease), border-color .2s var(--ease), transform .18s var(--ease);
  }
  #app-ring .app-btn:hover, #app-ring .app-btn:focus-visible {
    background: rgba(110,231,183,.26); border-color: rgba(110,231,183,.6);
    transform: translate(-50%, -50%) scale(1.06); outline: none;
  }
  #app-ring .app-btn:active { transform: translate(-50%, -50%) scale(.97); }
  #app-ring .app-btn-label { font-size: .95rem; letter-spacing: .2px; }
  #app-ring .app-btn-sub { font-size: .78rem; }
  #app-ring .app-btn-sub {
    font-weight: 500; color: var(--muted); letter-spacing: .2px; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* The ring only belongs to hubs. One rule, so a new hub gets it automatically —
     no more adding a body.<page> selector to a list every time. */
  body:not(.hub) #app-ring { display: none; }
  body.hub #app-ring { display: block; }
  /* while the voice panel owns the right half, the ring would only collide */
  body.hub.vc-open #app-ring { display: none; }

<script>
  // ================= mesh orb (Three.js) =================
  var orbApi;
  (function () {
    var orb = document.getElementById('orb');
    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
    camera.position.z = 3.2;
    var renderer = new THREE.WebGLRenderer({ canvas: orb, alpha: true, antialias: true });
    var size = Math.min(window.innerWidth, window.innerHeight) * 0.40; // home full-size, centered default
    renderer.setSize(size, size);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

    var group = new THREE.Group(); scene.add(group);
    var geometry = new THREE.IcosahedronGeometry(1.15, 2);
    var sphere = new THREE.Mesh(geometry,
      new THREE.MeshBasicMaterial({ color: 0x00e676, wireframe: true, transparent: true, opacity: 0.35 }));
    group.add(sphere);
    var innerSphere = new THREE.Mesh(new THREE.IcosahedronGeometry(0.95, 1),
      new THREE.MeshBasicMaterial({ color: 0x00e676, transparent: true, opacity: 0.06 }));
    group.add(innerSphere);

    var verts = geometry.attributes.position.array;
    var dotPositions = [];
    for (var i = 0; i < verts.length; i += 3) {
      var x = verts[i], y = verts[i+1], z = verts[i+2];
      var len = Math.sqrt(x*x + y*y + z*z);
      dotPositions.push(x/len*1.18, y/len*1.18, z/len*1.18);
    }
    var dotGeo = new THREE.BufferGeometry();
    dotGeo.setAttribute('position', new THREE.Float32BufferAttribute(dotPositions, 3));
    var dots = new THREE.Points(dotGeo,
      new THREE.PointsMaterial({ color: 0x69f0ae, size: 0.035, transparent: true, opacity: 0.7 }));
    group.add(dots);

    var particleCount = 60;
    var particlesGeo = new THREE.BufferGeometry();
    var positions = new Float32Array(particleCount * 3);
    var speeds = [];
    for (var i2 = 0; i2 < particleCount; i2++) {
      var r = 1.9 + Math.random() * 2.6;
      var theta = Math.random() * Math.PI * 2;
      var phi = Math.acos(2 * Math.random() - 1);
      positions[i2*3]   = r * Math.sin(phi) * Math.cos(theta);
      positions[i2*3+1] = r * Math.sin(phi) * Math.sin(theta);
      positions[i2*3+2] = r * Math.cos(phi);
      speeds.push(0.002 + Math.random() * 0.006);
    }
    particlesGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    var particles = new THREE.Points(particlesGeo,
      new THREE.PointsMaterial({ color: 0x00e676, size: 0.025, transparent: true, opacity: 0.35 }));
    scene.add(particles);

    var targetRotX = 0, targetRotY = 0;
    document.addEventListener('mousemove', function (e) {
      var mx = (e.clientX / window.innerWidth) * 2 - 1;
      var my = (e.clientY / window.innerHeight) * 2 - 1;
      targetRotY = mx * 0.25; targetRotX = my * 0.25;
    });

    var glowEl = document.getElementById('orb-glow');
    var wrapEl = document.getElementById('orbwrap');
    var mSphere = sphere.material, mInner = innerSphere.material,
        mDots = dots.material, mParts = particles.material;
    function setSize(px) {
      orb.style.width = px + 'px'; orb.style.height = px + 'px';
      renderer.setSize(px, px);
    }
    // setTop shifts the CENTRE of the orb stage. The CSS keeps the orbwrap centred
    // in its own box (translate -50%), so changing 'top' here moves the orb together
    // with its glow and the ring that wraps it.
    function setTop(px) {
      if (wrapEl) wrapEl.style.top = Math.round(px) + 'px';
    }
    orbApi = {
      setColor: function (hex) {
        var c = new THREE.Color(hex);
        mSphere.color.copy(c); mInner.color.copy(c);
        mDots.color.copy(c); mParts.color.copy(c);
        if (glowEl) glowEl.style.background = 'radial-gradient(circle, ' + hex + '59 0%, ' + hex + '1f 40%, transparent 70%)';
      },
      setSize: setSize,
      setTop: setTop
    };

    function animate() {
      requestAnimationFrame(animate);
      sphere.rotation.x += 0.003; sphere.rotation.y += 0.005;
      innerSphere.rotation.x -= 0.002; innerSphere.rotation.y += 0.003;
      dots.rotation.x += 0.001; dots.rotation.y += 0.002;
      group.rotation.x += (targetRotX - group.rotation.x) * 0.05;
      group.rotation.y += (targetRotY - group.rotation.y) * 0.05;
      particles.rotation.y += 0.0005;
      var pos = particlesGeo.attributes.position.array;
      for (var i3 = 0; i3 < particleCount; i3++) {
        pos[i3*3+1] += speeds[i3];
        if (pos[i3*3+1] > 4) pos[i3*3+1] = -4;
      }
      particlesGeo.attributes.position.needsUpdate = true;
      renderer.render(scene, camera);
    }
    animate();
  })();

  // ================= clock + agenda =================
  function tick() {
    const d = new Date();
    document.getElementById('c-time').textContent = d.toLocaleTimeString('en-AU', {hour:'2-digit',minute:'2-digit',hour12:true});
    document.getElementById('c-date').textContent = d.toLocaleDateString('en-AU', {weekday:'long', day:'numeric', month:'long'});
  }
  tick(); setInterval(tick, 1000);

  const A2 = 'http://localhost:2008/api/calendar/events?days=1';
  async function refreshAgenda() {
    try {
      const r = await fetch(A2);
      const evs = await r.json();
      const now = new Date();
      let cur = evs.find(e => { const s = new Date(e.start), f = new Date(e.end); return s <= now && now < f; });
      if (!cur) cur = evs.find(e => new Date(e.start) > now);
      let txt, time;
      if (!cur) { txt = 'All done for today'; time = ''; }
      else {
        txt = (cur.summary || '(untitled)').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{23F0}-\u{23FF}\u{2B00}-\u{2BFF}]/gu, '');
        const time12 = (ts) => {
          if (!ts) return '';
          const h = parseInt(ts.slice(11,13),10) || 12;
          return (h % 12 || 12) + ':' + ts.slice(14,16) + (h < 12 ? 'am' : 'pm');
        };
        time = (cur.start ? time12(cur.start) + ' - ' + time12(cur.end || '') : '') + (cur.location ? '  .  ' + cur.location : '');
      }
      document.getElementById('c-agenda').textContent = txt;
      document.getElementById('c-agenda-time').textContent = time;
    } catch (e) { document.getElementById('c-agenda').textContent = 'Agenda unavailable'; }
  }
  refreshAgenda(); setInterval(refreshAgenda, 30000);

  // ================= Spotify =================
  const API = 'http://localhost:2008/api';
  const SP = 'http://localhost:2008/api/spotify/status';
  async function refreshSpotify() {
    try {
      const r = await fetch(SP);
      const d = await r.json();
      const item = d.item;
      document.getElementById('sp-title').textContent = item && item.name ? item.name : 'Nothing playing';
      document.getElementById('sp-artist').textContent = item && item.artists ? item.artists.map(a => a.name).join(', ') : '';
      document.getElementById('sp-toggle-ico').innerHTML = (item && item.is_playing)

  refreshSpotify(); setInterval(refreshSpotify, 5000);

  function spAction(name) {
    fetch(API + '/spotify/' + name.replace('spotify_', ''), { method: 'POST' })
      .then(() => setTimeout(refreshSpotify, 900));
  }
  document.getElementById('sp-prev').addEventListener('click', () => spAction('spotify_prev'));
  document.getElementById('sp-toggle').addEventListener('click', () => {
    // toggle = play when paused, pause when playing (client knows current state)
    const playing = document.getElementById('sp-toggle-ico').innerHTML.indexOf('M6 5h4v14H6zM14 5h4v14h-4z') !== -1;
    fetch(API + '/spotify/' + (playing ? 'pause' : 'play'), { method: 'POST' })
      .then(() => setTimeout(refreshSpotify, 900));
  });
  document.getElementById('sp-next').addEventListener('click', () => spAction('spotify_next'));

  // ================= Spotify player window =================
  // Clicking the pill opens a player. Everything here is one window: playlists on the
  // left, album cover, transport + seek, vertical volume on the far right.
  //
  // Polling: while the window is open we poll the player endpoint on a timer that
  // pauses during a drag, so a slider the user is holding is never yanked back to an
  // older position mid-gesture.
  const SPP_PLAYER = 'http://localhost:2008/api/spotify/player';
  const SPP_PLAYLISTS = 'http://localhost:2008/api/spotify/playlists';
  const SPP_TOP = 'http://localhost:2008/api/spotify/top-playlists';
  const SPP_SEARCH = 'http://localhost:2008/api/spotify/search';
  let spPlayerOpen = false;
  let spPollTimer = null;
  let spPlaylistsLoaded = false;
  let spDragging = false;        // true while the user holds the seek thumb
  let spDraggingVol = false;     // true while the user holds the volume thumb
  let spSeeking = false;         // true between a seek POST and its echo coming back
  let spSearchTimer = null;      // debounce for the song search
  let spSearchOn = false;        // true while the results list is showing
  let spNowContext = '';         // the playlist/album currently playing
  let spNowPos = 0;              // where it was when last polled (for the resume button)

  const el = (id) => document.getElementById(id);

  function fmtTime(ms) {
    if (!ms || ms < 0) ms = 0;
    const total = Math.floor(ms / 1000);
    const m = Math.floor(total / 60);
    const s = total % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function spErr(msg) {
    const e = el('sp-player-err');
    if (e) e.textContent = msg || '';
  }

  function spSetArt(url) {
    const img = el('sp-big-art');
    if (!img) return;
    if (url) {
      // Only touch src when it actually changed — reassigning it every poll makes the
      // image flicker and re-download.
      if (img.getAttribute('src') !== url) img.src = url;
      img.classList.remove('hidden');
    } else {
      img.classList.add('hidden');
      img.removeAttribute('src');
    }
  }

  function spSetPlayIcon(playing) {
    const playPath = 'M8 5v14l11-7z';
    const pausePath = 'M6 5h4v14H6zM14 5h4v14h-4z';
    const big = el('sp-toggle-big');
    if (big) big.innerHTML = '<path d="' + (playing ? pausePath : playPath) + '"/>';
    const ico = el('sp-toggle-ico');
    if (ico) ico.innerHTML = '<path d="' + (playing ? pausePath : playPath) + '"/>';
  }

  function applyPlayer(d) {
    if (!d) return;
    if (d.needs_auth) {
      spErr('Spotify needs authorising — run: hermes auth spotify');
      return;
    }
    const item = d.item;
    const dur = d.duration_ms || 0;
    const prog = d.progress_ms || 0;

    // remember the duration so the seek handler can convert slider units to ms
    const seekElDur = el('sp-seek');
    if (seekElDur) seekElDur.dataset.dur = String(dur);

    if (el('sp-track-name')) el('sp-track-name').textContent = (item && item.name) || 'Nothing playing';
    if (el('sp-track-artist')) el('sp-track-artist').textContent = (item && item.artists) ? item.artists.join(', ') : '';
    if (el('sp-track-album')) el('sp-track-album').textContent = (item && item.album) || '';
    spSetArt(item && item.image);
    spSetPlayIcon(!!d.playing);

    // seek: the input is 0..1000 so a 3-minute track and a 9-minute track both get
    // usable resolution; convert to/from ms at the edges.
    const seek = el('sp-seek');
    if (seek) {
      if (dur > 0) {
        seek.disabled = spDragging || spSeeking;
        if (!spDragging && !spSeeking) {
          seek.value = String(Math.round((prog / dur) * 1000));
        }
        if (el('sp-elapsed')) el('sp-elapsed').textContent = fmtTime(prog);
        if (el('sp-remain')) el('sp-remain').textContent = '-' + fmtTime(Math.max(0, dur - prog));
      } else {
        seek.disabled = true;
        seek.value = '0';
        if (el('sp-elapsed')) el('sp-elapsed').textContent = '0:00';
        if (el('sp-remain')) el('sp-remain').textContent = '0:00';
      }
    }

    // volume
    const dev = d.device;
    const vol = el('sp-vol');
    if (vol) {
      const supported = !!(dev && dev.supports_volume && dev.volume_percent != null);
      vol.disabled = !supported || spDraggingVol;
      const pct = supported ? dev.volume_percent : 0;
      if (supported && !spDraggingVol) vol.value = String(pct);
      if (el('sp-vol-val')) el('sp-vol-val').textContent = supported ? (pct + '%') : '--';
      const ico = el('sp-vol-ico');
      if (ico) ico.className = (supported && pct > 0) ? '' : 'muted';
      if (dev && !dev.supports_volume) spErr('This device does not accept volume changes from Spotify.');
    }

    // mark the playlist that is playing, if the context is one of them
    if (item) spMarkCurrent();

    // remember the context + position for the "Go to Spotify" button
    spNowContext = (d.context && d.context.uri) || '';
    spNowPos = prog;
    spUpdateGoto();
  }

  // The "Spotify" button opens the desktop client. It is always usable — handing a
  // playlist over is a bonus when one is playing, not a requirement for opening the app.
  //
  // spGotoSticky holds a result message ("Spotify opened") that the 1s player poll must
  // not clobber: without it, spUpdateGoto ran on the next tick and wiped the feedback
  // before it could be read.
  let spGotoSticky = 0;
  function spGotoSay(msg, holdMs) {
    const hint = el('sp-goto-hint');
    if (!hint) return;
    hint.textContent = msg;
    spGotoSticky = Date.now() + (holdMs || 4000);
  }
  function spUpdateGoto() {
    const btn = el('sp-goto');
    const hint = el('sp-goto-hint');
    if (!btn) return;
    btn.disabled = false;
    if (!hint) return;
    if (Date.now() < spGotoSticky) return;      // a result message is still showing
    if (spNowContext.indexOf('spotify:playlist:') === 0) {
      hint.textContent = '';
    } else if (spNowContext) {
      hint.textContent = 'Opens Spotify (playing from an album, so it will not resume).';
    } else {
      hint.textContent = 'Opens the Spotify app.';
    }
  }

  async function spRefreshPlayer() {
    if (!spPlayerOpen) return;
    try {
      const r = await fetch(SPP_PLAYER);
      applyPlayer(await r.json());
      spErr('');
    } catch (e) {
      spErr('Cannot reach the Spotify backend on :2008');
    }
  }

  function spStartPoll() {
    if (spPollTimer) return;
    spPollTimer = setInterval(spRefreshPlayer, 1000);
  }
  function spStopPoll() {
    if (spPollTimer) { clearInterval(spPollTimer); spPollTimer = null; }
  }

  // ---- playlists: the twelve most listened, in a fixed 3x4 ----
  async function spLoadPlaylists(force) {
    if (spPlaylistsLoaded && !force) return;
    const grid = el('sp-pl-grid');
    if (!grid) return;
    if (el('sp-pl-status')) el('sp-pl-status').textContent = 'Loading playlists...';
    try {
      const r = await fetch(SPP_TOP);
      const d = await r.json();
      const pls = d.playlists || [];
      if (d.needs_auth) {
        if (el('sp-pl-status')) el('sp-pl-status').textContent = 'Spotify needs authorising.';
        return;
      }
      spRenderPlaylists(pls);
      spPlaylistsLoaded = true;
      if (el('sp-pl-status')) el('sp-pl-status').textContent = '';
    } catch (e) {
      if (el('sp-pl-status')) el('sp-pl-status').textContent = 'Could not load playlists from :2008';
    }
  }

  function spRenderPlaylists(pls) {
    const grid = el('sp-pl-grid');
    if (!grid) return;
    grid.innerHTML = '';
    pls.forEach(function (p) {
      const card = document.createElement('button');
      card.className = 'sp-pl-card';
      card.type = 'button';
      card.dataset.uri = p.uri || '';
      card.title = (p.name || '') + (p.tracks ? ' (' + p.tracks + ' tracks)' : '');

      const art = document.createElement('div');
      art.className = 'sp-pl-art';
      if (p.image) {
        const img = document.createElement('img');
        img.src = p.image;
        img.alt = '';
        img.loading = 'lazy';
        art.appendChild(img);
      } else {
        const no = document.createElement('div');
        no.className = 'noart';
        no.textContent = (p.name || '?').trim().charAt(0).toUpperCase() || '?';
        art.appendChild(no);
      }
      card.appendChild(art);

      const name = document.createElement('div');
      name.className = 'sp-pl-name';
      name.textContent = p.name || '(untitled)';
      card.appendChild(name);

      const count = document.createElement('div');
      count.className = 'sp-pl-count';
      count.textContent = p.tracks ? (p.tracks + ' tracks') : '';
      card.appendChild(count);

      card.addEventListener('click', function () { spPlayPlaylist(p); });
      grid.appendChild(card);
    });
    spFitGrid(pls.length);
  }

  // Size the 3x4 so it is centred in the window AND clears the search bar.
  //
  // Uses LAYOUT metrics (clientHeight/offsetHeight), never getBoundingClientRect: the
  // window is scaled during the open/close morph, and a rect would return the scaled
  // size, so the grid would be fitted against a 12%-scale box.
  //
  // The grid overlays the whole column, so `align-content: center` puts the block's
  // centre on the window's centre. The block must also start below the search bar, so
  // centring and clearing the bar together impose a ceiling on the block height:
  //   gridCentre - blockH/2  >=  barBottom + gap
  // Solve that for the cover size; reserving height asymmetrically (padding) would
  // move the block's centre off the window's.
  function spFitGrid(count) {
    const grid = el('sp-pl-grid');
    if (!grid || !count) return;
    if (!grid.clientWidth || !grid.clientHeight) return;

    const COLS = 3, ROWS = 4;
    const GAP = 12;
    const NAME_H = 17;          // one line at .82rem
    const CARD_GAP = 6;         // cover -> name

    const centre = grid.clientHeight / 2;
    // the search bar's bottom, measured from the grid's top edge (both unscaled)
    const topEl = el('sp-top');
    const colPadTop = parseFloat(getComputedStyle(grid.parentElement).paddingTop) || 0;
    const barBottom = topEl ? (colPadTop + topEl.offsetHeight) : 0;
    const maxBlockH = Math.max(160, 2 * (centre - barBottom - 12));   // 12px breathing gap

    const usedRows = Math.min(ROWS, Math.ceil(count / COLS));
    const chrome = usedRows * (NAME_H + CARD_GAP) + (usedRows - 1) * GAP;

    const cellW = (grid.clientWidth - GAP * (COLS - 1)) / COLS;
    const coverFromH = (maxBlockH - chrome) / usedRows;
    const cover = Math.max(40, Math.min(cellW, coverFromH));

    grid.style.setProperty('--sp-cover', Math.floor(cover) + 'px');
  }

  function spMarkCurrent() {
    // Highlight the playlist card the user last started. The playback payload does not
    // carry the context URI (kept lean on purpose), so the click is the source of
    // truth for "which playlist is this" instead of a second Spotify round trip.
    const grid = el('sp-pl-grid');
    if (!grid) return;
    grid.querySelectorAll('.sp-pl-card.now').forEach(function (c) {
      if (c.dataset.uri !== spNowUri) c.classList.remove('now');
    });
    if (spNowUri) {
      const sel = grid.querySelector('.sp-pl-card[data-uri="' + spNowUri.replace(/"/g, '') + '"]');
      if (sel) sel.classList.add('now');
    }
  }
  let spNowUri = '';

  async function spPlayPlaylist(p) {
    if (!p || !p.uri) return;
    spNowUri = p.uri;
    spNowContext = p.uri;
    spMarkCurrent();
    if (el('sp-pl-status')) el('sp-pl-status').textContent = 'Playing ' + (p.name || '') + '...';
    try {
      const r = await fetch(API + '/spotify/playlist', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ uri: p.uri }),
      });
      const d = await r.json();
      if (d.ok) {
        if (el('sp-pl-status')) el('sp-pl-status').textContent = 'Playing ' + (p.name || '');
        setTimeout(spRefreshPlayer, 800);
      } else {
        if (el('sp-pl-status')) el('sp-pl-status').textContent = 'Could not play: ' + (d.error || 'unknown');
      }
    } catch (e) {
      if (el('sp-pl-status')) el('sp-pl-status').textContent = 'Backend unreachable on :2008';
    }
  }

  // ---- song search ----
  // Typing swaps the grid for a results list; clearing puts the 3x4 back. The query is
  // debounced because every keystroke would otherwise be a Spotify round trip.
  function spSearchMode(on) {
    spSearchOn = on;
    const grid = el('sp-pl-grid');
    const res = el('sp-search-results');
    const clear = el('sp-search-clear');
    if (grid) grid.classList.toggle('off', on);
    if (res) res.classList.toggle('on', on);
    if (clear) clear.classList.toggle('hidden', !on);
    if (!on) {
      // going back to the grid: wipe results and re-fit
      if (res) res.innerHTML = '';
      spFitGrid(document.querySelectorAll('.sp-pl-card').length);
    }
  }

  function spRenderSearch(tracks, query) {
    const res = el('sp-search-results');
    if (!res) return;
    res.innerHTML = '';
    if (!tracks.length) {
      const h = document.createElement('div');
      h.className = 'sp-sr-hint';
      h.textContent = 'No songs found for "' + query + '"';
      res.appendChild(h);
      return;
    }
    tracks.forEach(function (t) {
      const row = document.createElement('button');
      row.className = 'sp-sr';
      row.type = 'button';
      row.title = t.name + ' — ' + (t.artists || []).join(', ');

      if (t.image) {
        const img = document.createElement('img');
        img.src = t.image;
        img.alt = '';
        img.loading = 'lazy';
        row.appendChild(img);
      }
      const txt = document.createElement('div');
      txt.className = 'sp-sr-txt';
      const nm = document.createElement('div');
      nm.className = 'sp-sr-name';
      nm.textContent = t.name || '';
      const ar = document.createElement('div');
      ar.className = 'sp-sr-artist';
      ar.textContent = (t.artists || []).join(', ');
      txt.appendChild(nm); txt.appendChild(ar);
      row.appendChild(txt);

      const dur = document.createElement('span');
      dur.className = 'sp-sr-dur';
      dur.textContent = fmtTime(t.duration_ms);
      row.appendChild(dur);

      row.addEventListener('click', function () { spPlayTrack(t); });
      res.appendChild(row);
    });
  }

  async function spDoSearch(q) {
    const query = (q || '').trim();
    if (!query) { spSearchMode(false); return; }
    spSearchMode(true);
    const res = el('sp-search-results');
    if (res) res.innerHTML = '<div class="sp-sr-hint">Searching...</div>';
    try {
      const r = await fetch(SPP_SEARCH + '?q=' + encodeURIComponent(query));
      const d = await r.json();
      if (d.needs_auth) {
        if (res) res.innerHTML = '<div class="sp-sr-hint">Spotify needs authorising.</div>';
        return;
      }
      spRenderSearch(d.tracks || [], query);
    } catch (e) {
      if (res) res.innerHTML = '<div class="sp-sr-hint">Search failed — backend unreachable.</div>';
    }
  }

  async function spPlayTrack(t) {
    if (!t || !t.uri) return;
    spNowUri = '';            // a single track is not one of the playlist cards
    spNowContext = '';
    spMarkCurrent();
    try {
      const r = await fetch(API + '/spotify/track', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ uri: t.uri }),
      });
      const d = await r.json();
      if (!d.ok) console.warn('play track failed:', d.error);
      setTimeout(spRefreshPlayer, 800);
    } catch (e) { /* poll will surface it */ }
  }

  const searchEl = el('sp-search');
  if (searchEl) {
    searchEl.addEventListener('input', function () {
      const q = searchEl.value;
      if (spSearchTimer) clearTimeout(spSearchTimer);
      if (!q.trim()) { spSearchMode(false); return; }
      spSearchTimer = setTimeout(function () { spDoSearch(q); }, 280);
    });
    searchEl.addEventListener('keydown', function (e) {
      // Escape clears the field first, so it does not also close the whole window
      if (e.key === 'Escape' && searchEl.value) {
        e.stopPropagation();
        searchEl.value = '';
        spSearchMode(false);
      }
    });
  }
  if (el('sp-search-clear')) {
    el('sp-search-clear').addEventListener('click', function () {
      if (searchEl) searchEl.value = '';
      spSearchMode(false);
      if (searchEl) searchEl.focus();
    });
  }

  // ---- go to Spotify ----
  // Brings the DESKTOP Spotify client to the front. Two jobs, in order: hand the current
  // playlist over (so the app becomes the active device and picks up where the mirror
  // left off), then launch/raise the app itself via :2008.
  if (el('sp-goto')) {
    el('sp-goto').addEventListener('click', async function () {
      spGotoSay('Opening Spotify...', 8000);

      // 1. hand playback over, if there is a playlist to resume
      let handed = false;
      if (spNowContext.indexOf('spotify:playlist:') === 0) {
        try {
          const r = await fetch(API + '/spotify/resume', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ context_uri: spNowContext, position_ms: spNowPos }),
          });
          const d = await r.json();
          handed = !!d.ok;
        } catch (e) { /* fall through to just opening the app */ }
      }

      // 2. launch / raise the desktop app
      try {
        const r = await fetch(API + '/spotify/open-app', { method: 'POST' });
        const d = await r.json();
        if (d.ok) {
          spGotoSay(handed ? 'Playing in Spotify.' : 'Spotify opened.');
        } else {
          spGotoSay('Could not open Spotify: ' + (d.error || 'unknown'));
        }
      } catch (e) {
        spGotoSay('Backend unreachable on :2008');
      }
      setTimeout(spRefreshPlayer, 1200);
    });
  }

  // ---- open / close ----
  // Point the window's closed state at the pill: --sp-dx/--sp-dy are the offset from
  // the window's centred position to the pill's centre, so the open animation reads as
  // the pill unfolding rather than a box appearing in the middle.
  //
  // Both sides are measured from LAYOUT metrics, not getBoundingClientRect: the window
  // is mid-morph (scaled to ~0.12) when this runs, and a rect would compare a
  // 216px-wide scaled box against the pill — which produced a nonsense dy of -2846px.
