    // ---------- load ----------
    var pgMoneyGoalsList = [];
    var pgMoneySubs = [];
    var pgMoneyLedgerList = [];

    function pgMoneyLoad() {
      if (!pgMoneyAlive) return;
      pgMoneyDisarm();
      return Promise.all([
        hwJ(pgMoneyAPI).catch(function () { return null; }),
        hwJ(pgMoneyAPI + '/networth').catch(function () { return null; }),
        hwJ(pgMoneyAPI + '/goals').catch(function () { return null; }),
        hwJ(pgMoneyAPI + '/subscriptions').catch(function () { return null; }),
        hwJ(pgMoneyAPI + '/ledger?limit=30').catch(function () { return null; })
      ]).then(function (res) {
        if (!pgMoneyAlive) return;
        var d = res[0];
        if (!d) { pgMoneyShowError('Money backend unreachable.'); return; }

        var nw = res[1];
        d.netWorth = (nw && nw.net_worth !== undefined) ? nw.net_worth
          : (pgMoneyNum(d.cash) + pgMoneyNum(d.savings) + pgMoneySum(d.accounts));

        pgMoneyGoalsList = Array.isArray(res[2]) ? res[2] : [];
        pgMoneySubs = Array.isArray(res[3]) ? res[3] : [];
        pgMoneyLedgerList = Array.isArray(res[4]) ? res[4] : [];

        pgMoneyPane.innerHTML = '';
        pgMoneyAddZone.innerHTML = '';

        if (pgMoneyTab === 'overview') pgMoneyOverview(d);
        else if (pgMoneyTab === 'goals') pgMoneyGoals();
        else if (pgMoneyTab === 'subs') pgMoneySubsTab();
        else pgMoneyLedger();
      });
    }

    function pgMoneySum(accounts) {
      var t = 0;
      if (!accounts) return 0;
      for (var k in accounts) {
        if (Object.prototype.hasOwnProperty.call(accounts, k)) t += pgMoneyNum(accounts[k]);
      }
      return t;
    }

    var pgMoneyTimer = setInterval(pgMoneyLoad, 60000);
    pgMoneyLoad();

    return function () {
      pgMoneyAlive = false;
      clearInterval(pgMoneyTimer);
      if (pgMoneyArmTimer) clearTimeout(pgMoneyArmTimer);
      pgMoneyArmTimer = null;
    };
  };

  // ---- shopping ----
  // ---- Shopping ----
  HW_PAGE['shopping'] = function (host) {
    host.innerHTML = '';

    var pgShopWrap = hwEl('div', 'pg-wrap');
    var pgShopAddbar = hwEl('div', 'pg-addbar');
    var pgShopInput = hwEl('input', 'pg-input');
    var pgShopAddBtn = hwEl('button', 'pg-btn', '+');
    var pgShopCount = hwEl('div', 'pg-muted', '');
    var pgShopList = hwEl('div', 'pg-wrap');
    var pgShopMsg = hwEl('div', 'pg-empty', '');

    pgShopInput.type = 'text';
    pgShopInput.placeholder = 'Add an item...';
    pgShopAddBtn.type = 'button';

    pgShopAddbar.appendChild(pgShopInput);
    pgShopAddbar.appendChild(pgShopAddBtn);
    pgShopWrap.appendChild(pgShopAddbar);
    pgShopWrap.appendChild(pgShopCount);
    pgShopMsg.style.display = 'none';
    pgShopWrap.appendChild(pgShopMsg);
    pgShopWrap.appendChild(pgShopList);
    host.appendChild(pgShopWrap);

    function pgShopPost(path, body) {
      return fetch('http://localhost:2008/api' + path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
    }

    function pgShopShowMsg(msg) {
      pgShopMsg.textContent = msg;
      pgShopMsg.style.display = '';
    }

    function pgShopHideMsg() {
      pgShopMsg.textContent = '';
      pgShopMsg.style.display = 'none';
    }

    function pgShopItemText(entry) {
      var t = (entry && entry.text) ? String(entry.text) : '';
      return hwClean(t.slice(5)).trim();
    }

    function pgShopLoad() {
      return hwJ('http://localhost:2008/api/brain').then(function (data) {
        var all = (data && data.length) ? data : [];
        var items = [];
        var i;
        for (i = 0; i < all.length; i++) {
          if (all[i] && typeof all[i].text === 'string' && all[i].text.indexOf('shop ') === 0) {
            items.push(all[i]);
          }
        }
        pgShopRender(items);
      }).catch(function () {
        pgShopCount.textContent = '';
        pgShopList.innerHTML = '';
        pgShopShowMsg('Shopping list unavailable.');
      });
    }

    function pgShopRender(items) {
      var i, entry, done, row, main, title, side, btn, del, toBuy = 0, pending = [], bought = [];
      for (i = 0; i < items.length; i++) {
        if (items[i] && items[i].type === 'task') {
          pending.push(items[i]);
          toBuy++;
        } else {
          bought.push(items[i]);
        }
      }

      pgShopHideMsg();
      pgShopCount.textContent = toBuy + ' to buy';
      pgShopList.innerHTML = '';

      var ordered = pending.concat(bought);
      for (i = 0; i < ordered.length; i++) {
        entry = ordered[i];
        done = entry.type !== 'task';
        row = hwEl('div', 'pg-row' + (done ? ' done' : ''));
        main = hwEl('div', 'pg-main');
        title = hwEl('div', 'pg-title', pgShopItemText(entry));
        main.appendChild(title);
        row.appendChild(main);

        side = hwEl('div', 'pg-side');
        btn = hwEl('button', 'pg-btn', done ? 'Undo' : 'Bought');
        btn.type = 'button';
        (function (id) {
          btn.onclick = function () {
            btn.disabled = true;
            pgShopPost('/brain/update', { id: id, type: 'task' }).then(function () {
              return pgShopLoad();
            }).catch(function () {
              btn.disabled = false;
              pgShopShowMsg('Could not update that item.');
            });
          };
        })(entry.id);
        side.appendChild(btn);

        del = hwEl('button', 'pg-btn warn', 'x');
        del.type = 'button';
        (function (id) {
          del.onclick = function () {
            del.disabled = true;
            pgShopPost('/brain/delete', { id: id }).then(function () {
              return pgShopLoad();
            }).catch(function () {
              del.disabled = false;
              pgShopShowMsg('Could not delete that item.');
            });
          };
        })(entry.id);
        side.appendChild(del);

        row.appendChild(side);
        pgShopList.appendChild(row);
      }

      if (!ordered.length) {
        pgShopShowMsg('Nothing on the shopping list.');
      }
    }

    function pgShopAdd() {
      var text = pgShopInput.value ? pgShopInput.value.trim() : '';
      if (!text) { return; }
      pgShopAddBtn.disabled = true;
      pgShopPost('/brain/add', { text: 'shop ' + text, type: 'task' }).then(function () {
        pgShopInput.value = '';
        pgShopAddBtn.disabled = false;
        return pgShopLoad();
      }).catch(function () {
        pgShopAddBtn.disabled = false;
        pgShopShowMsg('Could not add that item.');
      });
    }

    pgShopAddBtn.onclick = pgShopAdd;
    pgShopInput.onkeydown = function (e) {
      if (e && e.key === 'Enter') { pgShopAdd(); }
    };

    var pgShopTimer = setInterval(pgShopLoad, 60000);
    pgShopLoad();

    return function () { clearInterval(pgShopTimer); };
  };

  // ---- habits ----
  // ---- Habits ----
  HW_PAGE['habits'] = function (host) {
    host.innerHTML = '';

    var HAB_KEY = 'padawan_habits_v1';
    var HAB_DATE = /^\d{4}-\d{2}-\d{2}$/;

    var pgHabWrap = hwEl('div', 'pg-wrap');
    var pgHabAddbar = hwEl('div', 'pg-addbar');
    var pgHabInput = hwEl('input', 'pg-input');
    var pgHabAddBtn = hwEl('button', 'pg-btn', '+');
    var pgHabMsg = hwEl('div', 'pg-empty', 'No habits yet. Add one above.');
    var pgHabGrid = hwEl('div', 'pg-hab');

    pgHabInput.type = 'text';
    pgHabInput.placeholder = 'Add a habit...';
    pgHabInput.maxLength = 24;
    pgHabInput.setAttribute('maxlength', '24');
    pgHabAddBtn.type = 'button';

    pgHabAddbar.appendChild(pgHabInput);
    pgHabAddbar.appendChild(pgHabAddBtn);
    pgHabWrap.appendChild(pgHabAddbar);
    pgHabWrap.appendChild(pgHabMsg);
    pgHabWrap.appendChild(pgHabGrid);
    host.appendChild(pgHabWrap);

    var pgHabData = pgHabRead();
    var pgHabDay = pgHabTodayKey();
    var pgHabArmedBtn = null;
    var pgHabArmedIdx = -1;
    var pgHabArmTimer = null;

    // ---------- local date helpers ----------
    function pgHabPad(n) {
      return (n < 10 ? '0' : '') + n;
    }

    function pgHabKey(d) {
      return d.getFullYear() + '-' + pgHabPad(d.getMonth() + 1) + '-' + pgHabPad(d.getDate());
    }

    function pgHabTodayKey() {
      return pgHabKey(new Date());
    }

    function pgHabIndexOf(arr, v) {
      var i;
      if (!arr) { return -1; }
      for (i = 0; i < arr.length; i++) {
        if (arr[i] === v) { return i; }
      }
      return -1;
    }

    // ---------- storage: normalise, read, write ----------
    function pgHabNormName(v) {
      var s = hwClean(v == null ? '' : String(v)).replace(/\s+/g, ' ').trim();
      return s.slice(0, 24);
    }

    function pgHabNormDays(v) {
      var out = [], i;
      if (!v || typeof v.length !== 'number') { return out; }
      for (i = 0; i < v.length; i++) {
        if (typeof v[i] === 'string' && HAB_DATE.test(v[i]) && pgHabIndexOf(out, v[i]) < 0) {
          out.push(v[i]);
        }
      }
      return out;
    }

    function pgHabNormHabit(h) {
      var days;
      if (typeof h === 'string') { return { name: pgHabNormName(h), days: [] }; }
      if (!h || typeof h !== 'object') { return null; }
      var nm = pgHabNormName(h.name != null ? h.name : h.title);
      if (!nm) { return null; }
      days = h.days;
      if (!days && h.done) { days = h.done; }
      return { name: nm, days: pgHabNormDays(days) };
    }

    function pgHabRead() {
      var raw = hwLS.get(HAB_KEY, null);
      var src = null, list = [], k, i, n;
      if (raw && raw.habits && typeof raw.habits.length === 'number') {
        src = raw.habits;                                  // current shape
      } else if (raw && typeof raw.length === 'number') {
        src = raw;                                         // legacy: bare array
      } else if (raw && typeof raw === 'object') {
        list = [];                                         // legacy: { Water: [dates] }
        for (k in raw) {
          if (raw.hasOwnProperty && raw.hasOwnProperty(k)) { list.push({ name: k, days: raw[k] }); }
        }
        src = list;
      }
      var out = [];
      if (src) {
        for (i = 0; i < src.length; i++) {
          n = pgHabNormHabit(src[i]);
          if (n) { out.push(n); }
        }
      }
      return { habits: out };
    }

    function pgHabSave() {
      hwLS.set(HAB_KEY, { habits: pgHabData.habits });
    }

    // ---------- streaks ----------
    function pgHabHas(habit, key) {
      return pgHabIndexOf(habit.days, key) >= 0;
    }

    function pgHabStreak(days) {
      var d = new Date(), n = 0;
      if (pgHabIndexOf(days, pgHabKey(d)) < 0) {
        d.setDate(d.getDate() - 1);                        // today not ticked yet: count from yesterday
        if (pgHabIndexOf(days, pgHabKey(d)) < 0) { return 0; }
      }
      while (pgHabIndexOf(days, pgHabKey(d)) >= 0) {
        n++;
        d.setDate(d.getDate() - 1);
      }
      return n;
    }

    // ---------- second-click delete confirmation ----------
    function pgHabResetArm() {
      if (pgHabArmTimer) {
        clearTimeout(pgHabArmTimer);
        pgHabArmTimer = null;
      }
      if (pgHabArmedBtn) { pgHabArmedBtn.textContent = 'x'; }
      pgHabArmedBtn = null;
      pgHabArmedIdx = -1;
    }

    function pgHabArmDelete(btn, idx) {
      pgHabResetArm();
      pgHabArmedBtn = btn;
      pgHabArmedIdx = idx;
      btn.textContent = 'sure';
      pgHabArmTimer = setTimeout(function () { pgHabResetArm(); }, 5000);
    }

    // ---------- actions ----------
    function pgHabRemove(idx) {
      pgHabResetArm();
      if (!pgHabData.habits[idx]) { return; }
      pgHabData.habits.splice(idx, 1);
      pgHabSave();
      pgHabRender();
    }

    function pgHabToggle(idx) {
      pgHabResetArm();
      var h = pgHabData.habits[idx];
      if (!h) { return; }
      var today = pgHabTodayKey();
      var at = pgHabIndexOf(h.days, today);
      if (at >= 0) {
        h.days.splice(at, 1);
      } else {
        h.days.push(today);
        h.days.sort();
      }
      pgHabSave();
      pgHabRender();
    }

    function pgHabAdd() {
      var name = pgHabNormName(pgHabInput.value);
      pgHabInput.value = '';
      if (!name) { return; }
      pgHabData.habits.push({ name: name, days: [] });
      pgHabSave();
      pgHabRender();
    }

    // ---------- rendering ----------
    function pgHabTile(habit, idx, today) {

  HW_PAGE['brain'] = function (host) {
    host.innerHTML = '';

    var pgBrainAPI = 'http://localhost:2008/api';
    var pgBrainTimer = null;
    var pgBrainItems = [];

    var pgBrainWrap = hwEl('div', 'pg-wrap');
    host.appendChild(pgBrainWrap);

    // ---- add bar ----
    var pgBrainBar = hwEl('div', 'pg-addbar');
    pgBrainWrap.appendChild(pgBrainBar);

    var pgBrainInput = hwEl('input', 'pg-input', '');
    pgBrainInput.type = 'text';
    pgBrainInput.placeholder = 'Capture a thought...';
    pgBrainBar.appendChild(pgBrainInput);

    var pgBrainAddTask = hwEl('button', 'pg-btn', 'Task');
    pgBrainBar.appendChild(pgBrainAddTask);

    var pgBrainAddNote = hwEl('button', 'pg-btn', 'Note');
    pgBrainBar.appendChild(pgBrainAddNote);

    // ---- count line ----
    var pgBrainCount = hwEl('div', 'pg-muted', '');
    pgBrainWrap.appendChild(pgBrainCount);

    // ---- list ----
    var pgBrainList = hwEl('div', 'pg-wrap');
    pgBrainWrap.appendChild(pgBrainList);

    function pgBrainPost(path, body) {
      return fetch(pgBrainAPI + path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }).then(function (r) { return r.json(); });
    }

    function pgBrainNum(v) {
      var n = Number(v);
      if (n !== n || n === Infinity || n === -Infinity) return 0;
      return n;
    }

    // ts may arrive in seconds or milliseconds
    function pgBrainMs(ts) {
      var n = pgBrainNum(ts);
      if (n > 0 && n < 100000000000) n = n * 1000;
      return n;
    }

    function pgBrainAge(ts) {
      var ms = pgBrainMs(ts);
      if (!ms) return '';
      var diff = Date.now() - ms;
      if (diff < 0) diff = 0;

      var mins = Math.floor(diff / 60000);
      var hours = Math.floor(diff / 3600000);
      var days = Math.floor(diff / 86400000);

      if (mins < 1) return 'just now';
      if (mins === 1) return '1 minute ago';
      if (mins < 60) return mins + ' minutes ago';
      if (hours === 1) return '1 hour ago';
      if (hours < 24) return hours + ' hours ago';
      if (days === 1) return 'yesterday';
      if (days < 30) return days + ' days ago';

      var months = Math.floor(days / 30);
      if (months === 1) return '1 month ago';
      if (months < 12) return months + ' months ago';

      var years = Math.floor(days / 365);
      if (years <= 1) return '1 year ago';
      return years + ' years ago';
    }

    function pgBrainTypeWord(type) {
      if (type === 'task') return 'task';
      if (type === 'done') return 'done';
      return 'note';
    }

    function pgBrainEmpty(text) {
      pgBrainList.appendChild(hwEl('div', 'pg-empty', text));
    }

    function pgBrainRender() {
      pgBrainList.innerHTML = '';

      var items = pgBrainItems;
      if (!items || !items.length) {
        pgBrainEmpty('Nothing captured yet.');
        return;
      }

      for (var i = 0; i < items.length; i++) {
        var it = items[i] || {};
        var type = it.type;
        var text = hwClean(it.text || '') || 'Untitled';
        var done = type !== 'task';

        var row = hwEl('div', 'pg-row' + (done ? ' done' : ''));

        var main = hwEl('div', 'pg-main');
        main.appendChild(hwEl('div', 'pg-title', text));

        var age = pgBrainAge(it.ts);
        var word = pgBrainTypeWord(type);
        main.appendChild(hwEl('div', 'pg-sub', age ? age + ' - ' + word : word));
        row.appendChild(main);

        var toggle = hwEl('button', 'pg-btn', type === 'task' ? 'Done' : 'Undo');
        pgBrainToggle(toggle, it, type);
        row.appendChild(toggle);

        var del = hwEl('button', 'pg-btn warn', 'x');
        pgBrainDelete(del, it);
        row.appendChild(del);

        pgBrainList.appendChild(row);
      }
    }

    function pgBrainToggle(btn, it, type) {
      btn.onclick = function () {
        btn.disabled = true;
        pgBrainPost('/brain/update', {
          id: it.id,
          type: type === 'task' ? 'done' : 'task'
        }).catch(function () {
          console.log('brain page: toggle failed');
        }).then(function () {
          return pgBrainLoad();
        });
      };
    }

    function pgBrainDelete(btn, it) {
      btn.onclick = function () {
        btn.disabled = true;
        pgBrainPost('/brain/delete', { id: it.id }).catch(function () {
          console.log('brain page: delete failed');
        }).then(function () {
          return pgBrainLoad();
        });
      };
    }

    function pgBrainAdd(type) {
      var text = (pgBrainInput.value || '').trim();
      if (!text) return;

      pgBrainInput.value = '';
      pgBrainAddTask.disabled = true;
      pgBrainAddNote.disabled = true;

      pgBrainPost('/brain/add', { text: text, type: type }).catch(function () {
        console.log('brain page: add failed');
      }).then(function () {
        pgBrainAddTask.disabled = false;
        pgBrainAddNote.disabled = false;
        return pgBrainLoad();
      });
    }

    function pgBrainSort(items) {
      items.sort(function (a, b) {
        var ta = pgBrainMs((a || {}).ts);
        var tb = pgBrainMs((b || {}).ts);
        if (ta === tb) return 0;
        return tb - ta;
      });
      return items;
    }

    function pgBrainLoad() {
      return hwJ(pgBrainAPI + '/brain').then(function (data) {
        if (!data || !data.length) {
          pgBrainItems = [];
          pgBrainCount.textContent = '0 to do';
          pgBrainRender();
          return;
        }
        pgBrainItems = pgBrainSort(data.slice());
        pgBrainRender();

        var todo = 0;
        for (var i = 0; i < pgBrainItems.length; i++) {
          if ((pgBrainItems[i] || {}).type === 'task') todo++;
        }
        pgBrainCount.textContent = todo + ' to do';
      }).catch(function () {
        console.log('brain page: load failed');
        pgBrainCount.textContent = '0 to do';
        pgBrainList.innerHTML = '';
        pgBrainEmpty('Brain unavailable.');
      });
    }

    pgBrainAddTask.onclick = function () { pgBrainAdd('task'); };
    pgBrainAddNote.onclick = function () { pgBrainAdd('note'); };

    pgBrainInput.onkeydown = function (e) {
      if (e.key === 'Enter' || e.keyCode === 13) {
        pgBrainAdd('task');
      }
    };

    pgBrainLoad();
    pgBrainTimer = setInterval(pgBrainLoad, 60000);

    return function () {
      if (pgBrainTimer) clearInterval(pgBrainTimer);
      pgBrainTimer = null;
    };
  };

  // ---- School ----
  HW_PAGE['school'] = function (host) {
    host.innerHTML = '';

    var wrap = hwEl('div', 'pg-wrap');
    host.appendChild(wrap);

    var pgSchoolData = { sacs: [], exams: [] };
    var pgSchoolErr = null;
    var pgSchoolWD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    var pgSchoolMO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                      'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    // Parse 'YYYY-MM-DD' (or an ISO string) as a LOCAL date so AEST never shifts it.
    function pgSchoolDate(s) {
      if (!s) return null;
      var m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
      var d = new Date(s);
      if (isNaN(d.getTime())) return null;
      return new Date(d.getFullYear(), d.getMonth(), d.getDate());
    }

    function pgSchoolKey(d) {
      return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    }

    function pgSchoolFmt(d) {
      if (!d) return '';
      return pgSchoolWD[d.getDay()] + ' ' + d.getDate() + ' ' + pgSchoolMO[d.getMonth()];
    }

    function pgSchoolRel(d) {
      if (!d) return '';
      var days = Math.round((pgSchoolKey(d) - pgSchoolKey(new Date())) / 86400000);
      if (days === 0) return 'today';
      if (days === 1) return 'tomorrow';
      if (days === -1) return 'yesterday';
      if (days > 0) return 'in ' + days + ' days';
      return Math.abs(days) + ' days ago';
    }

    function pgSchoolTrunc(s, n) {
      s = String(s == null ? '' : s);
      if (s.length <= n) return s;
      return s.slice(0, n - 1) + '\u2026';
    }

    function pgSchoolSort(list) {
      var out = [];
      for (var i = 0; i < list.length; i++) {
        var d = pgSchoolDate(list[i] && list[i].date);
        out.push({ name: list[i] && list[i].name, date: d, ts: d ? d.getTime() : Infinity });
      }
      out.sort(function (a, b) { return a.ts - b.ts; });
      return out;
    }

    function pgSchoolOnDay(list, d) {
      for (var i = 0; i < list.length; i++) {
        if (list[i].date && pgSchoolKey(list[i].date) === pgSchoolKey(d)) return list[i].name;
      }
      return null;
    }

    function pgSchoolCard(title, list, emptyText) {
      var card = hwEl('div', 'pg-card');
      var h = hwEl('h3', null, title);
      card.appendChild(h);
      if (!list.length) {
        card.appendChild(hwEl('div', 'pg-empty', emptyText));
        return card;
      }
      for (var i = 0; i < list.length; i++) {
        var it = list[i];
        var row = hwEl('div', 'pg-row');
        var main = hwEl('div', 'pg-main');
        main.appendChild(hwEl('div', 'pg-title', hwClean(it.name || 'Untitled')));
        main.appendChild(hwEl('div', 'pg-sub', pgSchoolRel(it.date)));
        row.appendChild(main);
        row.appendChild(hwEl('div', 'pg-side', pgSchoolFmt(it.date)));
        card.appendChild(row);
      }
      return card;
    }

    function pgSchoolWeekStrip(sacs, exams) {
      var card = hwEl('div', 'pg-card');
      card.appendChild(hwEl('h3', null, 'THIS WEEK'));
      var wk = hwEl('div', 'pg-wk');

      var now = new Date();
      var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      var dow = today.getDay();                 // 0 = Sunday
      var back = (dow + 6) % 7;                 // days back to Monday
      var monday = new Date(today.getFullYear(), today.getMonth(), today.getDate() - back);

      for (var i = 0; i < 7; i++) {
        var day = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
        var cell = hwEl('div', 'pg-wkd');
        if (pgSchoolKey(day) === pgSchoolKey(today)) cell.className = 'pg-wkd today';
        cell.appendChild(hwEl('div', 'n', pgSchoolWD[day.getDay()]));
        cell.appendChild(hwEl('div', 'd', String(day.getDate())));
        var name = pgSchoolOnDay(sacs, day) || pgSchoolOnDay(exams, day);
        cell.appendChild(hwEl('div', 'c', name ? pgSchoolTrunc(hwClean(name), 14) : ''));
        wk.appendChild(cell);
      }

      card.appendChild(wk);
      return card;
    }

    function pgSchoolRender() {
      wrap.innerHTML = '';

      if (pgSchoolErr) {
        wrap.appendChild(hwEl('div', 'pg-empty', pgSchoolErr));
        return;
      }

      var sacs = pgSchoolSort(pgSchoolData.sacs || []);
      var exams = pgSchoolSort(pgSchoolData.exams || []);

      var split = hwEl('div', 'pg-split');
      split.appendChild(pgSchoolCard('SACS', sacs, 'No SACs scheduled.'));
      split.appendChild(pgSchoolCard('EXAMS', exams, 'No exams scheduled.'));
      wrap.appendChild(split);

      wrap.appendChild(pgSchoolWeekStrip(sacs, exams));
    }

    function pgSchoolLoad() {
      hwJ('http://localhost:2008/api/school').then(function (data) {
        pgSchoolErr = null;
        pgSchoolData = {
          sacs: (data && data.sacs) || [],
          exams: (data && data.exams) || []
        };
        pgSchoolRender();
      }).catch(function () {
        pgSchoolErr = 'Could not load school data.';
        pgSchoolRender();
      });
    }

    pgSchoolRender();
    pgSchoolLoad();

    var pgSchoolTimer = setInterval(pgSchoolLoad, 300000);
    return function () { clearInterval(pgSchoolTimer); };
  };

    function pgRefereeEmpty(body, text) {
      body.innerHTML = '';
      body.appendChild(hwEl('div', 'pg-empty', text));
    }

    function pgRefereeRow(name, sub, side) {
      var row = hwEl('div', 'pg-row');
      var main = hwEl('div', 'pg-main');
      main.appendChild(hwEl('div', 'pg-title', name));
      if (sub) {
        main.appendChild(hwEl('div', 'pg-sub', sub));
      }
      row.appendChild(main);
      if (side) {
        row.appendChild(hwEl('div', 'pg-side', side));
      }
      return row;
    }

    function pgRefereeWhen(item) {
      var raw = item.start || item.date || item.time || item.end;
      if (!raw) {
        return '';
      }
      var d = new Date(raw);
      if (isNaN(d.getTime())) {
        return String(raw);
      }
      var day = d.toLocaleDateString('en-AU', {
        weekday: 'short', day: 'numeric', month: 'short'
      });
      var tm = d.toLocaleTimeString('en-AU', {
        hour: 'numeric', minute: '2-digit'
      });
      return day + ' ' + tm;
    }

    function pgRefereeName(item) {
      var n = item.name || item.title || item.summary || '';
      return hwClean(String(n));
    }

    function pgRefereeDateField(item) {
      var keys = ['date', 'start', 'when', 'day', 'time', 'created', 'updated'];
      for (var i = 0; i < keys.length; i++) {
        if (item[keys[i]]) {
          var d = new Date(item[keys[i]]);
          if (!isNaN(d.getTime())) {
            return d.toLocaleDateString('en-AU', {
              weekday: 'short', day: 'numeric', month: 'short'
            });
          }
          return String(item[keys[i]]);
        }
      }
      return '';
    }

    function pgRefereeRenderGames(list) {
      var games = [];
      var i;
      for (i = 0; i < (list || []).length; i++) {
        var ev = list[i];
        var summary = String((ev && (ev.summary || ev.title)) || '');
        if (/ref|game|basketball|vs/i.test(summary)) {
          games.push(ev);
        }
      }
      if (!games.length) {
        pgRefereeEmpty(pgRefereeGamesBody, 'No games in the next two weeks.');
        return;
      }
      pgRefereeGamesBody.innerHTML = '';
      for (i = 0; i < games.length && i < 6; i++) {
        var it = games[i];
        var sum = String((it && (it.summary || it.title)) || '');
        pgRefereeGamesBody.appendChild(pgRefereeRow(
          hwClean(sum),
          it && it.location ? hwClean(String(it.location)) : '',
          pgRefereeWhen(it)
        ));
      }
    }

    function pgRefereeRenderSessions(sessions) {
      if (!sessions || !sessions.length) {
        pgRefereeEmpty(pgRefereeSessionsBody, 'No sessions recorded.');
        return;
      }
      pgRefereeSessionsBody.innerHTML = '';
      for (var i = 0; i < sessions.length; i++) {
        var s = sessions[i] || {};
        var side = pgRefereeDateField(s);
        var sub = '';
        if (s.team) {
          sub = hwClean(String(s.team));
        } else if (s.location) {
          sub = hwClean(String(s.location));
        }
        pgRefereeSessionsBody.appendChild(pgRefereeRow(
          pgRefereeName(s) || 'Session',
          sub,
          side
        ));
      }
    }

    function pgRefereeRenderTeams(teams) {
      if (!teams || !teams.length) {
        pgRefereeEmpty(pgRefereeTeamsBody, 'No teams yet.');
        return;
      }
      pgRefereeTeamsBody.innerHTML = '';
      for (var i = 0; i < teams.length; i++) {
        var t = teams[i] || {};
        var side = pgRefereeDateField(t);
        var sub = '';
        if (t.league) {
          sub = hwClean(String(t.league));
        } else if (t.age_group || t.grade) {
          sub = hwClean(String(t.age_group || t.grade));
        }
        pgRefereeTeamsBody.appendChild(pgRefereeRow(
          pgRefereeName(t) || 'Team',
          sub,
          side
        ));
      }
    }

    function pgRefereeRefresh() {
      hwJ('http://localhost:2008/api/calendar/events?days=14').then(function (data) {
        pgRefereeRenderGames(data || []);
      }).catch(function () {
        pgRefereeEmpty(pgRefereeGamesBody, 'No games in the next two weeks.');
      });

      hwJ('http://localhost:2008/api/coaching').then(function (data) {
        var d = data || {};
        pgRefereeRenderSessions(d.sessions || []);
        pgRefereeRenderTeams(d.teams || []);
      }).catch(function () {
        pgRefereeEmpty(pgRefereeSessionsBody, 'No sessions recorded.');
        pgRefereeEmpty(pgRefereeTeamsBody, 'No teams yet.');
      });
    }

    pgRefereeRefresh();

    var pgRefereeTimer = setInterval(pgRefereeRefresh, 60000);

    return function () {
      clearInterval(pgRefereeTimer);
    };
  };

  HW_PAGE['timer'] = function (host) {
    host.innerHTML = '';

    var wrap = hwEl('div', 'pg-wrap');
    host.appendChild(wrap);

    var pgTimerKey = 'padawan_timer_state_v1';
    var pgTimerPresets = [5, 10, 15, 25, 45];
    var pgTimerTickMs = 250;

    // ---- state -------------------------------------------------------------
    // {mode:'countdown'|'stopwatch', running:bool, endsAt:epoch|null,
    //  startedAt:epoch|null, remainingMs:number, elapsedMs:number, preset:minutes}
    var pgTimerState = {
      mode: 'countdown',
      running: false,
      endsAt: null,
      startedAt: null,
      remainingMs: 25 * 60000,
      elapsedMs: 0,
      preset: 25
    };

    function pgTimerNum(v) {
      var n = Number(v);
      if (!isFinite(n) || n < 0) return 0;
      return n;
    }

    function pgTimerSave() {
      hwLS.set(pgTimerKey, pgTimerState);
    }

    function pgTimerNow() {
      return new Date().getTime();
    }

    // ---- restore -----------------------------------------------------------
    function pgTimerRestore() {
      var saved = hwLS.get(pgTimerKey, null);
      if (!saved || typeof saved !== 'object') return;

      var st = {
        mode: saved.mode === 'stopwatch' ? 'stopwatch' : 'countdown',
        running: !!saved.running,
        endsAt: (typeof saved.endsAt === 'number' && isFinite(saved.endsAt)) ? saved.endsAt : null,
        startedAt: (typeof saved.startedAt === 'number' && isFinite(saved.startedAt)) ? saved.startedAt : null,
        remainingMs: pgTimerNum(saved.remainingMs),
        elapsedMs: pgTimerNum(saved.elapsedMs),
        preset: pgTimerNum(saved.preset) > 0 ? pgTimerNum(saved.preset) : 25
      };

      var now = pgTimerNow();

      if (st.mode === 'countdown') {
        if (st.running && st.endsAt !== null) {
          var left = st.endsAt - now;
          if (left <= 0) {
            // it finished while we were away
            st.remainingMs = 0;
            st.endsAt = null;
            st.running = false;
          } else {
            st.remainingMs = left;
          }
        } else {
          st.running = false;
          st.endsAt = null;
          // brand new / wiped store: fall back to the saved preset length
          if (!pgTimerNum(saved.remainingMs) && !pgTimerNum(saved.elapsedMs)) {
            st.remainingMs = st.preset * 60000;
          }
        }
      } else {
        if (st.running && st.startedAt !== null) {
          // the elapsed base already lives in elapsedMs; the live part is
          // recomputed from startedAt on every tick, so nothing to fix here
          if (now - st.startedAt < 0) st.startedAt = now;
        } else {
          st.running = false;
          st.startedAt = null;
        }
      }

      pgTimerState = st;
      pgTimerSave();

    // ---- formatting --------------------------------------------------------
    // Countdown rounds UP so a fresh 5:00 reads 05:00 (not 04:59) and a dead
    // countdown reads 00:00. The stopwatch rounds DOWN (elapsed whole seconds).
    function pgTimerFmt(ms, roundUp) {
      var secs = pgTimerNum(ms) / 1000;
      var total = roundUp ? Math.ceil(secs) : Math.floor(secs);
      var h = Math.floor(total / 3600);
      var m = Math.floor((total - h * 3600) / 60);
      var s = total - h * 3600 - m * 60;
      var mm = String(m);
      var ss = String(s);
      if (mm.length < 2) mm = '0' + mm;
      if (ss.length < 2) ss = '0' + ss;
      if (h > 0) return String(h) + ':' + mm + ':' + ss;
      return mm + ':' + ss;

    // ---- live values -------------------------------------------------------
    function pgTimerRemaining() {
      if (pgTimerState.mode !== 'countdown') return pgTimerState.remainingMs;
      if (pgTimerState.running && pgTimerState.endsAt !== null) {
        var left = pgTimerState.endsAt - pgTimerNow();
        return left > 0 ? left : 0;
      }
      return pgTimerState.remainingMs;
    }

    function pgTimerElapsed() {
      if (pgTimerState.mode !== 'stopwatch') return pgTimerState.elapsedMs;
      if (pgTimerState.running && pgTimerState.startedAt !== null) {
        var delta = pgTimerNow() - pgTimerState.startedAt;
        if (delta < 0) delta = 0;
        return pgTimerState.elapsedMs + delta;
      }
      return pgTimerState.elapsedMs;

    function pgTimerReadoutMs() {
      return pgTimerState.mode === 'stopwatch' ? pgTimerElapsed() : pgTimerRemaining();

    // ---- chrome ------------------------------------------------------------
    var pgTimerModeRow = hwEl('div', 'pg-chips');
    wrap.appendChild(pgTimerModeRow);

    var pgTimerModeChips = {};
    var pgTimerModes = [
      { id: 'countdown', label: 'Countdown' },
      { id: 'stopwatch', label: 'Stopwatch' }

      (function (m) {

        chip.onclick = function () { pgTimerSetMode(m.id); };
        pgTimerModeChips[m.id] = chip;
        pgTimerModeRow.appendChild(chip);
      })(pgTimerModes[i]);

    var pgTimerReadout = hwEl('div', 'pg-big', '25:00');
    pgTimerReadout.style.fontSize = '4rem';
    pgTimerReadout.style.textAlign = 'center';
    pgTimerReadout.style.lineHeight = '1.05';
    wrap.appendChild(pgTimerReadout);

    var pgTimerPresetRow = hwEl('div', 'pg-chips');
    wrap.appendChild(pgTimerPresetRow);

    var pgTimerPresetChips = {};
    for (i = 0; i < pgTimerPresets.length; i++) {
      (function (mins) {
        var chip = hwEl('button', 'pg-chip', mins + ' min');
        chip.onclick = function () { pgTimerSetPreset(mins); };
        pgTimerPresetChips[mins] = chip;
        pgTimerPresetRow.appendChild(chip);
      })(pgTimerPresets[i]);
    }

    var pgTimerControls = hwEl('div', 'pg-chips');
    wrap.appendChild(pgTimerControls);

    var pgTimerStartBtn = hwEl('button', 'pg-btn', 'Start');
    var pgTimerStopBtn = hwEl('button', 'pg-btn', 'Stop');
    var pgTimerResetBtn = hwEl('button', 'pg-btn', 'Reset');
    pgTimerControls.appendChild(pgTimerStartBtn);
    pgTimerControls.appendChild(pgTimerStopBtn);
    pgTimerControls.appendChild(pgTimerResetBtn);

    var pgTimerHint = hwEl('div', 'pg-muted',
      'Countdown counts down and stops at zero. Stopwatch counts up.');
    wrap.appendChild(pgTimerHint);

    // ---- actions -----------------------------------------------------------
    function pgTimerSetMode(mode) {
      if (pgTimerState.mode === mode) return;
      pgTimerPause();
      pgTimerState.mode = mode;
      pgTimerSave();
      pgTimerRender(true);
    }

    function pgTimerSetPreset(mins) {
      pgTimerState.preset = mins;
      pgTimerState.mode = 'countdown';
      pgTimerState.running = false;
      pgTimerState.endsAt = null;
      pgTimerState.remainingMs = mins * 60000;

    // Snapshot the live value back into the stored numbers without changing

    function pgTimerPause() {
      if (!pgTimerState.running) return;
      var now = pgTimerNow();
      if (pgTimerState.mode === 'countdown') {
        var left = pgTimerState.endsAt === null ? pgTimerState.remainingMs
                                                : pgTimerState.endsAt - now;
        pgTimerState.remainingMs = left > 0 ? left : 0;
      } else {
        var delta = pgTimerState.startedAt === null ? 0 : now - pgTimerState.startedAt;
        if (delta < 0) delta = 0;
        pgTimerState.elapsedMs = pgTimerState.elapsedMs + delta;
      }
      pgTimerState.running = false;
      pgTimerState.endsAt = null;
      pgTimerState.startedAt = null;
      pgTimerSave();
    }

    function pgTimerStart() {
      if (pgTimerState.running) return;
      var now = pgTimerNow();
      if (pgTimerState.mode === 'countdown') {
        if (pgTimerState.remainingMs <= 0) return;   // nothing left to run
        pgTimerState.endsAt = now + pgTimerState.remainingMs;
        pgTimerState.startedAt = null;
      } else {
        pgTimerState.startedAt = now;
        pgTimerState.endsAt = null;
      }
      pgTimerState.running = true;
      pgTimerSave();
      pgTimerRender(true);
    }

    function pgTimerStop() {
      if (!pgTimerState.running) return;
      pgTimerPause();
      pgTimerRender(true);
    }

    function pgTimerReset() {
      pgTimerState.running = false;
      pgTimerState.endsAt = null;
      pgTimerState.startedAt = null;
      if (pgTimerState.mode === 'countdown') {
        pgTimerState.remainingMs = pgTimerState.preset * 60000;
      } else {
        pgTimerState.elapsedMs = 0;
      }
      pgTimerSave();
      pgTimerRender(true);
    }

    pgTimerStartBtn.onclick = pgTimerStart;
    pgTimerStopBtn.onclick = pgTimerStop;
    pgTimerResetBtn.onclick = pgTimerReset;

    // ---- render ------------------------------------------------------------
    function pgTimerRender(force) {
      var isCd = pgTimerState.mode === 'countdown';

      for (var k in pgTimerModeChips) {
        if (!pgTimerModeChips.hasOwnProperty(k)) continue;
        pgTimerModeChips[k].className = (k === pgTimerState.mode) ? 'pg-chip on' : 'pg-chip';
      }

      pgTimerPresetRow.style.display = isCd ? '' : 'none';

      var liveMs = pgTimerReadoutMs();
      var txt = pgTimerFmt(liveMs, isCd);
      if (force || pgTimerReadout.textContent !== txt) pgTimerReadout.textContent = txt;

      for (var p in pgTimerPresetChips) {
        if (!pgTimerPresetChips.hasOwnProperty(p)) continue;
        var mins = Number(p);
        var active = isCd && !pgTimerState.running &&
                     pgTimerState.remainingMs === mins * 60000;
        pgTimerPresetChips[p].className = active ? 'pg-chip on' : 'pg-chip';
      }

      pgTimerStartBtn.disabled = pgTimerState.running ||
        (isCd && pgTimerState.remainingMs <= 0);
      pgTimerStopBtn.disabled = !pgTimerState.running;

      var hint = isCd
        ? 'Countdown stops at zero. Pick a preset, then Start.'
        : 'Stopwatch counts up. Start, Stop, Reset.';
      if (pgTimerHint.textContent !== hint) pgTimerHint.textContent = hint;
    }

    // ---- clock -------------------------------------------------------------

      if (pgTimerState.running && pgTimerState.mode === 'countdown') {
        var left = pgTimerState.endsAt === null ? 0 : pgTimerState.endsAt - pgTimerNow();
        if (left <= 0) {
          // finished: park at zero, stop, and remember it
          pgTimerState.running = false;
          pgTimerState.endsAt = null;
          pgTimerState.remainingMs = 0;
          pgTimerSave();
          changed = true;
        }
      }

      pgTimerRender(changed);
    }

    pgTimerRestore();
    pgTimerRender(true);

    var pgTimerInterval = setInterval(pgTimerTick, pgTimerTickMs);

    return function () {
      clearInterval(pgTimerInterval);
      pgTimerPause();      // keep the saved numbers honest for the next open
    };
  };

  // ---- countdown ----
  // ---- Countdown ----
  HW_PAGE['countdown'] = function (host) {
    host.innerHTML = '';

    var wrap = hwEl('div', 'pg-wrap');
    host.appendChild(wrap);

    var pgCdItems = [];
    var pgCdErr = null;

    var pgCdWD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    var pgCdMO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                  'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    // Anything whose summary reads like something worth counting down to.
    var pgCdNotable = /sac|exam|test|assignment|due|birthday|appointment|driving|lesson/i;

    // Parse 'YYYY-MM-DD' / an ISO timestamp as a LOCAL date so AEST never shifts it.
    function pgCdDate(s) {
      if (!s) return null;
      var m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
      var d = new Date(s);
      if (isNaN(d.getTime())) return null;
      return new Date(d.getFullYear(), d.getMonth(), d.getDate());
    }

    function pgCdDay(d) {
      return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    }

    function pgCdToday() {
      var n = new Date();
      return new Date(n.getFullYear(), n.getMonth(), n.getDate());
    }

    function pgCdYmd(d) {
      var mm = String(d.getMonth() + 1);
      var dd = String(d.getDate());
      if (mm.length < 2) mm = '0' + mm;
      if (dd.length < 2) dd = '0' + dd;
      return d.getFullYear() + '-' + mm + '-' + dd;
    }

    function pgCdDaysAway(d) {
      return Math.round((pgCdDay(d) - pgCdDay(pgCdToday())) / 86400000);
    }

    // 'TODAY' / 'TOMORROW' / 'N days'
    function pgCdLabel(days) {
      if (days === 0) return 'TODAY';
      if (days === 1) return 'TOMORROW';
      return days + ' days';
    }

    function pgCdTrunc(s, n) {
      s = String(s == null ? '' : s);
      if (s.length <= n) return s;
      return s.slice(0, n - 1) + '\u2026';
    }

    function pgCdAdd(list, name, date, kind) {
      if (!date) return;
      var clean = hwClean(name);
      if (!clean) return;
      list.push({
        name: clean,
        date: date,
        kind: kind,
        days: pgCdDaysAway(date),
        key: clean.toLowerCase() + '|' + pgCdYmd(date)
      });
    }

    function pgCdBuild(school, events) {
      var list = [];

      var sacs = (school && school.sacs) || [];
      var exams = (school && school.exams) || [];
      var i;

      for (i = 0; i < sacs.length; i++) {
        pgCdAdd(list, sacs[i] && sacs[i].name, pgCdDate(sacs[i] && sacs[i].date), 'SAC');
      }
      for (i = 0; i < exams.length; i++) {
        pgCdAdd(list, exams[i] && exams[i].name, pgCdDate(exams[i] && exams[i].date), 'Exam');
      }

      var evs = events || [];
      for (i = 0; i < evs.length; i++) {
        var ev = evs[i] || {};
        var summary = hwClean(ev.summary);
        if (!summary) continue;
        if (!pgCdNotable.test(summary)) continue;
        pgCdAdd(list, summary, pgCdDate(ev.start), 'Event');
      }

      // dedupe by name + date
      var seen = {};
      var out = [];
      for (i = 0; i < list.length; i++) {
        if (seen[list[i].key]) continue;
        seen[list[i].key] = true;
        out.push(list[i]);
      }

      // drop anything already past, nearest first
      var upcoming = [];
      for (i = 0; i < out.length; i++) {
        if (out[i].days >= 0) upcoming.push(out[i]);
      }
      upcoming.sort(function (a, b) {
        if (a.days !== b.days) return a.days - b.days;
        return a.name < b.name ? -1 : (a.name > b.name ? 1 : 0);
      });
      return upcoming;
    }

    function pgCdNameOnDay(list, day) {
      for (var i = 0; i < list.length; i++) {
        if (pgCdDay(list[i].date) === pgCdDay(day)) return list[i].name;
      }
      return '';
    }

    function pgCdWeekCard(list) {
      var card = hwEl('div', 'pg-card');
      card.appendChild(hwEl('h3', null, 'THIS WEEK'));

      var wk = hwEl('div', 'pg-wk');
      var today = pgCdToday();
      var back = (today.getDay() + 6) % 7;      // days back to Monday
      var monday = new Date(today.getFullYear(), today.getMonth(), today.getDate() - back);

      for (var i = 0; i < 7; i++) {
        var day = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
        var isToday = pgCdDay(day) === pgCdDay(today);
        var cell = hwEl('div', isToday ? 'pg-wkd today' : 'pg-wkd');
        cell.appendChild(hwEl('div', 'n', pgCdWD[day.getDay()]));
        cell.appendChild(hwEl('div', 'd', String(day.getDate())));
        var nm = pgCdNameOnDay(list, day);
        cell.appendChild(hwEl('div', 'c', nm ? pgCdTrunc(nm, 14) : ''));
        wk.appendChild(cell);
      }

      card.appendChild(wk);
      return card;
    }

    function pgCdNote() {
      return hwEl('div', 'pg-muted',
        'Fills in from SACs, exams and calendar events.');
    }

    function pgCdRender() {
      wrap.innerHTML = '';

      var items = pgCdItems;

      if (pgCdErr) {
        wrap.appendChild(hwEl('div', 'pg-empty', pgCdErr));
        wrap.appendChild(pgCdNote());
        wrap.appendChild(pgCdWeekCard([]));
        return;
      }

      if (!items.length) {
        wrap.appendChild(hwEl('div', 'pg-empty', 'Nothing coming up.'));
        wrap.appendChild(pgCdNote());
        wrap.appendChild(pgCdWeekCard(items));
        return;
      }

      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        var row = hwEl('div', it.days <= 3 ? 'pg-row now' : 'pg-row');

        var main = hwEl('div', 'pg-main');
        main.appendChild(hwEl('div', 'pg-title', it.name));
        main.appendChild(hwEl('div', 'pg-sub', it.kind));
        row.appendChild(main);

        var side = hwEl('div', 'pg-side', pgCdLabel(it.days));
        if (i === 0) side.style.fontSize = '2rem';   // the nearest one stands out
        row.appendChild(side);

        wrap.appendChild(row);
      }

      wrap.appendChild(pgCdWeekCard(items));
    }

    function pgCdLoad() {
      var schoolDone = false;
      var calDone = false;
      var schoolData = null;
      var calData = null;

      function settle() {
        if (!schoolDone || !calDone) return;
        if (schoolData === null && calData === null) {
          pgCdErr = 'Could not load what is coming up.';
          pgCdItems = [];
        } else {
          pgCdErr = null;
          pgCdItems = pgCdBuild(schoolData, calData);
        }
        pgCdRender();
      }

      hwJ('http://localhost:2008/api/school').then(function (d) {
        schoolData = (d && typeof d === 'object') ? d : {};
        schoolDone = true;
        settle();
      }).catch(function () {
        schoolData = null;
        schoolDone = true;
        settle();
      });

      hwJ('http://localhost:2008/api/calendar/events?days=60').then(function (d) {
        calData = (d && d.length !== undefined) ? d : [];
        calDone = true;
        settle();
      }).catch(function () {
        calData = null;
        calDone = true;
        settle();
      });
    }

    pgCdRender();
    pgCdLoad();

    var pgCdTimer = setInterval(pgCdLoad, 300000);
    return function () { clearInterval(pgCdTimer); };
  };

  // ---- whiteboard ----

  HW_PAGE['whiteboard'] = function (host) {

    // ---------- resize: keep the drawing, rescale the backing store ----------
    function pgWbResize() {
      if (pgWbResizeTimer) clearTimeout(pgWbResizeTimer);
      pgWbResizeTimer = setTimeout(function () {
        pgWbResizeTimer = null;
        var snap = null;
        if (pgWbReady) {
          try { snap = pgWbCanvas.toDataURL('image/png'); } catch (err) { snap = null; }
        }
        if (!snap) snap = pgWbRead();
        pgWbSetupCanvas();
        pgWbDrawSrc(snap);
      }, 250);
    }

    // ---------- tools row ----------
    var pgWbTools = hwEl('div', 'pg-wb-tools');
    pgWbWrap.appendChild(pgWbTools);

    function pgWbSwatches() {
      for (var i = 0; i < pgWbColors.length; i++) {
        pgWbColorBtns.push(pgWbMakeColorBtn(pgWbColors[i]));
      }
      pgWbSyncSwatches();
    }

    function pgWbMakeColorBtn(colour) {
      var b = hwEl('button', 'pg-sw', '');
      b.type = 'button';
      b.title = 'Pen colour ' + colour;
      b.style.background = colour;
      b.onclick = function () {
        pgWbColor = colour;
        pgWbSyncSwatches();
        pgWbApplyPen();
      };
      pgWbTools.appendChild(b);
      return b;
    }

    function pgWbSyncSwatches() {
      for (var i = 0; i < pgWbColorBtns.length; i++) {
        var on = pgWbColors[i] === pgWbColor;
        pgWbColorBtns[i].className = on ? 'pg-sw on' : 'pg-sw';
      }
    }

    function pgWbMakeSizeBtn(size) {
      var b = hwEl('button', 'pg-sw', '');
      b.type = 'button';
      b.title = 'Pen size ' + size + ' pixels';
      b.style.width = size + 'px';
      b.style.height = size + 'px';
      b.onclick = function () {
        pgWbSize = size;
        pgWbSyncSizes();
        pgWbApplyPen();
      };
      pgWbTools.appendChild(b);
      return b;
    }

    function pgWbSyncSizes() {
      for (var i = 0; i < pgWbSizeBtns.length; i++) {
        var on = pgWbSizes[i] === pgWbSize;
        pgWbSizeBtns[i].className = on ? 'pg-sw on' : 'pg-sw';
      }
    }

    pgWbSwatches();
    for (var si = 0; si < pgWbSizes.length; si++) pgWbSizeBtns.push(pgWbMakeSizeBtn(pgWbSizes[si]));
    pgWbSyncSizes();

    // ---------- save PNG ----------
    var pgWbSaveBtn = hwEl('button', 'pg-btn', 'Save PNG');
    pgWbSaveBtn.type = 'button';
    pgWbSaveBtn.onclick = function () {
      if (!pgWbReady) return;
      var data = pgWbCanvas.toDataURL('image/png');
      var a = document.createElement('a');
      a.href = data;
      a.download = 'whiteboard.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    };
    pgWbTools.appendChild(pgWbSaveBtn);

    // ---------- clear (two-click confirm, no alert/confirm) ----------
    var pgWbClearBtn = hwEl('button', 'pg-btn warn', 'Clear');
    pgWbClearBtn.type = 'button';

    function pgWbDisarmClear() {
      if (pgWbArmTimer) {
        clearTimeout(pgWbArmTimer);
        pgWbArmTimer = null;
      }
      pgWbClearBtn.innerHTML = '';
      pgWbClearBtn.appendChild(document.createTextNode('Clear'));
    }

    pgWbClearBtn.onclick = function () {
      var label = pgWbClearBtn.textContent || '';
      if (label.indexOf('Sure') === -1) {
        pgWbClearBtn.innerHTML = '';
        pgWbClearBtn.appendChild(document.createTextNode('Sure?'));
        if (pgWbArmTimer) clearTimeout(pgWbArmTimer);
        pgWbArmTimer = setTimeout(function () {
          pgWbArmTimer = null;
          pgWbDisarmClear();
        }, 4000);
        return;
      }
      pgWbDisarmClear();
      pgWbCancelSave();
      pgWbClearStored();
      if (pgWbReady) pgWbCtx.clearRect(0, 0, pgWbCssW, pgWbCssH);
    };
    pgWbTools.appendChild(pgWbClearBtn);

    // ---------- canvas ----------
    pgWbCanvas = hwEl('canvas', 'pg-wb-canvas', '');
    pgWbCanvas.style.display = 'block';
    pgWbCanvas.style.width = '100%';
    pgWbCanvas.style.height = pgWbHeight + 'px';
    pgWbCanvas.style.touchAction = 'none';
    pgWbWrap.appendChild(pgWbCanvas);

    pgWbSetupCanvas();
    pgWbDrawSrc(pgWbRead());

    pgWbCanvas.addEventListener('pointerdown', pgWbDown, false);
    pgWbCanvas.addEventListener('pointermove', pgWbMove, false);
    pgWbCanvas.addEventListener('pointerup', pgWbUp, false);
    pgWbCanvas.addEventListener('pointercancel', pgWbCancel, false);
    window.addEventListener('resize', pgWbResize, false);

    // ---------- teardown ----------
    return function () {
      pgWbCancelSave();
      if (pgWbResizeTimer) {
        clearTimeout(pgWbResizeTimer);
        pgWbResizeTimer = null;
      }
      if (pgWbArmTimer) {
        clearTimeout(pgWbArmTimer);
        pgWbArmTimer = null;
      }
      pgWbDrawing = false;
      pgWbReady = false;
      if (pgWbCanvas) {
        pgWbCanvas.removeEventListener('pointerdown', pgWbDown, false);
        pgWbCanvas.removeEventListener('pointermove', pgWbMove, false);
        pgWbCanvas.removeEventListener('pointerup', pgWbUp, false);
        pgWbCanvas.removeEventListener('pointercancel', pgWbCancel, false);
      }
      window.removeEventListener('resize', pgWbResize, false);
    };
  };

  // ====== END APP PAGES ======

  function hwRenderApps() {
    const host = el('hw-apps');
    if (!host) return;
    host.innerHTML = '';
    HW_APPS.forEach(function (g) {
      const wrap = document.createElement('div');
      wrap.className = 'hw-group';
      const label = document.createElement('div');
      label.className = 'hw-glabel';
      label.textContent = g.group;
      wrap.appendChild(label);

      const grid = document.createElement('div');
      grid.className = 'hw-grid';
      g.apps.forEach(function (a) {
        const btn = document.createElement('button');
        btn.className = 'hw-app';
        btn.type = 'button';
        const nm = document.createElement('div');
        nm.className = 'hw-app-name';
        nm.textContent = a.name;
        const nt = document.createElement('div');
        nt.className = 'hw-app-note';
        nt.textContent = a.note;
        btn.appendChild(nm);
        btn.appendChild(nt);
        btn.addEventListener('click', function () { hwOpenApp(a); });
        grid.appendChild(btn);
      });
      wrap.appendChild(grid);
      host.appendChild(wrap);
    });
  }

  // Open an app: build its page if one is registered, otherwise say so plainly rather
  // than showing a blank box.
  function hwOpenApp(a) {
    const page = el('hw-page'), apps = el('hw-apps'), body = el('hw-page-body');
    if (!page || !apps || !body) return;
    // leaving the previous page: run its teardown so timers stop
    if (hwCurrentApp && HW_TEARDOWN[hwCurrentApp]) {
      try { HW_TEARDOWN[hwCurrentApp](); } catch (e) {}
      delete HW_TEARDOWN[hwCurrentApp];
    }
    hwCurrentApp = a.id;
    if (el('hw-page-title')) el('hw-page-title').textContent = a.name;
    body.innerHTML = '';
    body.classList.toggle('plain', !HW_PAGE[a.id]);
    // Make the page visible BEFORE running its render function: a hidden element reports
    // clientWidth/clientHeight of 0, and any page that sizes itself to its container
    // (the whiteboard canvas is the one) would measure 0 and fall back to a bad default.
    apps.style.display = 'none';
    page.classList.add('on');
    const render = HW_PAGE[a.id];
    if (render) {
      try {
        const teardown = render(body);
        if (typeof teardown === 'function') HW_TEARDOWN[a.id] = teardown;
      } catch (e) {
        console.error('page ' + a.id, e);
        body.textContent = 'This page failed to load: ' + e.message;
      }
    } else {
      body.textContent = a.note;
    }
  }

  function hwShowApps() {
    const page = el('hw-page'), apps = el('hw-apps');
    if (hwCurrentApp && HW_TEARDOWN[hwCurrentApp]) {
      try { HW_TEARDOWN[hwCurrentApp](); } catch (e) {}
      delete HW_TEARDOWN[hwCurrentApp];
    }
    hwCurrentApp = null;
    if (page) page.classList.remove('on');
    if (apps) apps.style.display = '';
  }

  if (el('hw-back')) el('hw-back').addEventListener('click', hwShowApps);
  hwRenderApps();

  // ---- swipe up / down on the home screen ----
  // Only fires when the gesture is clearly vertical and long enough, so it cannot be
  // confused with a tap on the orb or a drag inside a slider.
  //
  // Inside the expanded window the gesture is treated as pull-to-dismiss: an upward
  // swipe scrolls the app list normally, and only a DOWNWARD one with the list already
  // at the top collapses the window. Without that, scrolling the apps would close it.
  const hwScrollerTop = () => {
    const s = el('hw-apps');
    if (!s) return true;
    return s.scrollTop <= 0;
  };
  (function wireHomeSwipe() {
    let sy = 0, sx = 0, tracking = false;
    const THRESH = 70;          // px of travel before it counts as a swipe
    const SLOP = 60;            // horizontal slop allowed before it is treated as a drag
    window.addEventListener('touchstart', function (e) {
      if (!document.body.classList.contains('home')) return;
      if (!e.touches || e.touches.length !== 1) return;
      const t = e.target;
      // never hijack a control
      if (t && t.closest && t.closest('input, textarea, button, #sp-player, #sc-window, #vc-panel')) return;
      sy = e.touches[0].clientY; sx = e.touches[0].clientX; tracking = true;
    }, { passive: true });
    window.addEventListener('touchend', function (e) {
      if (!tracking) return;
      tracking = false;
      if (!document.body.classList.contains('home')) return;
      const ct = (e.changedTouches && e.changedTouches[0]);
      if (!ct) return;
      const dy = ct.clientY - sy, dx = ct.clientX - sx;
      if (Math.abs(dx) > SLOP || Math.abs(dy) < THRESH) return;
      const inWindow = e.target && e.target.closest && e.target.closest('#hw-window');
      if (inWindow) {
        // downward pull from the top dismisses; anything else is a scroll
        if (dy > 0 && hwScrollerTop()) hwSet(false);
        return;
      }
      if (dy < 0) hwSet(true);          // swipe up -> expand
      else hwSet(false);                // swipe down -> collapse
    }, { passive: true });

    // The wheel/trackpad scroll is deliberately NOT wired to expand/collapse: it is easy
    // to trigger by accident and it fights the window's own scrolling. Expand and
    // collapse are swipe, drag and the arrow keys only.

    // ---- mouse / trackpad DRAG ----
    // Press on the home background and drag up or down, the same gesture a touch screen
    // uses. Only starts on a non-interactive target so it cannot steal a click from the
    // orb, the pill or any control.
    let dragY = null, dragX = null, dragMoved = false;
    const DRAG_THRESH = 70, DRAG_SLOP = 60;
    window.addEventListener('mousedown', function (e) {
      if (!document.body.classList.contains('home')) return;
      if (e.button !== 0) return;
      if (vcOpenLike()) return;
      const t = e.target;
      if (t && t.closest && t.closest('button, input, textarea, a, #sp-player, #sc-window, #vc-panel, #hw-window')) return;
      dragY = e.clientY; dragX = e.clientX; dragMoved = false;
    });
    window.addEventListener('mousemove', function (e) {
      if (dragY === null) return;
      if (Math.abs(e.clientY - dragY) > 4 || Math.abs(e.clientX - dragX) > 4) dragMoved = true;
    });
    window.addEventListener('mouseup', function (e) {
      if (dragY === null) return;
      const dy = e.clientY - dragY, dx = e.clientX - dragX;
      dragY = null; dragX = null;
      if (!document.body.classList.contains('home')) return;
      if (!dragMoved) return;                              // a click, not a drag
      if (Math.abs(dx) > DRAG_SLOP || Math.abs(dy) < DRAG_THRESH) return;
      if (dy < 0) hwSet(true);                            // dragged up -> expand
      else hwSet(false);                                  // dragged down -> collapse
    });

    // ---- keyboard ----
    // Up arrow (or PageUp) expands, Down arrow (or PageDown) collapses. Arrow keys are
    // only claimed when there is nothing to scroll and no window is taking input, so they
    // still work normally inside the schedule and Spotify windows.
    window.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown' &&
          e.key !== 'PageUp' && e.key !== 'PageDown') return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (!document.body.classList.contains('home')) return;
      if (vcOpenLike()) return;
      const t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      // inside a scrollable window, leave the arrows to the scroll
      if (t && t.closest && t.closest('#sp-player, #sc-window, #vc-panel')) return;
      e.preventDefault();
      const up = (e.key === 'ArrowUp' || e.key === 'PageUp');
      hwSet(up);
    });

    function vcOpenLike() {
      return (typeof voicePanelOpen !== 'undefined' && voicePanelOpen) ||
             (typeof spPlayerOpen !== 'undefined' && spPlayerOpen) ||
             (typeof scOpen !== 'undefined' && scOpen);
    }
  })();
  // ================= voice chat (wake word + Space) =================
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  const recog = SpeechRec ? new SpeechRec() : null;
  if (recog) { recog.continuous = true; recog.interimResults = true; recog.lang = 'en-AU'; }
  let voiceBusy = false;
  // NB: `var`, not `let` — layoutHome() (called by renderAppRing during this script's own
  // execution) reads it, and a `let` here would still be in its temporal dead zone:
  // `typeof x` does NOT protect against TDZ, it throws.
  var voicePanelOpen = false;          // whether the voice-chat transcript panel is open on home

  function openVoicePanel() {
    voicePanelOpen = true;
    document.body.classList.add('vc-open');
    applyVoiceLayout();
    if (currentLayout() === 'home') layoutHome();   // one place sizes the home orb
  }
  function closeVoicePanel() {
    if (!voicePanelOpen && !document.body.classList.contains('vc-open')) return;
    voicePanelOpen = false;
    document.body.classList.remove('vc-open');
    applyVoiceLayout();
    if (currentLayout() === 'home') layoutHome();
  }
  // Voice mode works on ANY page now, not just home: the panel takes the right half
  // and everything else steps aside (CSS: body.hub.vc-open / body.vc-open).
  function applyVoiceLayout() {
    const cur = currentLayout();
    if (!orbApi) return;
    const v = Math.min(window.innerWidth, window.innerHeight);
    if (PAGE[cur].mode === 'hub') {
      if (cur === 'home') {
        // home has no ring: shrink the big orb into the left gap while the panel is up
        const g = homeGeom();
        orbApi.setSize(voicePanelOpen ? Math.min(g.orbSize, g.vmin * 0.22) : g.orbSize);
        orbApi.setTop(voicePanelOpen ? g.vh * 0.5 : g.orbCy);
        const wrap = document.getElementById('orbwrap');
        if (wrap) { wrap.style.left = voicePanelOpen ? '22vw' : '50%'; }
      } else {
        orbApi.setSize(v * (voicePanelOpen ? 0.22 : orbVmin(cur)));
        orbApi.setTop(voicePanelOpen ? window.innerHeight * 0.5 : orbTopPx(cur));
      }
    }
    renderAppRing();
  }

  function vcAppend(cls, text) {
    const box = document.getElementById('vc-scroll');
    if (!box) return;
    const el = document.createElement('div');
    el.className = 'chat-msg ' + cls;
    el.textContent = text || '';
    box.appendChild(el);
    box.scrollTop = box.scrollHeight;
  }
  function vcClear() { const box = document.getElementById('vc-scroll'); if (box) box.innerHTML = ''; }
  // vcClear kept for debugging via console: vcClear() empties the transcript

  function sendVoice(text) {
    if (voiceBusy) return;
    const v = (text || '').trim();
    if (!v) return;
    voiceBusy = true; orbState('thinking');
    vcAppend('you', v);
    // abort if the backend hangs (keeps wake word alive)
    const abort = new AbortController();
    const kill = setTimeout(() => abort.abort(), 45000);
    fetch('http://localhost:2009/api/a2ui/send', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: v, session_id: 'voice-' + location.port }), signal: abort.signal })
      .then(r => r.json())
      .then(d => {
        clearTimeout(kill);
        if (d.ok) {
          orbState('idle');
          const clean = (d.reply || '').replace(/\[\[\s*SHOW\s+[^\]]*\]\]/gi, '').trim();
          vcAppend('bot', clean);
          speak(clean);
          if (d.show) {
            // navigating — close the voice panel and switch to the requested page
            stopVoice(); closeVoicePanel();
            showLayout(d.show);
          }
        } else { orbState('error'); vcAppend('err', d.error || 'Error'); }
      })
      .catch(() => { orbState('error'); vcAppend('err', 'Backend unreachable on :2009'); })
      .then(() => { voiceBusy = false; });
  }

  let ttsPause = false;                // echo guard: true while the mirror is talking
  function speak(text) {
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{23F0}-\u{23FF}\u{2B00}-\u{2BFF}]/gu, ''));
      u.lang = 'en-AU';
      // echo guard: pause recognition while the mirror talks so the mic
      // doesn't transcribe its own voice and loop it back as a command
      u.onstart = () => { ttsPause = true; try { recog && recog.abort(); } catch (err) {} };
      u.onend = () => {
        ttsPause = false;
        setTimeout(() => { if (recog && !recog._on) { try { recog.start(); } catch (err) {} } }, 300);
      };
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  function startListen() {
    if (!recog || recog._on) return;
    recog._on = true;
    try { recog.start(); } catch (e) {}
  }

  // ── typed input ─────────────────────────────────────────────────────
  // Same brain, no microphone. Enter sends, Escape leaves the field (and the
  // window-level Escape then back-steps a level).
  (function wireVoiceInput() {
    const inp = document.getElementById('vc-input');
    const btn = document.getElementById('vc-send');
    if (!inp || !btn) return;
    function submit() {
      const v = inp.value.trim();
      if (!v) return;
      inp.value = '';
      openVoicePanel();
      sendVoice(v);
    }
    btn.addEventListener('click', submit);
    inp.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); submit(); }
      else if (e.key === 'Escape') { inp.blur(); }
    });
  })();

  // ── wake word state machine ─────────────────────────────────────────
  // standby: always listening, waiting for "jarvis" or "padawan" to activate.
  // active:   panel open, every phrase is sent to the assistant; "stop" /
  //           "sleep" / "goodbye" (or Space) returns to standby.
  let active = false;
  const WAKE = /\b(jarvis|padawan)\b/i;
  const DEACTIVATE = /\b(stop|sleep|goodbye|quiet|go to sleep)\b/i;

  function activate() {
    active = true;
    openVoicePanel();
    orbState('listening');
    if (typeof speak === 'function') speak("Yes?");
  }
  function deactivate() {
    active = false;
    shownText = '';
    closeVoicePanel();
    orbState('idle');
  }

  let shownText = '';
  if (recog) {
    recog.onresult = function (e) {
      // collect final transcripts from this event
      let phrase = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) phrase += (e.results[i][0].transcript || '');
      }
      const t = phrase.trim();
      if (!t) return;

      // deactivation (only when active)
      if (active && DEACTIVATE.test(t)) { deactivate(); return; }

      // strip wake word if present (works in both states)
      let command = t;
      const wm = t.match(WAKE);
      const woke = wm && !active;
      if (wm) {
        command = t.replace(WAKE, '').trim()
          .replace(/^(hey|ok|okay|oi|yo|hi|hello)\b[,\s]*/i, '').trim()
          .replace(/^[,\s]+|[,\s]+$/g, '');
      }

      if (woke) {
        // first wake: open the speech page; send a command only if one came attached
        activate();
        if (command && command.length > 2) sendVoice(command);
        return;
      }

      // active mode: send the phrase (wake word stripped if it rode along)
      if (active) {
        if (command && command.length > 1 && command !== shownText) { shownText = command; sendVoice(command); }
        return;
      }

      // standby: ignore non-wake speech
    };
    recog.onend = function () {
      recog._on = false;
      // keep always-on standby listening (mirror is persistent);
      // hold off while TTS is speaking (echo guard) or the tab is hidden
      setTimeout(function () {
        if (!document.hidden && !ttsPause && recog && !recog._on) {
          try { recog.start(); } catch (err) {}
        }
      }, 200);
    };
    recog.onerror = function (e) {
      recog._on = false;
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        orbState('error');
        return;
      }
      // transient error -> resume standby listening (unless TTS is talking)
      setTimeout(function () {
        if (!ttsPause && recog && !recog._on) { try { recog.start(); } catch (err) {} }
      }, 300);
    };
    // start standby listening on load (browser will ask once for mic permission)
    startListen();
  }

  // Space toggles active<->standby voice chat.
  window.addEventListener('keydown', function (e) {
    if (e.target !== document.body) return;
    if (e.code !== 'Space' || e.repeat) return;
    // the player owns the screen while it is up — Space must not wake the mic behind it
    if (spPlayerOpen) return;
    e.preventDefault();
    if (active) { stopVoice(); deactivate(); }
    else { activate(); }
  });

  function stopVoice() {
    shownText = '';
    orbState('idle');
  }
// ================= boot =================
// Bring the mirror up on home. There is only one page while the site is being
// rebuilt, so anything in the URL or localStorage that is not home simply lands on
// home — a stale #schedule from the old site must not strand a blank screen.
(function boot() {
  function start() {
    showLayout('home');
    setTimeout(relayout, 320);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();

  // remember the page across reloads (the mirror is left running for days)
  var _showLayout = showLayout;
  showLayout = function (l) {
    _showLayout(l);
    try { localStorage.setItem('padawan.layout', canonicalLayout(l)); } catch (e) {}
  };
  window.addEventListener('hashchange', function () {
    showLayout(canonicalLayout(location.hash.replace(/^#/, '')));
  });
})();
</script>
</body>
</html>
